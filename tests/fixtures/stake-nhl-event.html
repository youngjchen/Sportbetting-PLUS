<!doctype html>
<html><body>
  <div class="secondary-accordion level-2 is-open">
    <div class="header"><span>Winner (Incl. Overtime and Penalties)</span></div>
    <div class="content">
      <button data-testid="fixture-outcome" aria-label="New York Rangers"><span data-testid="outcome-button-name">New York Rangers</span><span data-testid="fixture-odds">2.11</span></button>
      <button data-testid="fixture-outcome" aria-label="Tampa Bay Lightning"><span data-testid="outcome-button-name">Tampa Bay Lightning</span><span data-testid="fixture-odds">1.68</span></button>
    </div>
  </div>
  <div class="secondary-accordion level-2 is-open">
    <div class="header"><span>Total (Incl. Overtime and Penalties)</span></div>
    <div class="content">
      <div class="heading"><span>Over</span></div><div class="heading"><span>Under</span></div>
      <button data-testid="fixture-outcome" aria-label="Over (5)"><span data-testid="outcome-button-name">5</span><span data-testid="fixture-odds">1.37</span></button>
      <button data-testid="fixture-outcome" aria-label="Under (5)"><span data-testid="outcome-button-name">5</span><span data-testid="fixture-odds">2.95</span></button>
      <button data-testid="fixture-outcome" aria-label="Over (5.5)"><span data-testid="outcome-button-name">5.5</span><span data-testid="fixture-odds">1.74</span></button>
      <button data-testid="fixture-outcome" aria-label="Under (5.5)"><span data-testid="outcome-button-name">5.5</span><span data-testid="fixture-odds">2.02</span></button>
      <button data-testid="fixture-outcome" aria-label="Over (6)"><span data-testid="outcome-button-name">6</span><span data-testid="fixture-odds">1.93</span></button>
      <button data-testid="fixture-outcome" aria-label="Under (6)"><span data-testid="outcome-button-name">6</span><span data-testid="fixture-odds">1.81</span></button>
      <button data-testid="fixture-outcome" aria-label="Over (6.5)"><span data-testid="outcome-button-name">6.5</span><span data-testid="fixture-odds">2.16</span></button>
      <button data-testid="fixture-outcome" aria-label="Under (6.5)"><span data-testid="outcome-button-name">6.5</span><span data-testid="fixture-odds">1.65</span></button>
    </div>
  </div>
  <div class="secondary-accordion level-2 is-open">
    <div class="header"><span>Handicap (Incl. Overtime and Penalties)</span></div>
    <div class="content">
      <div class="heading"><span>New York Rangers</span></div><div class="heading"><span>Tampa Bay Lightning</span></div>
      <button data-testid="fixture-outcome" aria-label="New York Rangers (1.5)"><span data-testid="outcome-button-name">1.5</span><span data-testid="fixture-odds">1.45</span></button>
      <button data-testid="fixture-outcome" aria-label="Tampa Bay Lightning (-1.5)"><span data-testid="outcome-button-name">-1.5</span><span data-testid="fixture-odds">2.60</span></button>
      <button data-testid="fixture-outcome" aria-label="New York Rangers (2.5)"><span data-testid="outcome-button-name">2.5</span><span data-testid="fixture-odds">1.24</span></button>
      <button data-testid="fixture-outcome" aria-label="Tampa Bay Lightning (-2.5)"><span data-testid="outcome-button-name">-2.5</span><span data-testid="fixture-odds">3.75</span></button>
      <button data-testid="fixture-outcome" aria-label="New York Rangers (3.5)"><span data-testid="outcome-button-name">3.5</span><span data-testid="fixture-odds">1.07</span></button>
      <button data-testid="fixture-outcome" aria-label="Tampa Bay Lightning (-3.5)"><span data-testid="outcome-button-name">-3.5</span><span data-testid="fixture-odds">7.40</span></button>
    </div>
  </div>
</body></html>
