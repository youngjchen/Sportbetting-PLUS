<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL 冰球排盤板</title>
<!-- NHL 冰球獨立頁。
     卡片=棒球板 bcard 1:1 移植（2026-08-03 使用者指令「排版跟所有操作都要跟棒球的一樣」）：
     CSS/欄位網格/燈號操作(左+右−長按清零/點隊名−1)/⇄換讓分方/收合刪除/賽前✓/ⓘ近況/明牌◉欄/基準輸入/衝突框色/結算pills。
     冰球差異：三節＋延長／點球、低比分、賽前盤含延長賽與點球；無投手與模型%列。
     隊伍統計=doc.games 推導引擎。localStorage sportbetting_nhl_doc_v1 與棒球／籃球隔離。-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sports-market-monitor.css?v=2026100901">
<style>
  :root{
    /* 棒球板同款調色盤（bcard CSS 原樣移植的前提） */
    --bg:#0c0f14; --panel:#151a22; --panel-2:#1b222c; --line:#2a3340;
    --ink:#e9eef5; --ink-dim:#8a96a6;
    --lit:#ffb02e; --lit-glow:rgba(255,176,46,.55);
    --hot:#ff7a1a; --hot-glow:rgba(255,110,20,.6);
    --conflict:#ff3b5c; --cross:#b56bff; --danger:#ff5b6e;
    --nhl:#4aa8ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* 棒球架構移植：整頁不捲動,只有卡片區(#board)內捲 —— 表頭與日期列永遠固定可見,
     右側導覽列/總結面板的 top 才不會在捲動後空出一大截（2026-08-03 使用者回報） */
  html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;}
  /* z-index 400：表頭建立堆疊脈絡,內含的 ⋯ 選單必須高於總結面板(150)/導覽列(140),
     否則選單會被面板蓋住（2026-08-03 使用者回報「功能列表被蓋在最下面」的根因） */
  header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;flex:0 0 auto;z-index:400;flex-wrap:wrap}
  .logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
  .logo .dot{width:12px;height:12px;border-radius:50%;background:var(--nhl)}
  .swpill{display:inline-flex;align-items:center;gap:5px;margin:0 4px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-dim);text-decoration:none;white-space:nowrap}
  .lgchip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:14px;font-weight:700;cursor:pointer;color:var(--ink-dim)}
  .lgchip .lgdot{width:8px;height:8px;border-radius:50%}
  .lgchip.on{color:var(--ink);border-color:var(--lit);background:rgba(255,176,46,.08)}
  .hbtn{padding:5px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer}
  .stamp{margin-left:auto;color:var(--ink-dim);font-size:12.5px}
  .datebar{display:flex;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto;background:var(--bg);position:relative;z-index:5}
  .datebar .lab{color:var(--ink-dim);font-size:13px;margin-right:4px}
  .dbtn{padding:5px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .dbtn.on{background:var(--lit);color:#151006;border-color:var(--lit)}
  main{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 16px 60px;flex:1 1 auto;overflow:auto;min-height:0}
  /* 棒球版面幾何（index.html ≥1180 同款）：卡片靠左、右側讓給導覽列＋總結面板 */
  @media (min-width:1180px){
    main{align-items:flex-start;padding-left:clamp(16px,3vw,48px);padding-right:24px;}
  }
  .empty{max-width:640px;text-align:center;color:var(--ink-dim);font-size:14px;line-height:2;border:1px dashed var(--line);border-radius:14px;padding:26px 22px}
  .empty b{color:var(--ink)}

  /* ============ 棒球 bcard 移植（index.html 1278-1412 原樣;canvas 專屬碼移除） ============ */
  .card.bcard{
    width:100%; max-width:960px; overflow:visible;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line); border-radius:16px;
    box-shadow:0 10px 26px rgba(0,0,0,.45);
  }
  .card.bcard.has-strong{ border-color:rgba(255,176,46,.55); box-shadow:0 0 0 1px rgba(255,176,46,.22),0 10px 26px rgba(0,0,0,.5); }
  .card.bcard.has-conflict{ border-color:var(--conflict); }
  .card.bcard.has-cross{ border-color:var(--cross); }
  .bhead{ display:flex; align-items:center; gap:8px; padding:11px 16px 9px; border-bottom:1px solid rgba(255,255,255,.06); flex-wrap:wrap; }
  .btime{ font-family:"Oswald"; font-size:13px; letter-spacing:.04em; color:var(--ink-dim); }
  .bhead-sp{ flex:1 1 auto; }
  .bbadge{
    font-family:"Noto Sans TC"; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
    color:#ffb24d; background:rgba(255,150,40,.10); border:1px solid rgba(255,150,40,.5);
    border-radius:8px; padding:4px 10px; transition:.12s;
  }
  .bbadge:hover{ background:rgba(255,150,40,.22); }
  .bbadge.done{ color:#2ee07f; background:rgba(40,199,111,.10); border-color:rgba(40,199,111,.5); }
  .bbadge.ppd{ color:#ffb0a6; background:rgba(255,107,107,.10); border-color:rgba(255,107,107,.45); cursor:default; }
  .bico{ width:26px; height:26px; display:grid; place-items:center; border-radius:7px; cursor:pointer; color:var(--ink-dim); font-size:14px; flex:0 0 auto; }
  .bico:hover{ background:#222a36; color:var(--ink); }
  .bico.bdel:hover{ color:var(--danger); }
  .bflipbanner{ display:flex; align-items:center; gap:8px; padding:7px 16px; background:rgba(160,90,255,.16); border-bottom:1px solid rgba(160,90,255,.45); color:#d9b3ff; font-size:12.5px; font-weight:700; letter-spacing:.02em; }
  .bflipbanner .ic{ font-size:15px; }
  .card.bcard.flip{ border-color:rgba(160,90,255,.6); box-shadow:0 0 0 1px rgba(160,90,255,.3),0 10px 26px rgba(0,0,0,.5); }
  .bflipbanner.swap{ background:rgba(43,191,160,.13); border-bottom-color:rgba(43,191,160,.4); color:#7fe8d4; }
  .card.bcard.flip-swap{ border-color:rgba(43,191,160,.5); box-shadow:0 0 0 1px rgba(43,191,160,.26),0 10px 26px rgba(0,0,0,.5); }
  .bbody{ display:grid; grid-template-columns:212px 1fr; align-items:stretch; }
  .bscore{ display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; gap:4px; padding:16px 14px; border-right:1px solid rgba(255,255,255,.07); text-align:center; }
  .bana{ padding:12px 16px 16px; min-width:0; }
  .bteam{ display:flex; flex-direction:column; align-items:center; gap:3px; width:100%; }
  .bteam-nm{ font-weight:500; font-size:21px; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
  /* 模型／盤口勝率列（棒球 .bteam-pcts 原樣;先前漏移植→兩值黏在一起「模型—盤口47%」） */
  .bteam-pcts{ display:flex; gap:12px; font-family:"Oswald"; font-size:12px; line-height:1.4; }
  .bteam-pcts .pm{ color:#9fb0c4; } .bteam-pcts .pm b{ color:#d8e6f5; font-weight:700; }
  .bteam-pcts .pi{ color:#8a97a8; } .bteam-pcts .pi b{ color:#bcd0e4; font-weight:700; }
  .bteam-pcts .l{ color:var(--ink-dim); letter-spacing:.03em; margin-right:3px; }
  .bteam-sc{ font-family:"Oswald"; font-weight:700; font-size:42px; line-height:1.05; color:var(--lit); }
  .bteam-sc.live{ color:#3ad6a0; }
  .bvs{ font-family:"Oswald"; font-size:12px; letter-spacing:.16em; color:var(--ink-dim); padding:2px 0; }
  .bmid{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:0 0 auto; }
  .bmid-score{ font-family:"Oswald"; font-weight:700; font-size:38px; line-height:1; color:var(--lit); white-space:nowrap; }
  .bmid-score .c{ color:var(--ink-dim); margin:0 4px; }
  .bmid-score.live{ color:#3ad6a0; }
  .blivechip{ font-family:"Oswald"; font-size:11px; font-weight:700; letter-spacing:.05em; padding:2px 8px; border-radius:8px; white-space:nowrap; }
  .blivechip.on{ color:#3ad6a0; background:rgba(58,214,160,.15); border:1px solid rgba(58,214,160,.42); }
  .blivechip.fin{ color:#ffb24d; background:rgba(255,176,46,.14); border:1px solid rgba(255,176,46,.5); animation:blivepulse 1.8s ease-in-out infinite; }
  @keyframes blivepulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
  /* 節數表（冰球專屬,中央 VS 位;2026-07 DEMO v2 核准） */
  .bqs{ border-collapse:collapse; font-size:11px; color:var(--ink-dim); margin-top:5px; font-family:"Oswald"; }
  .bqs th{ font-weight:400; color:#5c6678; padding:1px 5px; }
  .bqs td{ padding:1px 5px; text-align:center; }
  .bqs .side{ color:var(--ink-dim); font-size:10px; }
  .bqs .liveq{ color:#3ad6a0; font-weight:700; }
  .binfo{ display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; border:1px solid var(--ink-dim); color:var(--ink-dim); font-size:11px; font-weight:700; font-family:Georgia,serif; font-style:italic; cursor:pointer; flex:0 0 auto; user-select:none; }
  .binfo:hover{ border-color:var(--lit); color:var(--lit); }
  .bpop{ position:fixed; z-index:6000; min-width:210px; max-width:320px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 34px rgba(0,0,0,.6); padding:11px 13px; font-size:12px; line-height:1.75; color:var(--ink); }
  .bpop .ph{ font-family:"Oswald"; font-size:10px; letter-spacing:.08em; color:var(--ink-dim); margin-bottom:5px; }
  .bpop .boxes{ display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
  .bpop .bx{ width:18px; height:18px; border-radius:5px; display:grid; place-items:center; font-size:10px; font-weight:700; font-family:"Oswald"; }
  .bpop .bx.w{ background:rgba(40,199,111,.16); color:#2ee07f; border:1px solid rgba(40,199,111,.45); }
  .bpop .bx.l{ background:rgba(255,92,92,.10); color:#ff7a7a; border:1px solid rgba(255,92,92,.4); }
  .bpop .bx.t{ background:rgba(255,255,255,.05); color:#8a97a8; border:1px solid var(--line); }
  .bana-head{ display:flex; align-items:center; gap:8px; padding:0 0 8px; }
  .bana-lbl{ font-family:"Oswald"; font-size:11px; letter-spacing:.1em; color:var(--ink-dim); }
  .bvenue{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .bvenue button{ font-size:11px; padding:3px 11px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer; font-family:"Noto Sans TC"; }
  .bvenue button.on{ background:#28c76f; color:#06210f; font-weight:700; }
  .bmkt-sec{ display:flex; align-items:center; gap:8px; padding:8px 0 4px; font-family:"Oswald"; font-size:11px; letter-spacing:.1em; color:var(--ink-dim); border-top:1px solid rgba(255,255,255,.06); }
  .bmkt:first-of-type .bmkt-sec{ border-top:none; }
  .bmkt-sec .mname{ color:#cdd8e6; font-size:12.5px; letter-spacing:.06em; flex:0 0 auto; font-family:"Noto Sans TC"; font-weight:700; }
  .bmkt-sec.conflict .mname{ color:var(--conflict); }
  .bmkt-sec .bswap{ cursor:pointer; color:#ff9f43; font-size:15px; line-height:1; }
  .bmkt-sec .basis{ display:inline-flex; align-items:center; gap:4px; font-size:11px; letter-spacing:0; color:var(--ink-dim); font-family:"Noto Sans TC"; }
  .bmkt-sec .basis input{ width:58px; background:#0c0f14; border:1px solid var(--line); border-radius:6px; color:var(--ink); font-size:13px; font-weight:700; text-align:center; padding:3px 2px; font-family:"Oswald"; outline:none; }
  .bmkt-sec .basis input:focus{ border-color:var(--lit); }
  .bmkt-sec .mksp{ flex:1 1 auto; }
  .bmkt-sec .bcmt{ font-size:11.5px; letter-spacing:0; color:#9fb0c4; white-space:nowrap; font-family:"Noto Sans TC"; text-align:right; }
  .bmkt-sec .bcmt .l{ color:var(--ink-dim); font-family:"Oswald"; font-size:10px; letter-spacing:.05em; margin-right:3px; }
  .bmkt-sec .bcmt .tm{ color:#9bd5ff; font-weight:600; }
  .bmkt-sec .bcmt.strong .tm{ color:#ffd27f; }
  /* 六欄網格：badge｜選項名｜燈號｜明牌◉(64px)｜注(24px)｜%(48px) —— 棒球 v2.2 定案欄距 */
  .bmkt-row{ display:grid; grid-template-columns:28px minmax(88px,126px) max-content 64px 24px 48px; align-items:center; column-gap:8px; padding:6px 0; }
  .bmkt-row .bside{ font-family:"Oswald"; font-size:11px; color:#0c0f14; background:var(--ink-dim); border-radius:5px; padding:3px 0; width:100%; text-align:center; font-weight:700; justify-self:stretch; }
  .bmkt-row .bside.give{ background:var(--lit); }
  .bmkt-row .bside.recv{ background:#5b6b80; color:#dfe6ef; }
  .bmkt-row .bnm{ min-width:0; font-weight:700; font-size:17px; line-height:1.15; color:var(--ink); cursor:default; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
  .bmkt-row .bnm .hv{ display:block; margin:2px 0 0; overflow:hidden; text-overflow:ellipsis; color:var(--ink-dim); font-family:"Oswald"; font-size:11px; font-weight:700; }
  .bmkt-row.conflict .bnm{ color:var(--conflict); }
  .blights{ display:flex; align-items:center; gap:7px; cursor:pointer; justify-self:start; padding:3px 0; }
  .blights .lt{ width:19px; height:19px; border-radius:50%; flex:0 0 auto; cursor:pointer; transition:.1s; }
  .blights .lt.off{ border:1.5px solid #44556a; background:transparent; }
  .blights .lt.amber{ background:radial-gradient(circle at 35% 30%, #ffe39a, var(--lit) 70%); box-shadow:0 0 8px var(--lit-glow); }
  .blights .lt.red{ background:radial-gradient(circle at 35% 30%, #ffc2a0, var(--hot) 72%); box-shadow:0 0 9px var(--hot-glow); }
  .blights .lt.purple{ background:radial-gradient(circle at 35% 30%, #e6c2ff, #a05aff 72%); box-shadow:0 0 9px rgba(160,90,255,.55); }
  .betchip{ font-size:11px; border:1.5px dashed #4a5a70; border-radius:6px; color:var(--ink-dim); cursor:pointer; user-select:none; width:26px; text-align:center; line-height:1.55; justify-self:center; padding:1px 0; }
  .betchip.on{ border:1.5px solid var(--lit); color:#1a1205; font-weight:700; background:var(--lit); box-shadow:0 0 8px var(--lit-glow); }
  .bmkt-row .bcover{ font-family:"Oswald"; font-weight:700; font-size:15px; color:#aeb9c8; justify-self:end; white-space:nowrap; }
  .bmkt-row .bcover.hi{ color:#28c76f; } .bmkt-row .bcover.lo{ color:var(--conflict); } .bmkt-row .bcover.ls{ color:#5b6b80; }
  .bmkt-row .bcover .ss{ font-size:9px; color:#5b6b80; }
  .intl-strip{ display:flex; align-items:center; gap:8px; background:rgba(58,160,255,.07); border:1px solid rgba(58,160,255,.3); border-radius:8px; padding:6px 10px; margin:8px 6px 2px; font-size:13px; cursor:pointer; line-height:1.6; }
  .intl-more{ display:none; color:var(--ink-dim); font-size:12.5px; padding:5px 12px 2px; line-height:1.8; }
  .intl-strip.open + .intl-more{ display:block; }
  .bsettled{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px 12px; border-top:1px solid rgba(255,255,255,.06); }
  .bpill{ font-size:12px; font-weight:700; padding:3px 9px; border-radius:7px; border:1px solid var(--line); color:var(--ink-dim); }
  .bpill.hit{ color:#2ee07f; border-color:rgba(40,199,111,.5); background:rgba(40,199,111,.08); }
  .bpill.miss{ color:#ff6b6b; border-color:rgba(255,59,92,.5); background:rgba(255,59,92,.08); }
  .bpill.void{ color:#9fb0c4; }
  .bpill.sc{ color:var(--ink); border-color:var(--lit); background:rgba(255,176,46,.06); }
  @media (min-width:1180px){ .card.bcard{ max-width:672px; zoom:1.4; } }
  @media (min-width:1180px) and (max-width:1439px){ .card.bcard{ zoom:1.2; } }   /* 中尺寸桌機：卡片略縮，騰出空間給導覽列＋面板（與棒球同步） */
  @media (min-width:900px) and (max-width:1179px){ .card.bcard{ zoom:1.2; } }
  @media (max-width:680px){
    .bbody{ grid-template-columns:minmax(0,1fr); }   /* minmax(0,…)：欄寬不被內容撐超過卡片（手機右側溢出） */
    .bscore{ flex-direction:row; justify-content:space-between; border-right:none; border-bottom:1px solid rgba(255,255,255,.07); padding:12px 14px; }
    .bteam{ width:auto; }
  }
  /* ===== 結算視窗（棒球版移植） ===== */
  #settleModal{ position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:20px; }
  #settleModal.show{ display:flex; }
  #settleModal .box{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px 0; width:464px; max-width:100%; box-shadow:0 16px 48px rgba(0,0,0,.7); max-height:90vh; overflow:auto; }
  /* 按鈕列凍結在視窗底部：長表單不必捲到最下面才按得到（2026-08-03 使用者要求） */
  #settleModal .settle-actions{
    position:sticky; bottom:0; z-index:2; display:flex; gap:8px; flex-wrap:wrap;
    margin:16px -20px 0; padding:12px 20px; background:var(--panel);
    border-top:1px solid var(--line); box-shadow:0 -8px 18px rgba(0,0,0,.35);
  }
  #settleModal h3{ margin:0 0 4px; font-size:16px; }
  #settleModal .sub{ color:var(--ink-dim); font-size:12px; margin-bottom:14px; }
  #settleModal .btn{ padding:8px 14px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--ink); font-size:13.5px; font-weight:700; cursor:pointer; }
  #settleModal .odds-grid{ display:grid; grid-template-columns:74px 1fr 1fr; gap:8px 10px; align-items:center; margin-top:10px; }
  #settleModal .odds-grid .og-h{ font-size:11px; color:var(--ink-dim); text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #settleModal .odds-grid .og-l{ font-size:12px; color:var(--ink-dim); font-family:"Oswald"; letter-spacing:.04em; }
  #settleModal .odds-grid input{ width:100%; padding:7px 8px; text-align:center; background:#1b232e; border:1px solid var(--line); border-radius:7px; color:var(--ink); font-size:15px; font-family:"Oswald"; }
  #settleModal .odds-grid input:focus{ outline:none; border-color:var(--lit); }
  #settleModal .odds-grid input.dash{ background:#161d27; border-style:dashed; }
  .settle-q{ margin:14px 0; }
  .settle-q .qlabel{ font-size:13px; color:var(--ink-dim); margin-bottom:6px; font-family:"Oswald"; letter-spacing:.05em; display:flex; align-items:center; gap:8px; }
  .settle-q .qline{ margin-left:auto; font-size:11px; color:var(--ink-dim); display:flex; align-items:center; gap:4px; letter-spacing:0; }
  .settle-q .qline input{ width:54px; padding:4px 5px; text-align:center; background:#161d27; border:1px dashed var(--line); border-radius:6px; color:var(--ink); font-size:13px; font-family:"Oswald"; }
  .settle-q .opts{ display:flex; gap:6px; flex-wrap:wrap; }
  .settle-q .opt{ flex:1 1 auto; min-width:80px; padding:10px 12px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); font-size:14px; font-weight:700; cursor:pointer; text-align:center; }
  .settle-q .opt:hover{ border-color:#46566a; }

<script>
"use strict";
// ===== 文檔（與棒球板完全隔離的命名空間）=====
const DOC_KEY = "sportbetting_nhl_doc_v1";
const DEFAULT_NHL_HD_FAV = "home";
const DEFAULT_NHL_TOTAL_LINE = 6.5;
function loadDoc(){ try{ return JSON.parse(localStorage.getItem(DOC_KEY)) || null; }catch(e){ return null; } }
function saveDoc(d){
  const payload=JSON.stringify(d);
  if(window.__storagePressure) window.__storagePressure.setCritical(localStorage, DOC_KEY, payload);
  else localStorage.setItem(DOC_KEY, payload);
}
try{ if(window.__storagePressure) window.__storagePressure.cleanup(localStorage, false); }catch(_){}
let doc = loadDoc() || { v:1, activeDate: today(), boards:{} };
if(!doc.games) doc.games = [];
if(!doc.activeLeague) doc.activeLeague = "NHL";
if(!doc.covMode) doc.covMode = "venue";   // venue=主客 / all=綜（棒球 venueMode split/combined 同義）
if(!doc.covWin) doc.covWin = "season";    // 過盤率視窗:season|10|30（棒球同款）
if(!doc.covThr) doc.covThr = 0.55;        // 過盤率高亮門檻（棒球同款 55/60/65）
if(!doc.cols) doc.cols = "auto";
if(!doc.uiScale) doc.uiScale = 1;
// ===== 復原（棒球 snapshot 系統移植;燈/注/⇄/收合/刪除/結算前存快照,⌘Z 或選單復原） =====
const _snaps = [];
function snapshot(){
  try{ _snaps.push(JSON.stringify({ boards: doc.boards, games: doc.games })); if(_snaps.length>30) _snaps.shift();
    const b=document.getElementById("undoBtn"); if(b) b.disabled=false; }catch(_){}
}
function undo(){
  const s = _snaps.pop(); if(!s) return;
  try{ const o = JSON.parse(s); doc.boards = o.boards; doc.games = o.games;
    bumpGamesVersion(); saveDoc(doc); render(); }catch(_){}
  const b=document.getElementById("undoBtn"); if(b) b.disabled = !_snaps.length;
}
document.addEventListener("keydown",(e)=>{ if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); } });
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const esc = (s)=> String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (sel)=> document.querySelector(sel);
// nhl-picks-addon.js（棒球 expert-picks-addon 複製版）依賴的棒球全域介面
function leagueOf(){ return "nhl"; }
function save(){ saveDoc(doc); }
function fmtDate(d){ const p=d.split("-"); return `${parseInt(p[1])}/${parseInt(p[2])}`; }
const SAMPLE_MIN = 10;  // NHL 84 場、主客拆分後採 10 場才高亮，樣本數仍完整顯示

// ===== 聯盟 =====
const LEAGUES = {
  NHL: { name:"NHL", colorHex:"#4aa8ff", teams:["企鵝","佛羅里","加人","加拿大","參議員","噴射機","國王","島人","巨鴨","掠奪者","棕熊","楓葉","油人","海怪","火焰","猛瑪象","紅翼","荒野","藍衣","藍調","軍刀","遊騎兵","達拉斯","閃電","雪崩","颶風","飛人","首都","騎士","魔鬼","鯊魚","黑鷹"] }
};

// ============================================================
// GAMES — 統計唯一真相源（棒球板引擎移植;快取鍵帶聯盟避免跨運動同名隊衝突）
// doc.games = [{sid,date,league,awayTeam,homeTeam,awayScore,homeScore,hdFav,hdVal,totBasis,mlOffered,manual?}]
// ============================================================
function seasonOf(dateStr){
  const m=/^(\d{4})-(\d{2})/.exec(String(dateStr||""));
  const now=new Date(), year=m?+m[1]:now.getFullYear(), month=m?+m[2]:now.getMonth()+1;
  const start=month>=7?year:year-1;
  return `${start}-${String((start+1)%100).padStart(2,"0")}`;
}
function emptyTeamRow(){
  return {
    ml:   { home:{w:0,l:0,t:0}, away:{w:0,l:0,t:0} },
    hd:   { home:{w:0,l:0},     away:{w:0,l:0}     },
    recv: { home:{w:0,l:0},     away:{w:0,l:0}     },
    tot:  { home:{w:0,l:0},     away:{w:0,l:0}     }
  };
}
let _statsCache = { version:-1, byKey:{} };
function bumpGamesVersion(){
  doc.gamesVersion = (doc.gamesVersion||0) + 1;
  _statsCache = { version:-1, byKey:{} };
}
function _gameResultFor(team, g){
  if(g.awayTeam!==team && g.homeTeam!==team) return null;
  const isAway = g.awayTeam===team;
  const venue = isAway ? "away" : "home";
  const teamScore = isAway ? g.awayScore : g.homeScore;
  const oppScore  = isAway ? g.homeScore : g.awayScore;
  const out = { venue };
  if(teamScore!=null && oppScore!=null && g.mlOffered!==false){
    if(teamScore === oppScore) out.ml = "t";
    else out.ml = (teamScore-oppScore)>0 ? "w" : "l";
  }
  if(g.hdFav && g.hdVal!=null && teamScore!=null && oppScore!=null){
    const favTeam = g.hdFav==="away" ? g.awayTeam : g.homeTeam;
    const isFav = favTeam === team;
    const favScore = isFav ? teamScore : oppScore;
    const undScore = isFav ? oppScore : teamScore;
    const diff = (favScore - undScore) - g.hdVal;
    if(diff !== 0){
      const favCovered = diff > 0;
      if(isFav) out.hd = favCovered ? "w" : "l";
      else      out.recv = favCovered ? "l" : "w";
    }
  }
  if(g.totBasis!=null && teamScore!=null && oppScore!=null){
    const tot = teamScore + oppScore;
    if(tot !== g.totBasis) out.tot = (tot > g.totBasis) ? "w" : "l";
  }
  return out;
}
function _rebuildTeamCache(league, team){
  const bySeason = {};
  for(const g of (doc.games||[])){
    if(g.league!==league) continue;
    if(g.awayTeam!==team && g.homeTeam!==team) continue;
    if(g.awayScore==null || g.homeScore==null) continue;
    const season = seasonOf(g.date);
    if(!bySeason[season]) bySeason[season] = emptyTeamRow();
    const row = bySeason[season];
    const r = _gameResultFor(team, g);
    if(!r) continue;
    if(r.ml === "w") row.ml[r.venue].w++;
    else if(r.ml === "l") row.ml[r.venue].l++;
    else if(r.ml === "t") row.ml[r.venue].t++;
    if(r.hd === "w") row.hd[r.venue].w++;
    else if(r.hd === "l") row.hd[r.venue].l++;
    if(r.recv === "w") row.recv[r.venue].w++;
    else if(r.recv === "l") row.recv[r.venue].l++;
    if(r.tot === "w") row.tot[r.venue].w++;
    else if(r.tot === "l") row.tot[r.venue].l++;
  }
  _statsCache.byKey[league+"|"+team] = bySeason;
}
function _getTeamSeasonRow(league, season, team){
  if(_statsCache.version !== (doc.gamesVersion||0)) _statsCache = { version:(doc.gamesVersion||0), byKey:{} };
  const k = league+"|"+team;
  if(!_statsCache.byKey[k]) _rebuildTeamCache(league, team);
  return (_statsCache.byKey[k] && _statsCache.byKey[k][season]) || emptyTeamRow();
}
function statRead(league, season, team, market, venue){
  const row = _getTeamSeasonRow(league, season, team)[market];
  if(venue) return {...row[venue], t:row[venue].t||0};
  const h=row.home, a=row.away;
  return { w:(h.w||0)+(a.w||0), l:(h.l||0)+(a.l||0), t:(h.t||0)+(a.t||0) };
}
function pctStr(rec){ const d=(rec.w||0)+(rec.l||0); return d===0 ? null : Math.round((rec.w/d)*100)+"%"; }
function pctNum(rec){ const d=(rec.w||0)+(rec.l||0); return d===0 ? null : rec.w/d; }
function runsRead(league, season, team, venue){
  let scored=0, conceded=0, games=0;
  for(const g of (doc.games||[])){
    if(g.league!==league) continue;
    if(g.awayTeam!==team && g.homeTeam!==team) continue;
    if(seasonOf(g.date) !== season) continue;
    if(g.awayScore==null || g.homeScore==null) continue;
    const isAway = g.awayTeam===team;
    if(venue==="home" && isAway) continue;
    if(venue==="away" && !isAway) continue;
    scored += isAway ? g.awayScore : g.homeScore;
    conceded += isAway ? g.homeScore : g.awayScore;
    games++;
  }
  return { scored, conceded, games };
}
function streakRead(league, season, team, venue){
  const list = (doc.games||[]).filter(g=>{
    if(g.league!==league) return false;
    if(g.awayTeam!==team && g.homeTeam!==team) return false;
    if(seasonOf(g.date) !== season) return false;
    if(g.awayScore==null || g.homeScore==null) return false;
    if(venue){
      const isAway = g.awayTeam===team;
      if(venue==="home" && isAway) return false;
      if(venue==="away" && !isAway) return false;
    }
    return true;
  }).sort((a,b)=> a.date < b.date ? 1 : -1);
  let kind = "", n = 0;
  for(let i=0;i<list.length;i++){
    const won = ((list[i].awayTeam===team ? list[i].awayScore : list[i].homeScore) >
                 (list[i].awayTeam===team ? list[i].homeScore : list[i].awayScore));
    if(i===0){ kind = won?"W":"L"; n=1; continue; }
    if((won && kind==="W") || (!won && kind==="L")) n++;
    else break;
  }
  return { n, kind };
}
function streakStr(s){ return (!s || s.n===0) ? "—" : `${s.n}${s.kind}`; }
function recentResults(league, season, team, n){
  const list = (doc.games||[]).filter(g=>{
    if(g.league!==league) return false;
    if(g.awayTeam!==team && g.homeTeam!==team) return false;
    if(seasonOf(g.date) !== season) return false;
    if(g.awayScore==null || g.homeScore==null) return false;
    return true;
  }).sort((a,b)=> a.date < b.date ? 1 : -1).slice(0, n).reverse();
  return list.map(g=>{
    const isAway = g.awayTeam===team;
    const my = isAway?g.awayScore:g.homeScore, op = isAway?g.homeScore:g.awayScore;
    return { r: my>op?"w":(my<op?"l":"t"), date:g.date, opp:isAway?g.homeTeam:g.awayTeam, my, op, venue:isAway?"away":"home" };
  });
}
function gameUpsert(g){
  if(!doc.games) doc.games = [];
  let idx = g.sid ? doc.games.findIndex(x => x.sid === g.sid) : -1;
  if(idx<0) idx = doc.games.findIndex(x => x.date===g.date && x.league===g.league && x.awayTeam===g.awayTeam && x.homeTeam===g.homeTeam);
  if(idx<0) doc.games.push(g); else doc.games[idx] = g;
}
function gameFind(sid, date, league, away, home){
  return (doc.games||[]).find(x => x.sid===sid || (x.date===date && x.league===league && x.awayTeam===away && x.homeTeam===home)) || null;
}

// ===== NHL 種子載入 =====
async function loadSeedGames(){
  try{
    const r = await fetch(`data/nhl_games.json?t=${Date.now()}`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    if(!j || !Array.isArray(j.games)) throw new Error("格式不符");
    for(const g of j.games){
      const old = gameFind(g.sid, g.date, "NHL", g.awayTeam, g.homeTeam);
      if(old && old.manual) continue;                    // 手動覆蓋優先
      gameUpsert(g);
    }
    bumpGamesVersion(); saveDoc(doc);
    const el = $("#stamp"); if(el && !/資料更新/.test(el.textContent)) el.textContent = `NHL 數據 ${j.count} 場 · ${String(j.builtAt||"").slice(0,10)}`;
    if($("#statspage").classList.contains("show")) renderStatsPage();
    render();
  }catch(e){
    const el = $("#stamp"); if(el) el.textContent = `種子載入失敗(${e.message}) · 用本機快取`;
  }
}

// ===== 每日管線載入 =====
let pregameCache = { updated:null, games:[] };
let stakeOddsCache = { updated:null, games:{} };
let oddsCache = { updated:null, games:{} };
let seriesCache = {};
async function loadPregame(){
  try{
    const r = await fetch(`data/nhl_pregame.json?t=${Date.now()}`);
    if(r.ok){ const j = await r.json(); if(j && Array.isArray(j.games)){ pregameCache = j; autoSettleFromPregame();
      const st=$("#stamp"); if(st && j.updated){ const d=new Date(j.updated); if(!isNaN(d)){ const t=new Date(d.getTime()+8*3600e3);

function autoSettleFromPregame(){
  let changed = false;
  for(const g of pregameCache.games||[]){
    // 賽前／進行中：資料檔還有這場時先記即時快照（結算時資料常已滾出資料檔，或 Stake／BET365 尚未載入）
    { const b0=doc.boards[g.date], it0=b0&&b0.items&&b0.items.find(x=>x.id===g.officialId);
      if(it0 && !it0.settled){ const live=nhlLiveSnap(g); if(live && nhlSnapScore(live)>=nhlSnapScore(it0.anomLive) && JSON.stringify(it0.anomLive||null)!==JSON.stringify(live)){ it0.anomLive=live; changed=true; } } }
    if(g.status!=="finished" || g.awayScore==null || g.homeScore==null) continue;
    const it = ensureItem(g.date, g.officialId);
    const model = modelFromPregame(g);
    const useHd = model.hdFav && model.hdVal!=null;
    const useMl = !!((model.stake&&model.stake.ml)||(model.bet365&&model.bet365.ml)) || g.mlOffered!==false;
    const rec = { sid:g.officialId, date:g.date, league:"NHL", awayTeam:g.away, homeTeam:g.home,
      awayScore:g.awayScore, homeScore:g.homeScore,
      hdFav:useHd?model.hdFav:null, hdVal:useHd?model.hdVal:null,
      totBasis:totalLineFor(it, model), mlOffered:useMl,
      decidedBy:g.decidedBy||null };
    const old = gameFind(rec.sid, rec.date, "NHL", rec.awayTeam, rec.homeTeam);
    if(old && old.manual) continue;                      // 手動覆蓋不被管線洗掉
    // it.settled 同步（手動結算優先;卡片 pills／戰績／導覽全讀這份=棒球資料流）
    // 異常快照落印：Bet365 官方賠率與卡片盤口狀態一併保存，供結算後回看。
    // 異常快照落印：還沒有快照或快照不完整（缺收盤關係）時，用更完整的來源補上；完整的快照絕不被覆蓋。
    // 來源優先：此刻資料檔（比賽仍在滾動窗內）→ 賽前即時快照 anomLive。（2026-10-09：60 場快照因載入時序全為空）
    if(nhlSnapScore(it.anomSnap) < 4){
      const now = nhlLiveSnap(g), cands = [now, it.anomLive].filter(Boolean);
      const fresh = cands.sort((a,b)=>nhlSnapScore(b)-nhlSnapScore(a))[0];
      if(fresh && nhlSnapScore(fresh) > nhlSnapScore(it.anomSnap)){ it.anomSnap = fresh; changed = true; }
      else if(!it.anomSnap){ it.anomSnap = { flip:false, bswaps:0, lsw:0, stakeSwaps:0, bet365Swaps:0, flipState:"none", relation:null, mlFav:null }; }
    }
    if(!it.settled || !it.settled.manual){
      const auto = computeAutoSettled(model);
      if(auto && JSON.stringify(it.settled||null)!==JSON.stringify(auto)){ it.settled = auto; changed = true; }
    }
    if(old && JSON.stringify(old)===JSON.stringify(rec)) continue;
    gameUpsert(rec); changed = true;
  }
  if(changed){ bumpGamesVersion(); saveDoc(doc); }
}

function recentRec(league, season, team, market, venue, n){

    if(g.league!==league) return false;

    if(seasonOf(g.date)!==season) return false;
    if(g.awayScore==null||g.homeScore==null) return false;
    if(venue){ const isAway=g.awayTeam===team; if(venue==="home"&&isAway) return false; if(venue==="away"&&!isAway) return false; }
    return true;
  }).sort((a,b)=> a.date<b.date?1:-1);
  const out={w:0,l:0}; let took=0;
  for(const g of list){
    const r=_gameResultFor(team,g); if(!r) continue;
    const res=r[market]; if(res==null) continue;

}

// ===== 結算語義（it.settled=棒球同構;自動路徑由管線比分+盤口推導,手動視窗覆蓋） =====
function computeAutoSettled(model){
  const a=model.awayScore, h=model.homeScore;
  if(a==null||h==null) return null;
  const s = { awayScore:a, homeScore:h, decidedBy:model.decidedBy||null };
  s.ml = a>h ? "away" : "home";
  if(model.hdFav && model.hdVal!=null){
    const favM = model.hdFav==="home" ? (h-a) : (a-h);
    s.hd = favM - model.hdVal > 0 ? "cover" : (favM - model.hdVal === 0 ? "push" : "nocover");
  }
  const totalLine = totalLineFor(model._item, model);
  if(totalLine!=null){
    const t=a+h; s.tot = t>totalLine ? "over" : (t===totalLine ? "push" : "under");
  }
  return s;
}

function collectSummary(models){
  const strong = [], conflicts = [];
  models.forEach(m=>{
    const it = m._item;
    if(it.settled || m.status==="finished") return;   // 已結算/已終場退出即時總結
    const favSide = m.hdFav||"home", undSide = favSide==="away"?"home":"away";
    const favName = favSide==="away"?m.away:m.home, undName = undSide==="away"?m.away:m.home;
    const matchName = `${m.away}/${m.home}`;
    const lg = leagueOfModel(m);
    const mlC  = it.mlAway.lights>0 && it.mlHome.lights>0;
    const hdC  = it.hdGive.lights>0 && it.hdRecv.lights>0;
    const totC = it.over.lights>0  && it.under.lights>0;
    const oppML = (undSide==="away") ? it.mlAway.lights : it.mlHome.lights;
    const crossC = it.hdGive.lights>0 && oppML>0;
    if(mlC)  conflicts.push({matchName, league:lg, market:"獨贏", kind:"same"});
    if(hdC)  conflicts.push({matchName, league:lg, market:"讓分", kind:"same"});
    if(totC) conflicts.push({matchName, league:lg, market:"大小分", kind:"same"});
    if(crossC) conflicts.push({matchName, league:lg, market:"讓分↔對手獨贏", kind:"cross"});
    const hv = m.hdVal!=null?` ${m.hdVal}`:"", tv = m.totLine!=null?` ${m.totLine}`:"";
    const add=(cond,lights,pick,mk,market)=>{ if(cond && lights>=3) strong.push({matchName, league:lg, pick, mk, n:lights, m, market}); };
    add(!mlC && !(crossC && undSide==="away"), it.mlAway.lights, m.away, "獨贏", "ml");
    add(!mlC && !(crossC && undSide==="home"), it.mlHome.lights, m.home, "獨贏", "ml");
    add(!hdC && !crossC, it.hdGive.lights, favName, "讓"+hv, "hd");
    add(!hdC, it.hdRecv.lights, undName, "受讓"+hv, "recv");
    add(!totC, it.over.lights,  "大分", "大小分"+tv, "tot");
    add(!totC, it.under.lights, "小分", "大小分"+tv, "tot");
    try{
      const eps = (window.__expertPicks && window.__expertPicks.epStrong) ? window.__expertPicks.epStrong(m, doc.activeDate) : {recs:[],splits:[]};
      eps.recs.forEach(r=> strong.push({matchName, league:lg, pick:r.pick, mk:r.mk, n:r.w, m, market:r.market, ep:true, np:r.n, tipLine:r.tipLine}));
      eps.splits.forEach(sp=> conflicts.push({matchName, league:lg, market:`${sp.market}明牌分歧 ${sp.txt}`, kind:"ep"}));
    }catch(_){}
  });
  strong.forEach(s=>{ if(!s.ep){ const e=strong.find(x=>x.ep && !x.drop && x.m===s.m && x.market===s.market && x.pick===s.pick
      && (x.tipLine==null || (s.market==="hd" ? x.tipLine<0 : s.market==="recv" ? x.tipLine>0 : true))); if(e){ s.dual=true; s.epW=e.n; s.np=e.np; e.drop=true; } } });
  const strongOut = strong.filter(s=>!s.drop);
  strongOut.sort((a,b)=> ((b.dual?1:0)-(a.dual?1:0)) || b.n-a.n);
  return {strong: strongOut, conflicts};
}

      if(it.hdRecv.bet && rv!=="push"){ const h=rv==="cover"; (h?r.bet.hit++:r.bet.miss++); det("注",und+" 受讓",h); }

      if(it.under.bet){ const h=st==="under"; (h?r.bet.hit++:r.bet.miss++); det("注","小"+tv,h); }

function nhlAnomClassify(ev, it, hdFav){

    else if(manual==="converged_bet365"){ s=false; b=true; comboKnown=true; }

  }
  const combo = (s&&b) ? "both" : s ? "stake" : b ? "bet365" : "none";

function collectCrossTab(leagueFilter){

  const grp={};
  for(const k of ["flip","conv"]){ grp[k]={ all:cell(), div:cell(), unknown:cell() }; for(const c of NHL_ANOM_COMBOS[k]) grp[k][c]=cell(); }
  const other={ divOnly:cell() };
  let total=0;
  for(const d of Object.keys(doc.boards||{})){
    for(const it of ((doc.boards[d]||{}).items||[])){
      if(!it.settled || it.settled.awayScore==null) continue;
      const rec=(doc.games||[]).find(x=>x.sid===it.id); if(!rec) continue;
      if(leagueFilter && leagueFilter!=="all" && String(rec.league||"").toLowerCase()!==leagueFilter) continue;
      const ev = nhlAnomEvidence(null, it);
      const cls = nhlAnomClassify(ev, it, rec.hdFav); if(!cls) continue;
      total++;
      const margin=rec.homeScore-rec.awayScore, winner=margin>0?"home":margin<0?"away":null;
      const favMargin = rec.hdFav ? (rec.hdFav==="home"?margin:-margin) : null;
      const o={ date:d, away:rec.awayTeam, home:rec.homeTeam, aScore:rec.awayScore, hScore:rec.homeScore, itId:it.id,

                hd: (favMargin!=null && rec.hdVal!=null) ? rvResultOf(favMargin, rec.hdVal) : null,
                tot: rvTotalOf(rec.awayScore+rec.homeScore, rec.totBasis) };
      const upd=(c)=>{
        c.n++; c.games.push(o);
        if(o.fv && winner){ c.fwN++; if(winner===o.fv) c.fw++; }                        // 熱門＝獨贏賠率較低的那隊

        if(o.tot==="over"||o.tot==="under"){ c.ovN++; if(o.tot==="over") c.ov++; }

      if(cls.kind==="other"){ upd(other.divOnly); continue; }
      const G=grp[cls.kind]; upd(G.all);
      upd(cls.div ? G.div : (cls.combo ? G[cls.combo] : G.unknown));
    }
  }
  return { total, grp, other };
}

// ===== 對戰導覽列（棒球版移植） =====
let _navDrag=null;
// 卡片框色與列表標籤共用的異常分類：flip＝顛倒(紫)、flip-was＝收斂(藍)、flip-swap＝對調(青綠)。
// 判定規則與原卡片框色相同（手標＞Stake × BET365 自動分類＞國際軸），只是列表也跟著顯示。
function cardAnomClass(model, it){
  const isNhl = model.league==="NHL";
  const favSide = model.hdFav || "home";
  const intl = isNhl ? intlFor(model) : null;
  const stakeObserved = isNhl ? (model.stakeObserved||stakeOddsFor(model)) : null;
  const bet365 = isNhl ? (model.bet365||bet365OddsFor(model)) : null;
  const hdHistory = isNhl ? handicapHistoryFor(stakeObserved, bet365) : null;
  const lsw = isNhl ? lswFor(model) : 0;
  const hasLine = model.hdVal!=null && (model.hdSrc==="STAKE" || model.hdSrc==="BET365");
  const displayFlipState = cardFlipState(it, hdHistory&&hdHistory.classification||"none");
  if(it.platformFlip || displayFlipState==="flipped") return "flip";
  if(it.flipVanished || /^converged/.test(displayFlipState)) return "flip-was";
  if(it.preGameSwap) return "flip-swap";
  if(intl && hasLine && ((intl.fav==="away") !== (favSide==="away"))) return "flip";
  if((hdHistory&&(hdHistory.stake.swapCount>0||hdHistory.bet365.swapCount>0)) || lsw>0 || (intl && intl.flips>0)) return "flip-swap";
  return null;
}
function navMatchState(m, it){
  const anom = cardAnomClass(m, it);                     // 與卡片框色同源：顛倒(紫)／收斂(藍)／對調(青綠)
  if(anom==="flip") return "st-flip";
  if(anom==="flip-was") return "st-flip-was";
  if(anom==="flip-swap") return "st-swap";
  if(it.settled || m.status==="finished") return "st-full";   // 已結算(綠)
  // 黃色＝「使用者自己填了幾組賠率」（棒球同義:開盤/下注/收盤三組）——
  // 管線有自動基準線不算「填過賠率」（賠率尚未填寫時不可呈金色）
  let c=0;
  if(it.openOddsAway!=null && it.openOddsHome!=null) c++;
  if(it.flipOddsAway!=null && it.flipOddsHome!=null) c++;
  if(it.closeOddsAway!=null && it.closeOddsHome!=null) c++;
  return c<=0 ? "st-empty" : ("st-odds"+c);
}
// 棒球 index.html layoutRightColumns() 原樣移植（2026-08-03：先前自寫版本 top 寫死 74px、
// 面板高度隨內容＝與棒球不同,使用者三度指正）。常數與行為全部照抄：
//   top = 日期列底部 + 8（動態,不寫死）；NAVW 256 / GAP 20 / PGAP 14 / EDGE 14
//   導覽列 maxHeight = 視窗高 − top − 16；總結面板 top→bottom:14 撐滿、sumbody 內捲
// 上緣＝日期列底部 + 卡片區的 padding-top ＝ 與第一張卡片頂端切齊
// （2026-08-03 使用者：「沒有與比賽卡片對齊」；棒球用 +8 是因其卡片容器另有內距,對齊結果相同）
function summaryTopPad(){
  const d = document.querySelector("#datebar") || document.querySelector("header");
  const b = d ? d.getBoundingClientRect().bottom : 60;
  const main = document.getElementById("board");
  const pad = main ? (parseInt(getComputedStyle(main).paddingTop, 10) || 22) : 22;
  return Math.round(b) + pad;
}
function layoutRightColumns(){
  const nav = document.getElementById("matchnav");
  const panel = document.getElementById("summary");
  if(window.innerWidth < 1180){ if(nav) nav.style.width = ""; return; }
  const firstCard = document.querySelector("#board .card.bcard");
  const cardRight = firstCard ? Math.round(firstCard.getBoundingClientRect().right) : 900;
  const top = summaryTopPad();
  const NAVW = 256, GAP = 20, PGAP = 14, EDGE = 14, SUM_MIN = 300;
  const zc = document.getElementById("zoomctl");
  const zr = (zc && zc.offsetWidth) ? zc.offsetWidth + 10 : 0;     // 右下快捷鍵欄：面板右緣讓出這一欄，數字不再被按鈕蓋住
  const navShown = !!(nav && nav.style.display !== "none");
  const colLeft = cardRight + GAP;
  const avail = window.innerWidth - EDGE - colLeft;                  // 卡片右側可用總寬
  // 並排時面板寬 < 300px 會把「1 強訊號」擠成直排 → 導覽列與面板改成上下疊成同一欄、同寬（與棒球同步）
  const stacked = navShown && (avail - NAVW - PGAP - zr) < SUM_MIN;
  let panelLeft = cardRight + PGAP, panelTop = top;
  if(navShown){
    nav.style.left = colLeft + "px"; nav.style.right = "auto";
    nav.style.top = top + "px"; nav.style.bottom = "auto";
    if(stacked){
      nav.style.width = Math.max(NAVW, avail) + "px";
      nav.style.maxHeight = Math.max(160, window.innerHeight - top - EDGE - PGAP - 200) + "px";   // 列表盡量完整，面板至少留 200px
      panelLeft = colLeft;
      panelTop = top + nav.offsetHeight + PGAP;
    } else {
      nav.style.width = "";
      nav.style.maxHeight = (window.innerHeight - top - 16) + "px";
      panelLeft = colLeft + (nav.offsetWidth || NAVW) + PGAP;
    }
  }
  if(panel){
    panel.style.left = panelLeft + "px";
    panel.style.right = (EDGE + zr) + "px"; panel.style.width = "auto";
    panel.style.top = panelTop + "px"; panel.style.bottom = EDGE + "px";
    panel.style.display = "flex"; panel.style.flexDirection = "column";
    const body = panel.querySelector(".sumbody");
    if(body){ body.style.maxHeight = "none"; body.style.flex = "1 1 auto"; body.style.minHeight = "0"; body.style.overflowY = "auto"; }
  }
}
window.addEventListener("resize", ()=>{ clearTimeout(window.__lrcT); window.__lrcT=setTimeout(layoutRightColumns, 150); });

    const flips = models.filter(isAnom).sort(cmp);
    if(flips.length){ sec("異常場"); flips.forEach(m=>body.appendChild(tag(m))); }
    const rest = models.filter(m=>!isAnom(m)).sort(cmp);
    if(rest.length){ sec(doc.activeLeague); rest.forEach(m=>body.appendChild(tag(m))); }
  } else {
    sec(doc.activeLeague);
    models.slice().sort(cmp).forEach(m=>body.appendChild(tag(m)));
  }
  el.appendChild(body);
  body.scrollTop = savedScroll;
  const tags = [].slice.call(body.querySelectorAll(".nvtag"));
  const RANGE=46, MAX=1.7;
  body.onmousemove = (e)=>{
    if(_navDrag!=null) return;
    const y=e.clientY;
    tags.forEach(t=>{ const r=t.getBoundingClientRect(), c=r.top+r.height/2, d=Math.abs(y-c), f=Math.max(0,1-d/RANGE), sc=1+(MAX-1)*f;
      t.style.transform="scale("+sc.toFixed(3)+")"; t.style.zIndex = f>0?String(Math.round(sc*10)):""; });
  };
  body.onmouseleave = ()=>{ tags.forEach(t=>{ t.style.transform=""; t.style.zIndex=""; }); };
}

// ===== 卡片（棒球 renderCardB 1:1 移植;model=管線場次+item 使用者狀態） =====
function renderCardW(model){
  const it = model._item;

  const undName = undSide==="away"?model.away:model.home;

  // conflict / strong（棒球邏輯移植;無 dampen 來源故 strong 直判）
  const mlConflict  = it.mlAway.lights>0 && it.mlHome.lights>0;
  const hdConflict  = it.hdGive.lights>0 && it.hdRecv.lights>0;
  const totConflict = it.over.lights>0  && it.under.lights>0;
  const oppML = (undSide==="away") ? it.mlAway.lights : it.mlHome.lights;
  const crossConflict = it.hdGive.lights>0 && oppML>0;
  const strongSignal = !crossConflict && (
    (!mlConflict  && (it.mlAway.lights>=3 || it.mlHome.lights>=3)) ||
    (!hdConflict  && (it.hdGive.lights>=3 || it.hdRecv.lights>=3)) ||
    (!totConflict && (it.over.lights>=3  || it.under.lights>=3)) );
  if(mlConflict||hdConflict||totConflict) el.classList.add("has-conflict");
  else if(crossConflict) el.classList.add("has-cross");
  else if(strongSignal) el.classList.add("has-strong");

  const settledRec = gameFind(model.officialId, model.date, model.league, model.away, model.home);

  const stake = model.league==="NHL" ? (model.stake||(stakeObserved&&!stakeObserved.stale?stakeObserved:null)) : null;
  const bet365 = model.league==="NHL" ? (model.bet365||bet365OddsFor(model)) : null;
  const hdHistory = model.league==="NHL" ? handicapHistoryFor(stakeObserved, bet365) : null;
  const lsw = model.league==="NHL" ? lswFor(model) : 0;

  /* ---------- 標頭 ---------- */
  const head = document.createElement("div"); head.className="bhead";
  const time = document.createElement("span"); time.className="btime";
  time.textContent = fmtDate(model.date) + (model.time ? " "+model.time : "");
  const hsp = document.createElement("span"); hsp.className="bhead-sp";
  head.append(time, hsp);
  // 【明牌 ×N】膠囊由 nhl-picks-addon.decorate() 插入（棒球同路徑：含未讀 .ep-new 與面板入口）
  if(settled){ const sm=document.createElement("span"); sm.className="bbadge done"; sm.textContent="✓ 已結算"; sm.title="點擊修改（手動覆蓋管線）"; sm.onclick=()=>openSettleModal(model); head.appendChild(sm); }
  if(model.status==="postponed"){ const pd=document.createElement("span"); pd.className="bbadge ppd"; pd.textContent="⏸ 延賽"; pd.title="來源判定延賽,此卡不會結算"; head.appendChild(pd); }
  const hasStake = !!(stake && (stake.ml||stake.hd||stake.ou));
  const stakeStale = !!(stakeObserved&&stakeObserved.stale&&!model.stake);
  const hasLine = model.hdVal!=null && (model.hdSrc==="STAKE" || model.hdSrc==="BET365");
  const sourceName = hasStake ? "STAKE" : (hasLine ? "BET365" : "STAKE");
  const preB = document.createElement("button"); preB.className="bbadge"+((hasStake||hasLine)?" done":"");
  preB.textContent = stakeStale ? (hasLine?`${sourceName} ✓ · STAKE 停更`:"STAKE 停更") : ((hasStake||hasLine)?`${sourceName} ✓`:"STAKE 待盤");
  preB.title = hasStake?"Stake 官方主盤已到位 / 點開結算視窗":(hasLine?(stakeStale?"Stake 資料已停更，當前改用 Bet365 官方盤 / 點開歷史":"Stake 缺盤，暫用 Bet365 官方備援 / 點開結算視窗"):"Stake 官方主盤尚未配對 / 點開結算視窗"); preB.onclick=()=>openSettleModal(model);
  const colB = document.createElement("span"); colB.className="bico"; colB.textContent = it.collapsed?"▸":"▾"; colB.title=it.collapsed?"展開":"收合"; colB.onclick=()=>{ snapshot(); it.collapsed=!it.collapsed; saveDoc(doc); render(); };
  const delB = document.createElement("span"); delB.className="bico bdel"; delB.textContent="✕"; delB.title="刪除（此日期不再顯示這張卡）"; delB.onclick=()=>{ snapshot(); it.hidden=true; saveDoc(doc); render(); };
  head.append(preB, colB, delB);
  head.title = "右鍵 → 開結算視窗";
  head.addEventListener("contextmenu", (e)=>{ e.preventDefault(); openSettleModal(model); });
  el.appendChild(head);

  /* ---------- 異常框色（文字結論統一交給雙平台監控列；列表標籤共用 cardAnomClass） ---------- */
  { const anom = cardAnomClass(model, it); if(anom) el.classList.add(anom); }

  const marketMonitor=renderNhlMarketMonitor(model,stakeObserved,bet365,hdHistory,stakeStale);
  if(marketMonitor) el.appendChild(marketMonitor);

  if(!it.collapsed){
    const body = document.createElement("div"); body.className="bbody";

    /* ----- 左：計分板（棒球同構;比分外緣、隊名內側;中央=LIVE chip/VS＋節數表） ----- */
    const live = model.status==="inprogress";
    const finPending = model.status==="finished" && !settled;
    const showScore = model.awayScore!=null && model.homeScore!=null;
    const score = document.createElement("div"); score.className="bscore";
    function nameEl(side){
      const nm = document.createElement("div"); nm.className="bteam-nm";
      nm.appendChild(document.createTextNode(side==="away"?model.away:model.home));
      const info = document.createElement("span"); info.className="binfo"; info.textContent="i"; info.title="近況勝負";
      info.onclick=(e)=>{ e.stopPropagation(); bTogglePop(info, bFormHTML(model.league, side==="away"?model.away:model.home)); };
      nm.appendChild(info);
      return nm;
    }
    function scoreEl(side){
      if(!showScore) return null;
      const sc=document.createElement("div"); sc.className="bteam-sc"+((live||finPending)?" live":"");
      sc.textContent = side==="away"?model.awayScore:model.homeScore;
      return sc;
    }
    // 模型/盤口%：手動賠率優先；自動盤依序 Stake → Bet365 參考。
    const _stakeMlA = stake&&window.NhlStake.marketOutcome(stake.ml,"away");
    const _stakeMlH = stake&&window.NhlStake.marketOutcome(stake.ml,"home");
    const _stakeOpenMl = stake&&stake.open&&stake.open.ml;
    const _stakeOpenMlA = _stakeOpenMl&&window.NhlStake.marketOutcome(_stakeOpenMl,"away");
    const _stakeOpenMlH = _stakeOpenMl&&window.NhlStake.marketOutcome(_stakeOpenMl,"home");
    const _betMlA = bet365&&window.NhlBet365.marketOutcome(bet365.ml,"away");
    const _betMlH = bet365&&window.NhlBet365.marketOutcome(bet365.ml,"home");
    const _betOpenMl = bet365&&bet365.open&&bet365.open.ml;
    const _betOpenMlA = _betOpenMl&&window.NhlBet365.marketOutcome(_betOpenMl,"away");
    const _betOpenMlH = _betOpenMl&&window.NhlBet365.marketOutcome(_betOpenMl,"home");
    const _curMlA = _stakeMlA||_betMlA, _curMlH = _stakeMlH||_betMlH;
    const _openMlA = _stakeOpenMlA||_betOpenMlA||_curMlA, _openMlH = _stakeOpenMlH||_betOpenMlH||_curMlH;
    const _oML = (_curMlA&&_curMlH) ? { curA:_curMlA.odds, curH:_curMlH.odds,
      openA:_openMlA?_openMlA.odds:_curMlA.odds, openH:_openMlH?_openMlH.odds:_curMlH.odds } : null;
    const _mpA = impliedAway(parseFloat(it.flipOddsAway), parseFloat(it.flipOddsHome))
              ?? (_oML ? impliedAway(_oML.curA, _oML.curH) : null);
    const mlHv=(side)=>{ const so=stake&&window.NhlStake.marketOutcome(stake.ml,side); if(so) return `STAKE ${Number(so.odds).toFixed(2)}`;
      const bo=bet365&&window.NhlBet365.marketOutcome(bet365.ml,side); return bo?`BET365 ${Number(bo.odds).toFixed(2)}`:""; };
    const signed=(n)=> Number(n)>0?`+${Number(n)}`:`${Number(n)}`;
    const hdHv=(side,roleLine)=>{ const so=stake&&window.NhlStake.marketOutcome(stake.hd,side); if(so){ const official=signed(so.line), role=signed(roleLine);
        return Number(so.line)===Number(roleLine) ? `${role} · STAKE ${Number(so.odds).toFixed(2)}` : `${role}↔${official} ${Number(so.odds).toFixed(2)}`; }
      const bo=bet365&&window.NhlBet365.marketOutcome(bet365.hd,side); if(!bo) return signed(roleLine);
      const official=signed(bo.line), role=signed(roleLine); return Number(bo.line)===Number(roleLine) ? `${role} · BET365 ${Number(bo.odds).toFixed(2)}` : `${role}↔${official} ${Number(bo.odds).toFixed(2)}`; };
    const ouHv=(side,line)=>{ const so=stake&&window.NhlStake.marketOutcome(stake.ou,side); if(so) return `${line} · STAKE ${Number(so.odds).toFixed(2)}`;
      const bo=bet365&&window.NhlBet365.marketOutcome(bet365.total,side); return bo?`${line} · BET365 ${Number(bo.odds).toFixed(2)}`:String(line); };
    function pctsEl(side){
      if(_mpA==null) return null;
      const imp = side==="away" ? Math.round(_mpA*100) : Math.round((1-_mpA)*100);
      const pc = document.createElement("div"); pc.className="bteam-pcts";
      pc.innerHTML = `<span class="pm"><span class="l">模型</span>—</span>`
                   + `<span class="pi"><span class="l">盤口</span><b>${imp}%</b></span>`;
      return pc;
    }
    function teamBlock(side, order){
      const wrap = document.createElement("div"); wrap.className="bteam "+side;
      order.forEach(k=>{ const e = (k==="score")?scoreEl(side):(k==="name")?nameEl(side):pctsEl(side); if(e) wrap.appendChild(e); });
      return wrap;
    }
    const mid = document.createElement("div"); mid.className="bmid";
    const vsEl = document.createElement("div");
    if(live){ vsEl.className="blivechip on"; vsEl.textContent = model.inning||"LIVE"; vsEl.title="進行中（即時比分,每輪刷新）"; }
    else if(finPending){ vsEl.className="blivechip fin"; vsEl.textContent="終場待結算"; vsEl.title="已終場,管線結算中"; }
    else { vsEl.className="bvs"; vsEl.textContent="VS"; }
    mid.appendChild(vsEl);
    if((model.qAway&&model.qAway.length)||(model.qHome&&model.qHome.length)){
      const nQ = Math.max(3, (model.qAway||[]).length, (model.qHome||[]).length);
      let th="<tr><th></th>"; for(let i=1;i<=nQ;i++) th+=`<th>${i<=3?"P"+i:(i===4?"OT":"SO")}</th>`; th+="</tr>";
      const cells=(arr)=>{ let h=""; for(let i=0;i<nQ;i++){ const v=(arr||[])[i]; const liveq = live && i===(arr||[]).length-1; h+=`<td class="${liveq?"liveq":""}">${v==null?"–":v}</td>`; } return h; };
      const t=document.createElement("table"); t.className="bqs";
      t.innerHTML = `${th}<tr><td class="side">客</td>${cells(model.qAway)}</tr><tr><td class="side">主</td>${cells(model.qHome)}</tr>`;
      mid.appendChild(t);
    }
    score.append(teamBlock("away",["score","name","pcts"]), mid, teamBlock("home",["pcts","name","score"]));
    body.appendChild(score);

    /* ----- 右：分析區 ----- */
    const ana = document.createElement("div"); ana.className="bana";
    const ahead = document.createElement("div"); ahead.className="bana-head";
    const albl = document.createElement("span"); albl.className="bana-lbl"; albl.textContent="過盤率";
    const venueTog = document.createElement("span"); venueTog.className="bvenue";
    [["venue","主客"],["all","綜"]].forEach(([v,lab])=>{
      const b=document.createElement("button"); b.textContent=lab; if(doc.covMode===v) b.classList.add("on");
      b.onclick=()=>{ doc.covMode=v; saveDoc(doc); render(); };
      venueTog.appendChild(b);
    });
    ahead.append(albl, venueTog);
    ana.appendChild(ahead);

    function mktRow(badge, badgeCls, name, hv, lightObj, coverHTML, conflict){
      const row=document.createElement("div"); row.className="bmkt-row"+(conflict?" conflict":"");
      const b=document.createElement("span"); b.className="bside "+(badgeCls||""); b.textContent=badge;
      const nm=document.createElement("span"); nm.className="bnm"; nm.title=(hv?`${name} ${hv}；`:"")+"點隊名／標籤＝減一盞燈";
      nm.innerHTML = esc(name)+(hv?` <span class="hv">${esc(hv)}</span>`:"");
      nm.onclick=()=>{ if(lightObj.lights>0){ snapshot(); lightObj.lights--; saveDoc(doc); render(); } };
      const lightsEl = bLightsEl(lightObj);
      const chip=document.createElement("span"); chip.className="betchip"+(lightObj.bet?" on":""); chip.textContent="注";
      chip.title = lightObj.bet ? "已標記自主下注（點擊取消）" : "標記：這選項我實際下注了（與明牌分開統計）";
      chip.onclick=(e)=>{ e.stopPropagation(); snapshot(); lightObj.bet=!lightObj.bet; saveDoc(doc); render(); };
      row.append(b, nm, lightsEl, chip, _firstEl(coverHTML));   // ep 格由 nhl-picks-addon.decorate() 插在第4欄（棒球同路徑）

    }
    function mktSecHead(label, conflict, extras, cmtHTML){
      const sec=document.createElement("div"); sec.className="bmkt-sec"+(conflict?" conflict":"");
      const mn=document.createElement("span"); mn.className="mname"; mn.textContent=label; sec.appendChild(mn);
      (extras||[]).forEach(x=> x && sec.appendChild(x));
      const sp=document.createElement("span"); sp.className="mksp"; sec.appendChild(sp);
      const cmt=document.createElement("span"); cmt.className="bcmt"+(cmtHTML&&cmtHTML.strong?" strong":""); if(cmtHTML) cmt.innerHTML=cmtHTML.html; sec.appendChild(cmt);
      return sec;
    }
    const wrapDiv = ()=>{ const d=document.createElement("div"); d.className="bmkt"; return d; };

    // 讓分趨勢：兩個官方來源都各自列出換邊次數，避免只看到其中一方。
    function hdTrend(){
      if(hdHistory && (hdHistory.stake.rows.length||hdHistory.bet365.rows.length)){
        const rel=hdHistory.currentRelation==="diverged"?"・目前顛倒":"";
        return { html:`<span class="l">歷史</span><span class="tm">STAKE 換邊 ${hdHistory.stake.swapCount} 次・BET365 換邊 ${hdHistory.bet365.swapCount} 次${rel}</span>`,
          strong:hdHistory.currentRelation==="diverged"||hdHistory.stake.swapCount>0||hdHistory.bet365.swapCount>0 };
      }
      if(stake && stake.hd && stake.hd.line!=null){
        const open=stake.open&&stake.open.hd, moved=open&&Number(open.line)!==Number(stake.hd.line);
        const flipped=open&&open.favorite&&stake.hd.favorite&&open.favorite!==stake.hd.favorite;
        return { html:`<span class="l">STAKE</span><span class="tm">${flipped?"讓分方曾換邊 ⇄":(moved?`盤口 ${Math.abs(Number(open.line))}→${Math.abs(Number(stake.hd.line))}`:`盤口 ${Math.abs(Number(stake.hd.line))}`)}</span>`, strong:!!(flipped||moved) };
      }
      if(bet365 && bet365.hdLine!=null){
        const flipped=bet365.events.some(x=>x&&x.type==="favorite-flip");
        const moved=bet365.hdOpen!=null && bet365.hdOpen!==bet365.hdLine;
        return { html:`<span class="l">BET365</span><span class="tm">${flipped?`讓分方曾換邊 ⇄`:(moved?`盤口 ${bet365.hdOpen}→${bet365.hdLine}`:`盤口 ${bet365.hdLine}`)}</span>`, strong:flipped||moved };
      }
      if(!intl) return null;
      if(intl.flips>0) return { html:`<span class="l">賠率</span><span class="tm">讓分方曾換邊 ⇄${intl.flips}</span>`, strong:true };
      if(intl.move>=2.5) return { html:`<span class="l">賠率</span><span class="tm">大幅轉向 ${esc(intl.dir<0?model.away:model.home)}讓分</span>`, strong:true };
      if(intl.move>=1) return { html:`<span class="l">賠率</span><span class="tm">看好 ${esc(intl.dir<0?model.away:model.home)}讓分</span>` };
      return { html:`<span class="l">賠率</span>持平` };
    }
    function ouTrend(){
      if(stake && stake.ou && stake.ou.line!=null){
        const open=stake.open&&stake.open.ou, moved=open&&Number(open.line)!==Number(stake.ou.line);
        return { html:`<span class="l">STAKE</span><span class="tm">${moved?`基準 ${open.line}→${stake.ou.line}`:`基準 ${stake.ou.line}`}</span>`, strong:!!moved };
      }
      if(bet365 && bet365.total && bet365.total.line!=null){
        const moved=bet365.openTotal&&Number(bet365.openTotal.line)!==Number(bet365.total.line);
        return { html:`<span class="l">BET365</span><span class="tm">${moved?`基準 ${bet365.openTotal.line}→${bet365.total.line}`:`基準 ${bet365.total.line}`}</span>`, strong:!!moved };
      }
      if(!intl || !intl.ouMove) return null;
      const m = intl.ouMove;
      if(Math.abs(m)>=3) return { html:`<span class="l">賠率</span><span class="tm">大幅轉向 ${m>0?"大":"小"}分</span>`, strong:true };
      if(Math.abs(m)>=1) return { html:`<span class="l">賠率</span><span class="tm">轉向 ${m>0?"大":"小"}分</span>` };
      return null;
    }

    // 獨贏
    const mlWrap=wrapDiv();
    // 獨贏賠率評語：Stake 優先（缺盤才用 Bet365）初盤→現盤位移。
    function mlTrend(){
      if(!_oML || !_oML.openH || !_oML.curH) return null;
      const mp0 = impliedAway(_oML.openA, _oML.openH), mp1 = impliedAway(_oML.curA, _oML.curH);
      if(mp0==null || mp1==null) return null;
      const mv = (mp1-mp0)*100;
      if(Math.abs(mv) < 1.0) return { html:`<span class="l">賠率</span>持平` };
      const team = mv>0 ? model.away : model.home, strong = Math.abs(mv)>=2.5;
      return { html:`<span class="l">賠率</span><span class="tm">${strong?"大幅轉向":"轉向"}看好 ${esc(team)}</span>`, strong };
    }
    mlWrap.append(mktSecHead("獨贏", mlConflict, [], mlTrend()),
      mktRow("客","", model.away, mlHv("away"), it.mlAway, bCoverHTML(pctInfo(model.league,season,model.away,"ml","away")), mlConflict),
      mktRow("主","", model.home, mlHv("home"), it.mlHome, bCoverHTML(pctInfo(model.league,season,model.home,"ml","home")), mlConflict));
    ana.appendChild(mlWrap);

    // 讓分（⇄=手動換讓分方,燈跟隊;棒球同款）
    const hdWrap=wrapDiv();
    const swap=document.createElement("span"); swap.className="bswap"; swap.textContent="⇄"; swap.title="切換讓分方（燈跟隊走）";
    swap.onclick=()=>{ snapshot(); it.hdFavOverride=favSide==="away"?"home":"away"; delete it.hdSwap; const t=it.hdGive; it.hdGive=it.hdRecv; it.hdRecv=t; saveDoc(doc); render(); };
    // 使用者手動盤口優先；沒填依序用 Stake 主盤、Bet365 備援。
    const hv = (it.hdVal!=null && it.hdVal!=="" && !isNaN(parseFloat(it.hdVal)))
             ? String(Math.abs(parseFloat(it.hdVal)))
             : (model.hdVal!=null ? String(model.hdVal) : "");
    let anomChip=null;
    try{ const ai=bAnomInfo(model, it); if(ai){ anomChip=document.createElement("span"); anomChip.className="banom "+ai.cls;
      anomChip.textContent=`${ai.lbl} 讓過${ai.covTxt} (${ai.n})`; anomChip.title=ai.tip; } }catch(_){}
    hdWrap.append(mktSecHead("讓分", hdConflict, [swap, anomChip], null),
      mktRow("讓","give", favName, hv?hdHv(favSide,-Math.abs(Number(hv))):"", it.hdGive, bCoverHTML(pctInfo(model.league,season,favName,"hd",favSide)), hdConflict),
      mktRow("受讓","recv", undName, hv?hdHv(undSide,Math.abs(Number(hv))):"", it.hdRecv, bCoverHTML(pctInfo(model.league,season,undName,"recv",undSide)), hdConflict));
    ana.appendChild(hdWrap);

    // 大小：Stake 主盤基準線；缺盤才回到可編輯預設 6.5。
    const totWrap=wrapDiv();
    const basis=document.createElement("span"); basis.className="basis";
    const tv = String(totalLineFor(it, model));
    basis.innerHTML="基準 ";
    const tinp=document.createElement("input"); tinp.type="number"; tinp.step="1"; tinp.min="0.5"; tinp.inputMode="decimal"; tinp.value=tv;
    tinp.onclick=(e)=>e.stopPropagation();
    tinp.oninput=()=>{ it.totVal = tinp.value.trim(); saveDoc(doc); };
    basis.appendChild(tinp);
    const aT=pctInfo(model.league,season,model.away,"tot","away"), hT=pctInfo(model.league,season,model.home,"tot","home");
    let overPct=null, lowS=false, samp=0;
    if(aT||hT){ const arr=[aT,hT].filter(Boolean); overPct=arr.reduce((s,x)=>s+x.pn,0)/arr.length; lowS=arr.some(x=>x.lowSample); samp=Math.min.apply(null,arr.map(x=>x.sample)); }
    function totCover(isOver){
      if(overPct==null) return `<span class="bcover ls">—</span>`;
      const pn = isOver ? overPct : (1-overPct);
      const cls = lowS ? "ls" : (pn>=0.55?"hi":(pn<0.40?"lo":""));
      const ss = lowS ? `<span class="ss">(${samp})</span>` : "";
      return `<span class="bcover ${cls}">${Math.round(pn*100)}%${ss}</span>`;
    }
    totWrap.append(mktSecHead("大小", totConflict, [basis], null),
      mktRow("大","", "大", ouHv("over",tv), it.over, totCover(true), totConflict),
      mktRow("小","", "小", ouHv("under",tv), it.under, totCover(false), totConflict));
    ana.appendChild(totWrap);

    body.appendChild(ana);
    el.appendChild(body);
  }

  /* ---------- 已結算結果 pills（棒球同款;≥3 燈選項＋比分;結算源=it.settled=戰績同帳） ---------- */
  if(settled){
    const s = it.settled || computeAutoSettled(model) || { awayScore:settledRec.awayScore, homeScore:settledRec.homeScore };
    const bs=document.createElement("div"); bs.className="bsettled";
    const sp=document.createElement("span"); sp.className="bpill sc"; sp.textContent=`${model.away} ${s.awayScore} : ${s.homeScore} ${model.home}`; bs.appendChild(sp);
    const out=(market,side)=>{
      if(market==="ml"){ if(s.ml!=="away"&&s.ml!=="home") return "void"; return s.ml===side?"hit":"miss"; }
      if(market==="hd"){ const my=side==="give"?s.myHdGive:s.myHdRecv;
        if(my!=null){ if(my==="push") return "void"; return my==="cover"?"hit":"miss"; }
        if(s.hd!=="cover"&&s.hd!=="nocover") return "void";
        const cov=(s.hd==="cover"); return side==="give"?(cov?"hit":"miss"):(cov?"miss":"hit"); }
      if(market==="tot"){ const st=(s.myTot!=null)?s.myTot:s.tot; if(st!=="over"&&st!=="under") return "void";
        return st===side?"hit":"miss"; }
      return null;
    };
    const mark=o=> o==="hit"?"✓":(o==="miss"?"✗":"－");
    const pill=(txt,n,o)=>{ const p=document.createElement("span"); p.className="bpill "+(o||""); p.textContent=`${mark(o)} ${txt} ●${n}`; bs.appendChild(p); };
    if(it.mlAway.lights>=3) pill(model.away, it.mlAway.lights, out("ml","away"));
    if(it.mlHome.lights>=3) pill(model.home, it.mlHome.lights, out("ml","home"));
    if(it.hdGive.lights>=3) pill(`${favName}讓${model.hdVal!=null?" "+model.hdVal:""}`, it.hdGive.lights, out("hd","give"));
    if(it.hdRecv.lights>=3) pill(`${undName}受讓${model.hdVal!=null?" "+model.hdVal:""}`, it.hdRecv.lights, out("hd","recv"));
    if(it.over.lights>=3)   pill(`大${tvOf(it,model)}`, it.over.lights, out("tot","over"));
    if(it.under.lights>=3)  pill(`小${tvOf(it,model)}`, it.under.lights, out("tot","under"));
    if(bs.children.length) el.appendChild(bs);
  }
  return el;
}
function totalLineFor(it, model){
  const manual = it && it.totVal!=null && it.totVal!=="" ? parseFloat(it.totVal) : null;
  if(Number.isFinite(manual)) return manual;
  const feed = model && model.totLine!=null ? parseFloat(model.totLine) : null;
  return Number.isFinite(feed) ? feed : DEFAULT_NHL_TOTAL_LINE;
}
function tvOf(it,model){ return " "+totalLineFor(it,model); }

// 管線場次 → 卡片 model（含使用者 ⇄ 覆蓋讓分方）
function modelFromPregame(g){
  const it = ensureItem(g.date, g.officialId);
  const stakeObserved = stakeOddsFor(g);
  const historical = g.status==="finished" || g.status==="postponed";
  const stake = stakeObserved && (!stakeObserved.stale || historical) ? stakeObserved : null;
  const bet365 = bet365OddsFor(g);
  const applied = window.NhlStake.applyOddsToPregame(g, it, stake, bet365, DEFAULT_NHL_HD_FAV);
  // id/type/gameTime＝棒球 item 介面（nhl-picks-addon 沿用棒球比對邏輯,需要這三個欄位）
  return { ...g, ...applied, stakeObserved, id: g.officialId, type: 'match', gameTime: g.time,
    inning:g.period||g.inning||"", qAway:g.periodsAway||g.qAway||[], qHome:g.periodsHome||g.qHome||[], _item: it,
    get settled(){ return it.settled; }, get expertApplied(){ return it.expertApplied; } };
}

let statsSort = { market:null, venue:null, dir:"desc" };
function sortIndicator(m, v){
  if(statsSort.market!==m || statsSort.venue!==(v||null)) return "";
  return statsSort.dir==="desc" ? " ▼" : " ▲";
}
function setSort(m, v){
  if(statsSort.market===m && statsSort.venue===(v||null)){
    if(statsSort.dir==="desc") statsSort.dir="asc";
    else statsSort = { market:null, venue:null, dir:"desc" };
  } else statsSort = { market:m, venue:v||null, dir:"desc" };
  renderStatsPage();
}
function sortedTeams(league, teams, season){
  if(!statsSort.market) return teams;
  const m = statsSort.market, v = statsSort.venue;
  const val = (team)=>{
    if(m==="runs"){ const r=runsRead(league, season, team, v); return r.games? (r.scored-r.conceded)/r.games : -Infinity; }
    if(m==="streak"){ const s=streakRead(league, season, team, v); return s.kind==="W"? s.n : -s.n; }
    const p = pctNum(statRead(league, season, team, m, v));
    return p==null ? -Infinity : p;
  };
  const arr = teams.map(t=>[t, val(t)]);
  arr.sort((a,b)=> statsSort.dir==="desc" ? b[1]-a[1] : a[1]-b[1]);
  return arr.map(x=>x[0]);
}
function teamsForToday(league){
  const s = new Set();
  for(const g of (doc.games||[])) if(g.league===league && g.date===doc.activeDate){ s.add(g.awayTeam); s.add(g.homeTeam); }
  for(const g of (pregameCache.games||[])) if(g.date===doc.activeDate){ s.add(g.away); s.add(g.home); }
  return s;
}

function reviewRows(){
  const rows=[];
  for(const g of (doc.games||[])){
    if(g.awayScore==null||g.homeScore==null) continue;
    const b=doc.boards[g.date]; if(!b||!b.items) continue;

    const margin=g.homeScore-g.awayScore;
    const outcome=(mk)=>{
      if(mk==="mlAway") return margin<0; if(mk==="mlHome") return margin>0;
      if(g.hdFav&&g.hdVal!=null){ const favM=g.hdFav==="home"?margin:-margin; const d=favM-g.hdVal;
        if(d===0) return null;
        if(mk==="hdGive") return d>0; if(mk==="hdRecv") return d<0; }
      if(g.totBasis!=null){ const t=g.awayScore+g.homeScore; if(t===g.totBasis) return null;
        if(mk==="over") return t>g.totBasis; if(mk==="under") return t<g.totBasis; }
      return null;
    };
    const MK={mlAway:"ml",mlHome:"ml",hdGive:"hd",hdRecv:"hd",over:"tot",under:"tot"};
    for(const mk of OPT_KEYS){
      const n=it[mk]&&it[mk].lights||0; if(!n) continue;
      const hit=outcome(mk); if(hit==null) continue;
      rows.push({ lg:(g.league||"").toLowerCase(), market:MK[mk], n, hit, date:g.date });
    }
  }
  return rows;
}
function renderReview(){
  const body=$("#reviewBody"); if(!body) return;
  const lg=$("#reviewLeague").value, scope=+$("#reviewScope").value, mkt=$("#reviewMarket").value;
  let rows=reviewRows().filter(r=> r.n>=scope );
  if(lg!=="all") rows=rows.filter(r=>r.lg===lg);
  if(mkt!=="all") rows=rows.filter(r=>r.market===mkt);
  if(!rows.length){
    body.innerHTML=`<div class="rv-headline"><div class="big">—</div><div class="cap">還沒有已結算的帶燈選項。點燈＋比賽結算後，這裡會自動累積跨日命中率（燈數桶／各盤口）。</div></div>`
      + renderAnomSection(lg);
    return;
  }
  const hit=rows.filter(r=>r.hit).length, tot=rows.length, dates=new Set(rows.map(r=>r.date)).size;
  const pctCls=(p,n)=> n<10 ? "low-sample" : (p>=55?"hi":(p<45?"lo":"mid"));
  const seg=(list)=>{ const h=list.filter(r=>r.hit).length, t=list.length; const p=t?Math.round(h/t*100):0;
    return `<td>${h}/${t}</td><td><span class="rv-pct ${pctCls(p,t)}">${t?p+"%":"—"}</span></td>`; };
  let html=`<div class="rv-headline"><div class="big">${Math.round(hit/tot*100)}<span class="unit">%</span></div>
    <div class="cap">帶燈（≥${scope}）已結算選項命中率 · ${hit}/${tot} · 跨 ${dates} 天</div>
    <div class="row2">
      <div class="blk"><div class="v">${rows.filter(r=>r.market==="hd"&&r.hit).length}/${rows.filter(r=>r.market==="hd").length}</div><div class="k">讓分</div></div>
      <div class="blk"><div class="v">${rows.filter(r=>r.market==="tot"&&r.hit).length}/${rows.filter(r=>r.market==="tot").length}</div><div class="k">大小</div></div>
      <div class="blk"><div class="v">${rows.filter(r=>r.market==="ml"&&r.hit).length}/${rows.filter(r=>r.market==="ml").length}</div><div class="k">獨贏</div></div>
    </div></div>`;
  html+=`<div class="rv-section"><div class="rv-head">燈數桶</div><table class="rv-table"><tr><th class="lbl">燈數</th><th>命中/總數</th><th>命中率</th></tr>`;
  [[3,"3 燈"],[4,"4 燈"],[5,"5 燈"],[6,"6+ 燈"]].forEach(([n,lab])=>{
    const list=rows.filter(r=> n<6 ? r.n===n : r.n>=6 ); if(!list.length) return;
    html+=`<tr><td class="lbl">${lab}</td>${seg(list)}</tr>`;
  });
  html+=`</table></div>`;
  html+=`<div class="rv-section"><div class="rv-head">各盤口</div><table class="rv-table"><tr><th class="lbl">盤口</th><th>命中/總數</th><th>命中率</th></tr>`;
  [["hd","讓分／受讓"],["tot","大小分"],["ml","獨贏"]].forEach(([k,lab])=>{
    const list=rows.filter(r=>r.market===k); if(!list.length) return;
    html+=`<tr><td class="lbl">${lab}</td>${seg(list)}</tr>`;
  });
  html+=`</table></div>`;
  html += renderAnomSection(lg);
  body.innerHTML=html;
}
function openReview(){ $("#reviewpage").classList.add("show"); renderReview(); renderMatchNav(); }
$("#reviewBtn").onclick=()=>{ closeMore(); openReview(); };
$("#reviewQuickBtn").onclick=openReview;
$("#reviewClose").onclick=()=>{ $("#reviewpage").classList.remove("show"); renderMatchNav(); };
["reviewLeague","reviewScope","reviewMarket"].forEach(id=>{ const el=document.getElementById(id); if(el) el.onchange=renderReview; });
$("#zoomctlToggle").onclick=()=>{ const z=$("#zoomctl"); z.classList.toggle("collapsed");
  $("#zoomctlToggle").textContent = z.classList.contains("collapsed") ? "⋯" : "⋮"; };

// ===== render =====
function render(){
  closeBPop();
  renderDates();
  $("#lgNHL").classList.toggle("on", doc.activeLeague==="NHL");
  $("#logoDot").style.background = LEAGUES[doc.activeLeague].colorHex;
  const board=document.getElementById("board"); board.innerHTML="";
  // 每排（棒球 cols）＋排序（棒球 sortbtn:該市場最高燈數優先）
  board.style.display = doc.cols!=="auto" ? "grid" : "flex";
  if(doc.cols!=="auto"){ board.style.gridTemplateColumns=`repeat(${doc.cols}, minmax(0,1fr))`; board.style.alignItems="start"; board.style.justifyItems="center"; }
  else { board.style.gridTemplateColumns=""; }
  document.body.style.zoom = doc.uiScale!==1 ? doc.uiScale : "";
  let todays=(pregameCache.games||[]).filter(g=>g.date===doc.activeDate)
      .sort((a,b)=> (a.time||"") < (b.time||"") ? -1 : 1);
  if(doc.sortMkt){
      const key={ml:["mlAway","mlHome"],hd:["hdGive","hdRecv"],tot:["over","under"]}[doc.sortMkt]||[];
      const litOf=(g)=>{ const it=ensureItem(g.date,g.officialId); return Math.max(...key.map(k=>it[k].lights),0); };
      todays = todays.slice().sort((a,b)=> litOf(b)-litOf(a));
  }
  const visible = todays.filter(g=>{ const it=ensureItem(g.date,g.officialId); return !it.hidden; });
  if(visible.length){
    for(const g of visible){ const md=modelFromPregame(g); board.appendChild(renderCardW(md));
      try{ window.__expertPicks && window.__expertPicks.decorate(md); }catch(_){} }
    renderSummary(); renderMatchNav(); layoutRightColumns();
    return;
  }
  const e=document.createElement("div"); e.className="empty";
  const n = (doc.games||[]).filter(g=>g.league==="NHL").length;
  e.innerHTML=`<b>NHL 排盤板</b><br>本季數據 ${n} 場已入庫（📊 隊伍統計可看全隊過盤率）。<br>此日期無賽程；有比賽的日子卡片由管線自動生成。`;
  board.appendChild(e);
  renderSummary(); renderMatchNav(); layoutRightColumns();
}
render();
loadSeedGames();
loadPregame();
