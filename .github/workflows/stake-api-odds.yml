# STAKE 官方 NHL 賠率 shadow 管線。缺 STAKE_ODDS_API_KEY 時不寫空檔、不自我接棒。
name: stake-api-odds

on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: stake-api-odds
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      STAKE_ODDS_API_KEY: ${{ secrets.STAKE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: 5h10m 官方賠率 shadow 迴圈
        run: |
          if [ -z "$STAKE_ODDS_API_KEY" ]; then
            echo "INFO 尚未設定 STAKE_ODDS_API_KEY；賽程可讀，但官方盤口不會回傳 groups，本輪安全停用"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( SECONDS + 18600 ))
          while [ "$SECONDS" -lt "$END" ]; do
            T0=$SECONDS
            git rebase --abort 2>/dev/null || true
            git fetch origin main || true
            git reset --hard origin/main || true
            if timeout 240 node stake_api_odds.js; then
              git add data/stake_api_odds.json 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -m "stake api odds $(date -u +%FT%TZ) [skip ci]" || true
                if ! git push; then
                  git pull --rebase --autostash || { git rebase --abort 2>/dev/null || true; }
                  git push || true
                fi
              fi
            else
              echo "WARN STAKE 官方盤口失敗；保留上一份有效資料，下一輪重試"
            fi
            EL=$(( SECONDS - T0 ))
            [ "$EL" -lt 300 ] && sleep $(( 300 - EL ))
          done
      - name: 自我接棒
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$STAKE_ODDS_API_KEY" ]; then echo "INFO 無 STAKE key，不接棒"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "INFO 無 PAT，靠 cron 重點火"; exit 0; fi
          gh workflow run stake-api-odds.yml -R "${{ github.repository }}" && echo "OK 已排下一棒" || echo "WARN 接棒失敗，靠 cron"
