# STAKE 官方 NHL 賽前盤。API key 可選；沒有 key 時讀官方賽事頁。
name: stake-api-odds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - stake_api_odds.js
      - nhl_core.js
      - .github/workflows/stake-api-odds.yml
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: stake-api-odds
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      STAKE_ODDS_API_KEY: ${{ secrets.STAKE_ODDS_API_KEY }}
      EP_TRANSPORT: sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: 安裝 Scrapling 官方頁傳輸層
        run: |
          pip -q install -r requirements-scraping.txt
          scrapling install --force >/dev/null 2>&1 || echo "WARN Scrapling 瀏覽器安裝非零，本輪抓取會自行報錯並保留舊資料"
      - name: 5h10m Stake NHL 官方賠率迴圈
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( SECONDS + 18600 ))
          while [ "$SECONDS" -lt "$END" ]; do
            T0=$SECONDS
            git rebase --abort 2>/dev/null || true
            git fetch origin main || true
            git reset --hard origin/main || true
            if timeout 240 node stake_api_odds.js; then
              git add data/stake_api_odds.json 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -m "stake api odds $(date -u +%FT%TZ) [skip ci]" || true
                if ! git push; then
                  git pull --rebase --autostash || { git rebase --abort 2>/dev/null || true; }
                  git push || true
                fi
              fi
            else
              echo "WARN STAKE 官方盤口失敗；保留上一份有效資料，下一輪重試"
            fi
            EL=$(( SECONDS - T0 ))
            [ "$EL" -lt 300 ] && sleep $(( 300 - EL ))
          done
      - name: 自我接棒
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "INFO 無 PAT，靠 cron 重點火"; exit 0; fi
          gh workflow run stake-api-odds.yml -R "${{ github.repository }}" && echo "OK 已排下一棒" || echo "WARN 接棒失敗，靠 cron"
