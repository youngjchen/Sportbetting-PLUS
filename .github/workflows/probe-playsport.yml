# 一次性稽核：四聯盟並行深掃回溯 7/27+7/28，量測漏抓明牌（前後筆數差）
# AUDIT 行輸出格式：AUDIT <lg> BEFORE {...} AFTER {...}（主檔+歸檔 by date 筆數）
name: probe-playsport
on:
  workflow_dispatch:

jobs:
  backfill:
    strategy:
      fail-fast: false
      matrix:
        lg: [mlb, npb, kbo, cpbl]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: 安裝隱形瀏覽器內核
        run: |
          pip -q install -r requirements-scraping.txt
          scrapling install --force >/dev/null 2>&1 || echo "WARN scrapling install"
      - name: 深掃回溯＋前後比對＋推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LG=${{ matrix.lg }}
          COUNT='const f="data/expert_picks_'$LG'.json",a="data/expert_archive/2026-07-'$LG'.json";
            const load=p=>{try{return JSON.parse(require("fs").readFileSync(p,"utf8"))}catch(e){return{picks:[]}}};
            const by={};for(const src of [load(f),load(a)])for(const p of src.picks||[])if(p.date>="2026-07-27")by[p.date]=(by[p.date]||0)+1;
            console.log(JSON.stringify(by));'
          BEFORE=$(node -e "$COUNT")
          EP_LEAGUE=$LG EP_MODE=full EP_DEEP=1 EP_BACKDAYS=2 timeout 2400 node expert_picks.js || echo "WARN 深掃 rc=$?"
          AFTER=$(node -e "$COUNT")
          echo "AUDIT $LG BEFORE $BEFORE AFTER $AFTER"
          git add data/expert_picks_$LG.json data/expert_archive 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: backfill audit $LG 7/27-7/28 深掃回溯"
            for i in 1 2 3 4 5; do
              git push && break
              git pull --rebase -X theirs || git rebase --abort || true
            done
          else
            echo "AUDIT $LG 無新增（零漏抓或無可回收）"
          fi
