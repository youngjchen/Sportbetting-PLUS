# 驗收：正式爬蟲程式碼在雲端能否自主抓到明牌（不靠本機）
# 判準：coverage.qualified > 0 且本輪筆數 > 0。final 模式＝小名冊，約 5 分鐘。
name: probe-playsport
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: 安裝隱形瀏覽器內核
        run: |
          pip -q install "scrapling[all]>=0.4.11"
          scrapling install --force >/dev/null 2>&1 || echo "WARN scrapling install 非零"
      - name: 雲端實跑 expert_picks（final，不寫回 repo）
        run: |
          EP_LEAGUE=mlb EP_MODE=final timeout 1500 node expert_picks.js 2>&1 | tail -40
          echo "===== 結果判定"
          node -e "
            const d=JSON.parse(require('fs').readFileSync('data/expert_picks_mlb.json','utf8'));
            const c=(d.coverage||{}).mlb||{};
            console.log('VERDICT qualified='+c.qualified+' fetched='+c.fetched+' picks='+(d.picks||[]).length+' updated='+d.updated);
            process.exit((c.qualified>0||c.fetched>0)?0:1);
          "
