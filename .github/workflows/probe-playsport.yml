# 探測四：雲端拿 billboard JSON 的兩條路——A. curl_cffi chrome TLS 模擬（無瀏覽器、快）
# B. 隱形瀏覽器頁內 XHR（credentials 同源）。判定＝JSON.parse 出 rankers 才算數（禁字串誤判）。
name: probe-playsport
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 scrapling
        run: |
          pip -q install "scrapling[all]>=0.4.11"
          scrapling install --force >/dev/null 2>&1 || true
      - name: A/B 兩案
        run: |
          cat > p4.py <<'PY'
          import json
          BB = 'https://www.playsport.cc/billboard/winRate?allianceid=1&mode=2&during=season&page=0'
          H = {'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json',
               'Referer': 'https://www.playsport.cc/'}
          def parse_ok(t):
              try:
                  return isinstance(json.loads(t).get('rankers'), (dict, list))
              except Exception:
                  return False
          try:
              from scrapling.fetchers import FetcherSession
              with FetcherSession(impersonate='chrome') as s:
                  r = s.get(BB, headers=H)
                  b = r.body
                  if isinstance(b, (bytes, bytearray)):
                      b = b.decode('utf-8', 'replace')
                  b = b if isinstance(b, str) else str(b)
                  print('A_status', getattr(r, 'status', None), 'A_parse', parse_ok(b), 'A_head', repr(b[:120]))
          except Exception as e:
              print('A_EXC', type(e).__name__, str(e)[:150])
          try:
              from scrapling.fetchers import StealthySession
              holder = {}
              def act(page):
                  holder['r'] = page.evaluate(
                      "async (u)=>{const r=await fetch(u,{headers:{'X-Requested-With':'XMLHttpRequest','Accept':'application/json'},credentials:'include'});return {s:r.status,t:await r.text()};}",
                      BB)
                  return page
              with StealthySession(headless=True) as s:
                  s.fetch('https://www.playsport.cc/', page_action=act)
              rr = holder.get('r') or {}
              t = rr.get('t') or ''
              print('B_status', rr.get('s'), 'B_parse', parse_ok(t), 'B_head', repr(t[:120]))
          except Exception as e:
              print('B_EXC', type(e).__name__, str(e)[:150])
          PY
          python p4.py
