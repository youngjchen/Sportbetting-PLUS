# 探測三：雲端 sidecar 抓 billboard JSON 的「原始包裝形狀」＋repo 內 unwrap_json 的實效
name: probe-playsport
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 scrapling
        run: |
          pip -q install "scrapling[all]>=0.4.11"
          scrapling install --force >/dev/null 2>&1 || true
      - name: 抓 billboard 印形狀與解包判定
        run: |
          cat > p3.py <<'PY'
          import json
          src = open('fetch_sidecar.py', encoding='utf-8').read()
          ns = {}
          exec(compile(src.split('def main()')[0], 'fs', 'exec'), ns)
          unwrap = ns['unwrap_json']
          from scrapling.fetchers import StealthySession
          with StealthySession(headless=True) as s:
              p = s.fetch('https://www.playsport.cc/billboard/winRate?allianceid=1&mode=2&during=season&page=0')
              raw = getattr(p, 'html_content', None) or str(p)
          print('RAW_LEN', len(raw))
          print('RAW400', repr(raw[:400]))
          w = unwrap(raw)
          print('UNWRAP200', repr(w[:200]))
          try:
              j = json.loads(w)
              rk = j.get('rankers')
              print('PARSE_OK type=', type(rk).__name__, 'size=', len(rk) if hasattr(rk, '__len__') else '?')
          except Exception as e:
              print('PARSE_FAIL', type(e).__name__, str(e)[:120])
          PY
          python p3.py
