# Bet365 官網優先的 MLB／NPB／KBO／CPBL 獨贏、讓分、大小盤；BetExplorer 只補缺盤。
name: baseball-bet365-odds

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - baseball_bet365_odds.js
      - bet365_official_core.js
      - bet365_official_transport.js
      - fetch_sidecar.py
      - sidecar_client.js
      - requirements-scraping.txt
      - baseball-bet365-integration.js
      - index.html
      - .github/workflows/baseball-bet365-odds.yml
  schedule:
    - cron: '16,46 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: baseball-bet365-odds
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EP_TRANSPORT: sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: 安裝 Bet365 官網渲染傳輸層
        run: |
          pip -q install -r requirements-scraping.txt
          scrapling install --force >/dev/null 2>&1 || echo "WARN Scrapling 瀏覽器安裝非零；本輪會保留舊官網快照或使用 BetExplorer 備援"
      - name: 驗證四聯盟 Bet365 收集器
        run: node --test tests/bet365_official_core.test.js tests/bet365_official_transport.test.js tests/baseball_bet365_odds.test.js tests/baseball_bet365_frontend.test.js
      - name: 5h10m 四聯盟 Bet365 官網優先盤口迴圈
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( SECONDS + 18600 ))
          FAIL_STREAK=0
          while [ "$SECONDS" -lt "$END" ]; do
            T0=$SECONDS
            git rebase --abort 2>/dev/null || true
            git fetch origin main || true
            git reset --hard origin/main || true
            if timeout 420 node baseball_bet365_odds.js; then
              FAIL_STREAK=0
              git add data/baseball_bet365_odds.json 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -m "baseball bet365 official odds $(date -u +%FT%TZ) [skip ci]" || true
                if ! git push; then
                  git pull --rebase --autostash || { git rebase --abort 2>/dev/null || true; }
                  git push || true
                fi
              fi
            else
              FAIL_STREAK=$(( FAIL_STREAK + 1 ))
              echo "WARN Bet365 棒球官網優先管線失敗（連續 $FAIL_STREAK 次）；保留上一份有效資料"
              if [ "$FAIL_STREAK" -ge 3 ]; then exit 1; fi
            fi
            EL=$(( SECONDS - T0 ))
            [ "$EL" -lt 300 ] && sleep $(( 300 - EL ))
          done
      - name: 自我接棒
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "INFO 無 PAT，靠 cron 重點火"; exit 0; fi
          gh workflow run baseball-bet365-odds.yml -R "${{ github.repository }}" && echo "OK 已排下一棒" || echo "WARN 接棒失敗，靠 cron"
