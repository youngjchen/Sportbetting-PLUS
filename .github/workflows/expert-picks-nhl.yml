# NHL 玩運彩高手智慧鬧鐘。首週由 expert_picks.js 冷啟動守門，完全不打推薦端點。
name: expert-picks-nhl

on:
  workflow_dispatch:
  schedule:
    - cron: '19,49 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: expert-picks-nhl
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NHL_SEASON_START: '2026-09-30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: 安裝玩運彩反封鎖傳輸層
        run: |
          pip -q install -r requirements-scraping.txt
          scrapling install --force >/dev/null 2>&1 || echo "WARN scrapling install 非零，curl 可用時不影響"
      - name: NHL 智慧鬧鐘迴圈
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LASTW=$(node -pe "try{require('./data/expert_picks_nhl.json').updated||''}catch(e){''}" 2>/dev/null || echo "")
          END=$(( SECONDS + 18600 ))
          while [ "$SECONDS" -lt "$END" ]; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main || true
            git reset --hard origin/main || true
            W=$(node expert_alarm.js --league=nhl --after="$LASTW" 2>/dev/null) || W='{"sleepSec":600,"mode":"skip","deep":0,"label":"alarm失敗"}'
            SLEEPS=$(node -pe 'JSON.parse(process.argv[1]).sleepSec' "$W")
            MODE=$(node -pe 'JSON.parse(process.argv[1]).mode' "$W")
            DEEP=$(node -pe 'JSON.parse(process.argv[1]).deep' "$W")
            LABEL=$(node -pe 'JSON.parse(process.argv[1]).label' "$W")
            if [ -z "$SLEEPS" ]; then SLEEPS=600; MODE=skip; LABEL=alarm解析失敗; fi
            echo "· [$(date -u +%FT%TZ)] wave=$LABEL mode=$MODE deep=$DEEP sleep=${SLEEPS}s"
            if [ "$MODE" = "skip" ] || [ "$SLEEPS" -gt 0 ]; then sleep "$SLEEPS"; continue; fi
            if EP_LEAGUE=nhl EP_MODE=$MODE EP_DEEP=$DEEP timeout 2700 node expert_picks.js; then
              LASTW=$(date -u +%FT%TZ)
              git add data/expert_picks_nhl.json data/expert_archive 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -m "expert picks nhl $(date -u +%FT%TZ)" || true
                if ! git push; then
                  git pull --rebase --autostash || { git rebase --abort 2>/dev/null || true; }
                  git push || true
                fi
              fi
            else
              echo "WARN NHL 推薦抓取失敗，60 秒後由補償窗重試"
              sleep 60
            fi
          done
      - name: 自我接棒
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "INFO 無 PAT，靠 cron 重點火"; exit 0; fi
          gh workflow run expert-picks-nhl.yml -R "${{ github.repository }}" && echo "OK 已排下一棒" || echo "WARN 接棒失敗，靠 cron"
