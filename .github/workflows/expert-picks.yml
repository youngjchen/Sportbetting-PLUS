name: expert-picks

on:
  workflow_dispatch:
  schedule:
    # 2026-07-26 降級：四聯盟智慧鬧鐘（expert-picks-{lg}.yml）已接手全部賽前抓取，
    # 本工作流僅存「晚間賽後回收掃」職責——亞洲聯盟收工(≈18:30)後到深夜的賽後公開單
    # （殺手單/result 回補）目前只有它撈得到（新管線凌晨深掃時玩運彩頁已換日）。
    # Day2 稽核實測缺口：npb 35/kbo 19/cpbl 12 筆全落在此時窗。
    # 待四條流水線補上「賽後回收波」後，本工作流即可正式退役。
    - cron: '36 12 * * *'   # 台灣 20:36
    - cron: '36 14 * * *'   # 台灣 22:36
    - cron: '36 16 * * *'   # 台灣 00:36

concurrency:
  group: expert-picks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 廢名額後 full=全量合格者(~660人×2頁)≈24-28分，放寬防殺
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: 抓找高手明牌
        run: node expert_picks.js
      - name: commit 結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/expert_picks.json
          if ! git diff --cached --quiet; then
            git commit -m "expert picks $(date -u +%FT%TZ)"
            if ! git push; then
              git pull --rebase --autostash || { git rebase --abort 2>/dev/null || true; }
              git push || true
            fi
          fi
