name: expert-picks

on:
  workflow_dispatch:
  # 2026-07-26 正式退役：四聯盟智慧鬧鐘（expert-picks-{lg}.yml）已接手全部職責——
  # 賽前抓取（簇T-120/T-35/保底/深掃）＋晚間賽後回收波（21:05~23:50，撈賽後公開單）。
  # 本工作流僅保留手動按鈕當緊急備援（跑無環境變數的四聯盟合抓、寫 legacy 檔）；
  # 板端讀檔仍有 legacy 後備腿，緊急時手動跑一次即可讓板面吃到資料。

concurrency:
  group: expert-picks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 廢名額後 full=全量合格者(~660人×2頁)≈24-28分，放寬防殺
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: 抓找高手明牌
        run: node expert_picks.js
      - name: commit 結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/expert_picks.json
          if ! git diff --cached --quiet; then
            git commit -m "expert picks $(date -u +%FT%TZ)"
            if ! git push; then
              git pull --rebase --autostash || { git rebase --abort 2>/dev/null || true; }
              git push || true
            fi
          fi
