# STAKE 官方 NBA／季前賽獨贏、讓分、大小分；開賽前最後三十秒後凍結。
name: nba-stake-odds

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - nba_stake_odds.js
      - nba_odds_core.js
      - nba-odds-integration.js
      - .github/workflows/nba-stake-odds.yml
  schedule:
    - cron: '9,39 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: nba-stake-odds
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: 驗證 NBA STAKE 收集器
        run: node --test tests/nba_odds_core.test.js tests/nba_collectors.test.js tests/nba_three_source_frontend.test.js
      - name: 5h10m NBA STAKE 官方盤迴圈
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( SECONDS + 18600 ))
          while [ "$SECONDS" -lt "$END" ]; do
            T0=$SECONDS
            git rebase --abort 2>/dev/null || true
            git fetch origin main || true
            git reset --hard origin/main || true
            if timeout 180 node nba_stake_odds.js; then
              git add data/nba_stake_odds.json 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -m "nba stake odds $(date -u +%FT%TZ) [skip ci]" || true
                if ! git push; then
                  git pull --rebase --autostash || { git rebase --abort 2>/dev/null || true; }
                  git push || true
                fi
              fi
            else
              echo "WARN NBA STAKE 官方盤抓取失敗；保留上一份有效資料，下一輪重試"
            fi
            EL=$(( SECONDS - T0 ))
            [ "$EL" -lt 300 ] && sleep $(( 300 - EL ))
          done
      - name: 自我接棒
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "INFO 無 PAT，靠 cron 重點火"; exit 0; fi
          gh workflow run nba-stake-odds.yml -R "${{ github.repository }}" && echo "OK 已排下一棒" || echo "WARN 接棒失敗，靠 cron"
