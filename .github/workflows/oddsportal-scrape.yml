name: scrape-oddsportal-stake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oddsportal-scrape.yml'
      - 'oddsportal_scraper.py'
      - 'oddsportal-integration.js'
      - 'tests/test_oddsportal_scraper.py'
      - 'tests/oddsportal_integration.test.js'
  schedule:
    # Off the hour boundary to reduce GitHub scheduled-run delays.
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: scrape-oddsportal-loop
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked Node test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Scrapling runtime
        run: |
          pip -q install -r requirements-scraping.txt
          scrapling install --force >/dev/null
      - name: Contract tests
        run: |
          python -m unittest tests.test_oddsportal_scraper
          node --test tests/oddsportal_integration.test.js
      - name: Poll OddsPortal once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          set +e
          python oddsportal_scraper.py 2>&1 | tee "$RUNNER_TEMP/oddsportal-scrape.log"
          scrape_status=${PIPESTATUS[0]}
          set -e
          if [ "$scrape_status" -ne 0 ]; then
            # This repo is public. Only publish the scraper's own URL/error text;
            # cookies, headers, credentials and environment values are never logged.
            scrape_error=$(tail -n 12 "$RUNNER_TEMP/oddsportal-scrape.log" | tr '\r\n' ' ' | sed 's/%/%25/g')
            echo "::error title=OddsPortal scrape failed::$scrape_error"
            exit "$scrape_status"
          fi

          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' data/oddsportal_summary.json data/oddsportal_history 2>/dev/null; then
            echo "ERROR conflict marker in OddsPortal data; refusing commit"
            exit 1
          fi

          git add data/oddsportal_summary.json data/oddsportal_history
          if git diff --cached --quiet; then
            echo "No OddsPortal data changes"
            exit 0
          fi

          git commit -m "oddsportal update $(date -u +%FT%TZ) [skip ci]"
          if ! git push origin HEAD:main; then
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            git push origin HEAD:main
          fi
