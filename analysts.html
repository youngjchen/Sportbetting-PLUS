<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分析師推薦</title>
<!-- 分析師推薦登錄頁（計畫：docs/plans/2026-10-14-analyst-picks-page.md）
     上方橫排分析師、左側豎排聯盟；每場兩顆隊伍鈕：
       左鍵＝表單層：ML → 讓分 → 取消；右鍵／長按＝LOTTO 層：同樣循環。
     推薦只存 state/analyst_picks.json（本頁唯一寫手，沿用 github-sync 的權杖 gh_sync_pat）；
     不讀寫盤面 doc（sportbetting_plus_doc_v2），異常統計／七類零接觸。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0f14; --panel:#151a22; --panel-2:#1b222c; --line:#2a3340;
    --ink:#e9eef5; --ink-dim:#97a3b3; --lit:#ffb02e;
    --ml:#2f6fb5; --ml-bg:rgba(47,111,181,.28); --sp:#2f9b6a; --sp-bg:rgba(47,155,106,.28);
    --lotto:#ffb02e; --win:#3ecf7a; --loss:#ff5b6e; --conflict:#ff3b5c;
    --gold:#d6a828; --gold-bg:rgba(214,168,40,.42); --rel:#8b6cf0; --rel-bg:rgba(139,108,240,.30);
    --cf-bg:rgba(255,59,92,.24); --lotyel:#d8c77c; --lotyel-bg:rgba(236,214,120,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;font-size:16px}
  header,.tabs,.datebar{flex:0 0 auto}   /* 有 overflow 的列在 flex 欄裡會被壓扁蓋到下一列 */
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .logo{font-size:20px;font-weight:700;margin-right:6px}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:14.5px;font-weight:700;color:var(--ink-dim);text-decoration:none;white-space:nowrap}
  .hbtn{padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .hbtn.on{border-color:var(--lit);color:var(--lit)}
  #sync{margin-left:auto;color:var(--ink-dim);font-size:13.5px;white-space:nowrap}
  #sync.err{color:var(--loss)}
  .tabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);overflow-x:auto;align-items:center}
  .tab{min-width:104px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink-dim);font-size:15.5px;font-weight:700;cursor:pointer;text-align:center;white-space:nowrap}
  .tab.on{color:#151006;background:var(--lit);border-color:var(--lit)}
  .tbr{display:none}   /* 手機：複選與複製自…換到第二行 */
  .tab .sn{display:none}   /* 手機：分析師分頁用縮寫 */
  .tab small{font-weight:500;opacity:.8;margin-left:4px;font-size:13px}
  select.hbtn{appearance:auto}
  .datebar{display:flex;gap:6px;padding:7px 14px;border-bottom:1px solid var(--line);overflow-x:auto;align-items:center}
  .dbtn{padding:5px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .dbtn.on{background:var(--ink);color:var(--bg)}
  .body{flex:1 1 auto;display:flex;min-height:0}
  nav.rail{flex:0 0 82px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:var(--panel)}
  .lg{padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink-dim);font-size:15.5px;font-weight:700;cursor:pointer;text-align:center;line-height:1.3}
  .lg.on{color:var(--ink);border-color:var(--lit)}
  .lg small{display:block;font-weight:500;font-size:12.5px}
  main{flex:1 1 auto;overflow:auto;padding:10px 14px 28px}
  .legend{color:var(--ink-dim);font-size:13.5px;padding:2px 2px 8px}
  .game{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) minmax(220px,0.95fr);gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
  .gtime{color:var(--ink-dim);font-size:13.5px;text-align:center;line-height:1.4}
  .gtime b{display:block;color:var(--ink);font-size:15.5px}
  .team{position:relative;height:68px;padding:7px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);text-align:left;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;font-family:inherit}
  .team .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team.hasb .nm{padding-right:54px}
  .team .od{color:var(--ink-dim);font-size:13.5px;margin-top:4px;white-space:nowrap}
  .team.ml{background:var(--ml-bg);border-color:var(--ml)}
  .team.sp{background:var(--sp-bg);border-color:var(--sp)}
  .team.lotonly{background:var(--lotyel-bg);border-color:var(--lotyel)}   /* 只有 LOTTO：淺黃 */
  .team.gold{background:var(--gold-bg);border-color:var(--gold)}           /* 複選：同隊同盤口 */
  .team.rel{background:var(--rel-bg);border-color:var(--rel)}              /* 複選：同隊不同盤口 */
  .team.cf{background:var(--cf-bg);border-color:var(--conflict)}           /* 複選：互相衝突 */
  .team .od.who{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis}
  .badge{position:absolute;top:6px;right:7px;font-size:12.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.35)}
  .badge2{position:absolute;bottom:6px;right:7px;font-size:12.5px;font-weight:700;color:var(--lotto)}
  .badge2 .rv{color:#b9a6ff}   /* 改版另計 */
  .tab.watch{border-style:dashed}
  .info .who span.wt{opacity:.75;border-style:dotted}
  .wday{display:inline-block;margin:3px 4px 3px 0;padding:3px 8px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;color:var(--ink-dim)}
  .wday.on{border-color:var(--lit);color:var(--ink);background:rgba(255,176,46,.12)}
  .res{font-size:14px;margin-left:5px}
  .info{font-size:13.5px;color:var(--ink-dim);line-height:1.55;min-width:0}
  .info .who span{display:inline-block;padding:0 6px;margin:1px 3px 1px 0;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink)}
  .info .who span.l{border-style:dashed;border-color:var(--lotto)}
  .info .who span.w{background:rgba(62,207,122,.22);border-color:var(--win);color:#d4f7e2}
  .info .who span.x{background:rgba(255,91,110,.18);border-color:var(--loss);color:#ffd6dc}
  .info .who span.p{opacity:.55}
  .d-after{font-size:13px;color:var(--ink-dim);margin-top:2px}
  .d-after .up{color:var(--win)} .d-after .dn{color:var(--loss)}
  .info .tag{font-weight:700;color:var(--ink);font-size:14px}
  .info .tag.c{color:var(--conflict)}
  .info .hist{margin-top:4px;color:var(--ink);font-size:13.5px;line-height:1.6}
  .info .hist .h-dim{color:var(--ink-dim)}
  .pen{border:none;background:none;color:var(--ink-dim);cursor:pointer;font-size:15px;padding:0 3px}
  .empty{color:var(--ink-dim);text-align:center;padding:40px 10px;line-height:2}
  footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);padding:8px 14px;font-size:14px;color:var(--ink-dim);display:flex;gap:16px;flex-wrap:wrap}
  footer b{color:var(--ink)}
  /* 命中率色階：45% 以下灰 → 80% 以上金（rateStyle()），樣本不足淡化 */
  .rate{display:inline-block;min-width:58px;padding:1px 7px;border-radius:6px;font-weight:700;text-align:center}
  .rate.few{opacity:.45}
  /* ---------- 分析頁 ---------- */
  .st-sec{margin:18px 0 6px;font-weight:700;font-size:18px}
  .st-help{color:var(--ink-dim);font-size:13.5px;margin:0 0 8px;line-height:1.65}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
  .chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--ink-dim);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip.on{color:#151006;background:var(--lit);border-color:var(--lit)}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .filters label{color:var(--ink-dim);font-size:13.5px}
  .filters input{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:14px}
  .tbl{width:100%;border-collapse:collapse;font-size:16px}
  .tbl th{color:var(--ink-dim);font-weight:500;font-size:13.5px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td.num{font-size:17px;font-weight:700}
  .tbl tr[data-drill]{cursor:pointer}
  .tbl tr[data-drill]:hover td{background:var(--panel-2)}
  .tbl tr.open td{background:var(--panel-2)}
  .tbl .thin td{opacity:.5}
  .tbl tr.drill-row td{padding:0 0 8px;background:transparent;white-space:normal;text-align:left}
  .pos{color:var(--win)} .neg{color:var(--loss)}
  .mx{display:grid;grid-template-columns:78px repeat(var(--n,5),minmax(0,1fr));gap:5px;font-size:13.5px}
  .mx > div{padding:8px 2px;text-align:center;border-radius:7px;line-height:1.35}
  .mx .h{color:var(--ink-dim);font-weight:700}
  .mx .cell b{display:block;font-size:17px}
  .mx [data-drill]{cursor:pointer}
  .mx .drill{grid-column:1 / -1;text-align:left;padding:8px 10px}
  .mx-legend{display:flex;align-items:center;gap:8px;color:var(--ink-dim);font-size:13px;margin:6px 0}
  .mx-legend .bar{width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgb(84,92,106),rgb(214,168,40))}
  .drill{border:1px solid var(--lit);border-radius:10px;padding:8px 10px;margin:4px 0 2px;background:var(--panel)}
  .drill .dh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px;font-size:15px}
  .drill .dg{display:grid;grid-template-columns:84px minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr);gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line);align-items:center;line-height:1.45}
  .drill .dg-h{color:var(--ink-dim);font-size:12.5px;border-top:0;padding-top:0}
  .tbl tr[data-anchor]{cursor:pointer}
  .tbl tr[data-anchor]:hover td{background:var(--panel-2)}
  .tbl td.me b{color:var(--lit)}
  /* ---------- 分析頁分頁、查詢列 ---------- */
  .stabs{display:flex;gap:4px;margin:0 0 10px;border-bottom:2px solid var(--line);overflow-x:auto}
  .stab{padding:9px 16px;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:transparent;color:var(--ink-dim);font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
  .stab.on{color:var(--ink);border-bottom-color:var(--lit)}
  .qbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px 11px;margin:10px 0}
  .qbox .chips{align-items:center}
  .clab{color:var(--ink-dim);font-size:13.5px;min-width:52px}
  .csep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}
  .chip.sm{padding:4px 10px;font-size:13px}
  /* ---------- 對決卡 ---------- */
  .duel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel)}
  .d-title{font-weight:700;font-size:15px;margin-bottom:6px;line-height:1.45}
  .d-vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;text-align:center}
  .d-who{font-size:14px;color:var(--ink-dim);font-weight:700}
  .d-big{font-size:34px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
  .d-sub{font-size:13px;color:var(--ink-dim)}
  .d-mid{color:var(--ink-dim);font-weight:700}
  .d-split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:3px;margin:8px 0 6px}
  .d-note{font-size:13px;color:var(--ink-dim);line-height:1.55}
  .duel.few .d-big,.duel.few .d-split{opacity:.5}
  .d-one{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .d-extra{font-size:13.5px;color:var(--ink-dim);margin-top:4px}
  .wrap-x{overflow-x:auto}
  /* ---------- 登錄頁底部：今天押什麼 ---------- */
  .today{margin-top:22px;padding-top:10px;border-top:2px solid var(--line)}
  .ahead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .ahead .st-sec{font-size:20px}
  .ahead .hbtn{margin-left:auto;width:42px;text-align:center}
  .aset{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px 11px;margin:6px 0}
  .asec{margin:20px 0 4px;padding-bottom:6px;font-weight:700;font-size:19px;border-bottom:2px solid var(--line)}
  .asec small{color:var(--ink-dim);font-weight:500;margin-left:6px;font-size:15px}
  /* 每列兩行：①判定＋押什麼（跳過＝對戰兩隊）＋標籤 ②對戰兩隊・理由；時間在左、結果與展開鈕在右 */
  .arow{display:grid;grid-template-columns:60px minmax(0,1fr) 30px 16px;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .arow:hover,.arow.open{background:var(--panel)}
  .arow .at{color:var(--ink-dim);font-size:16px;font-variant-numeric:tabular-nums;align-self:start;padding-top:4px}
  .amain{min-width:0}
  .a1{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:18px;line-height:1.35}
  .a1 .ap{white-space:nowrap}
  .a1 .ap b{font-size:20px}
  .a1 .ap small{font-size:15.5px;margin-left:2px}
  .a1 .am{font-size:18px;color:var(--ink)}
  .a2{margin-top:5px;color:var(--ink-dim);font-size:15.5px;line-height:1.55}
  .a2 .am{color:var(--ink)}
  .am b{color:var(--lit)}
  .a1 .alt{font-size:15.5px;white-space:nowrap}
  .arow .at .dots{display:block;color:var(--lit);font-size:11px;letter-spacing:0;margin-top:3px;white-space:nowrap}
  .ahead .otime{font-size:14.5px;color:var(--ink-dim);white-space:nowrap}
  .arec{font-size:15px;cursor:pointer;white-space:nowrap;padding:4px 8px;border:1px solid var(--line);border-radius:8px}
  .arec-tbl{padding:6px 12px 10px}
  .chip.info{min-width:40px}
  .sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--ink-dim)}
  .sdot.ok{background:var(--win)} .sdot.wait{background:var(--lit)} .sdot.bad{background:var(--loss)}
  .a2 .abadge{margin-left:8px}
  .abadge sup{font-size:10px;margin-left:1px}
  .arec b.pos{color:var(--win)} .arec b.neg{color:var(--loss)}
  .a1 .alt.ok{color:var(--lit);font-weight:700}
  .a1 .alt.no{color:var(--ink-dim);opacity:.75}
  .arow .ar{text-align:center;font-size:19px}
  .arow .ac{text-align:center;color:var(--ink-dim);font-size:15px}
  .vchip{display:inline-block;min-width:88px;text-align:center;padding:4px 10px;border-radius:8px;font-weight:700;font-size:15px;border:1px solid;white-space:nowrap}
  .vchip.fol{color:#d4f7e2;background:rgba(62,207,122,.20);border-color:var(--win)}
  .vchip.agn{color:#e3d9ff;background:var(--rel-bg);border-color:var(--rel)}
  .vchip.non{color:var(--ink);background:var(--panel-2);border-color:var(--line)}
  .vchip.skip{color:var(--ink-dim);background:transparent;border-color:var(--line)}
  .abadge{display:inline-block;padding:2px 9px;border-radius:7px;font-size:14px;font-weight:700;border:1px solid var(--line);color:var(--ink-dim);white-space:nowrap}
  .abadge.hot{color:#1b1405;background:var(--lit);border-color:var(--lit)}
  .abadge.flip{border-color:var(--loss);color:#ffd6dc}
  .aev{padding:6px 12px 14px 80px;border-bottom:1px solid var(--line);background:var(--panel)}
  .evl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px;font-size:15.5px;line-height:1.7;padding:4px 0}
  .evl small{margin-left:3px;font-size:13.5px}
  .evl .ig,.info .who span.ig{text-decoration:line-through;opacity:.5}
  .h-dim{color:var(--ink-dim)}
  @media (max-width:720px){
    .d-big{font-size:28px}
    .arow{grid-template-columns:38px minmax(0,1fr) 22px 10px;gap:8px;padding:11px 4px}
    .arow .at{font-size:13.5px}
    .a1{font-size:16.5px;gap:6px 8px}
    .a1 .ap b{font-size:17.5px}
    .a1 .am{font-size:16.5px}
    .a2{font-size:14.5px}
    .vchip{min-width:0;padding:2px 7px;font-size:13.5px}
    .abadge{font-size:13px;padding:1px 7px}
    .aev{padding:6px 8px 12px}
    .evl{font-size:14.5px;grid-template-columns:24px minmax(0,1fr)}
  }
  #toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--lit);color:var(--ink);padding:8px 15px;border-radius:10px;font-size:14.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  #toast.show{opacity:1}
  @media (max-width:720px){
    body{font-size:15px}
    header{padding:7px 10px;gap:6px}
    .logo{font-size:17px}
    .pill .t{display:none}
    .pill{padding:4px 9px}
    #sync{flex-basis:auto;margin-left:auto;font-size:12.5px}
    #sync .stxt{display:none}
    .hbtn .t{display:none}
    .hbtn{min-width:40px;min-height:38px;padding:6px 9px}
    /* 底部命中：一行、橫向捲動，不再吃掉半個畫面 */
    footer{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;gap:12px;padding:6px 10px;font-size:13px;scrollbar-width:none}
    footer::-webkit-scrollbar{display:none}
    footer > span{flex:0 0 auto}
    /* 今天押什麼：觸控目標放大 */
    .ahead{gap:8px}
    .ahead .st-sec{font-size:18px}
    .chip.sm{padding:8px 12px;font-size:14px;min-height:40px}
    .arow{min-height:56px}
    .aev .evl{font-size:14px;line-height:1.6}
    nav.rail{flex-basis:60px}
    .lg{font-size:14px}
    .game{grid-template-columns:46px minmax(0,1fr) minmax(0,1fr);grid-template-areas:"t a h" "i i i"}
    .gtime{grid-area:t}.game .info{grid-area:i;padding-left:56px}
    .tabs{flex-wrap:wrap;padding:7px 10px}
    .tab{flex:1 1 0;min-width:0;padding:8px 2px;font-size:13px}
    .tab small{display:block;margin:0}
    .tbr{display:block;flex-basis:100%;height:0}
    .tab .fn{display:none} .tab .sn{display:inline}
    #copySel{flex:1 1 0;min-width:0}
    .team{padding:6px 8px;height:64px}
    .team .nm{font-size:15.5px}
    .team .od{font-size:12.5px}
    .team.hasb .nm{padding-right:46px}
    .badge{font-size:11px;padding:1px 4px}
    .tbl{font-size:14.5px}
    .tbl td.num{font-size:15.5px}
    .tbl td,.tbl th{padding:6px 5px}
    .rate{min-width:50px;padding:1px 4px}
    .mx{grid-template-columns:50px repeat(var(--n,5),minmax(0,1fr));font-size:12px;gap:3px}

<script src="./nhl_stake_core.js?v=20261004total2"></script>
<script src="./nhl_bet365_core.js?v=20261004total2"></script>
<script>
(function () {
  'use strict';
  const Core = window.AnalystCore;
  const ANALYSTS = Core.ANALYSTS;
  // 觀察名單：照常登錄與結算，但不進任何合併統計（同向／衝突、對決、組合、今日對決卡）
  const WATCH = Core.WATCH || [];
  const ROSTER = ANALYSTS.concat(WATCH);
  const isWatch = (a) => WATCH.includes(a);
  const mainOnly = (rows) => rows.filter((r) => !isWatch(r.analyst));
  const SHORT = { APE: 'APE', BOOKIE: 'BOO', BANKROLL: 'BAN', SNIPER: 'SNI', MONEY: 'MON', LEO: 'LEO' };
  const LEAGUES = ['NHL', 'MLB', 'NBA'];
  const REPO = 'youngjchen/Sportbetting-PLUS';
  const RAW = `https://raw.githubusercontent.com/${REPO}/main/`;
  const PICKS_PATH = 'state/analyst_picks.json';
  const API = `https://api.github.com/repos/${REPO}/contents/${PICKS_PATH}`;
  const BLOB_API = `https://api.github.com/repos/${REPO}/git/blobs/`;
  const LOCAL_KEY = 'analyst_picks_v1';
  const VIEW_KEY = 'analyst_picks_view_v1';
  const PAT_KEY = 'gh_sync_pat';   // 與 github-sync.js 共用
  const SRC = {
    NHL: { pregame: 'data/nhl_pregame.json', stake: 'data/stake_api_odds.json', b365: 'data/nhl_bet365_odds.json' },
    MLB: { pregame: 'data/pregame_data.json', stake: 'data/baseball_stake_odds.json' },
    NBA: { pregame: 'data/nba_pregame.json', stake: 'data/nba_stake_odds.json' },
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const fmtOdds = (v) => (v == null ? '—' : Number(v).toFixed(2));
  const signed = (n) => (n > 0 ? `+${n}` : `${n}`);
  function twToday() { return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); }
  function nowIso() { return new Date().toISOString(); }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

  /* ---------- 狀態 ---------- */
  const view = Object.assign({ analyst: 'APE', league: 'NHL', date: twToday(), retro: false, mode: 'entry', multi: false, multiSel: [] }, readJson(VIEW_KEY) || {});
  // 複選＝只看不登錄：選幾位分析師，隊伍依他們的推薦上色（同盤口金、同隊不同盤口紫、衝突紅）
  const multiSel = () => ROSTER.filter((a) => (view.multiSel || []).includes(a));
  const REVISERS = Core.REVISERS || [];
  const canRevise = (a) => isWatch(a) || REVISERS.includes(a);
  const revMode = () => !view.multi && view.rev && canRevise(view.analyst);   // ✎ 改版：左鍵改記「改版另計」
  view.st = Object.assign({ league: view.league, range: 'all', from: '', to: '', phase: 'default', scenario: 'all', matrix: 'same', min: 20, sel: [], tab: 'duel', hero: 'BANKROLL', heroM: 'PLUS', oppMode: 'any', opp: [], oppM: 'ML', rel: 'oppose' }, view.st || {});
  const DATA = { NHL: { games: [], stake: null, b365: null }, MLB: { games: [], stake: null }, NBA: { games: [], stake: null } };
  let RESULTS = {};   // data/analyst_results.json（analyst-settle 工作流寫）：官方核對後的比分、賽季階段、Stake 收盤價
  let RESULTS_VER = 0;   // 結算檔內容變了就 +1（卡片快取跟著失效）
  let picks = (readJson(LOCAL_KEY) || {}).picks || [];

  function readJson(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
  function saveView() { try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch (e) {} }
  function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ version: 1, savedAt: nowIso(), picks })); } catch (e) { toast('本機儲存失敗：' + e.message); } }

  /* ---------- 資料載入：raw GitHub（最新）→ 本站 data/ 後備 ---------- */
  async function fetchJson(rel) {
    // 本機預覽（localhost）先讀工作目錄的檔案，方便驗證還沒推送的資料；線上一律先讀 raw GitHub（最新）
    const urls = [`${RAW}${rel}?t=${Date.now()}`, `./${rel}?t=${Date.now()}`];
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) urls.reverse();
    for (const url of urls) {
      try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {}
    }
    return null;
  }
  function startMs(g) { return Date.parse(`${g.date}T${String(g.time || '00:00').padStart(5, '0')}:00+08:00`); }
  function normalizeGames(league, feed) {
    const list = Array.isArray(feed) ? feed : (feed && feed.games) || [];
    return list.filter((g) => !g.league || g.league === league).map((g) => {
      const away = g.away || g.awayTeam; const home = g.home || g.homeTeam;
      const out = { league, officialId: g.officialId, date: g.date, time: g.time, away, home,
        awayScore: g.awayScore, homeScore: g.homeScore, final: g.status === 'finished', status: g.status };
      out.startMs = startMs(out);
      return out;
    }).filter((g) => g.officialId && g.away && g.home);
  }
  // 各聯盟 Stake → core.priceFrom 用的 {ml:{away,home}, spread:{line,favorite,away,home}}
  // 各聯盟 Stake 快照、預設讓分線：與結算程式共用 analyst-advice.js（2026-11-15）
  const ADV_DEPS = () => ({ Core, NhlStake: window.NhlStake, NhlBet365: window.NhlBet365 });
  const advFeeds = () => ({ NHL: { stake: DATA.NHL.stake, b365: DATA.NHL.b365 }, MLB: { stake: DATA.MLB.stake }, NBA: { stake: DATA.NBA.stake } });
  function stakeSnapshot(league, g) { return window.AnalystAdvice.stakeSnapshot(league, g, advFeeds(), ADV_DEPS()); }
  // 第 2 下的讓分線：MLB 固定 +1.5；NBA、NHL 照當下 Stake 主盤（2026-11-07：「Stake 盤口怎麼開，頁面就怎麼顯示」）
  function defaultSpreadLine(league, snap, side) { return window.AnalystAdvice.defaultSpreadLine(league, snap, side); }

  /* ---------- 推薦操作 ---------- */
  function findPick(analyst, officialId, layer) {
    return picks.find((p) => p.analyst === analyst && p.officialId === officialId && p.layer === layer && !p.deleted);
  }
  function upsert(fields) {
    const key = Core.pickKey(fields);
    const i = picks.findIndex((p) => Core.pickKey(p) === key);
    const next = Object.assign({}, i >= 0 ? picks[i] : {}, fields, { updatedAt: nowIso() });
    if (i >= 0) picks[i] = next; else picks.push(next);
    saveLocal();
    scheduleUpload();
  }
  function statusFor(g) {
    if (view.retro) return '回溯';
    return Date.now() >= g.startMs ? '賽後補登' : '賽前';
  }
  function setPick(g, layer, side, market, line) {
    const snap = stakeSnapshot(g.league, g);
    const base = { analyst: view.analyst, officialId: g.officialId, layer, league: g.league, date: g.date, time: g.time,
      away: g.away, home: g.home, deleted: false };
    if (!side) { upsert(Object.assign(base, { deleted: true })); return; }
    const pick = Object.assign(base, { side, team: side === 'away' ? g.away : g.home, market, line: market === 'ML' ? 0 : line,
      enteredAt: nowIso(), status: statusFor(g) });
    pick.entryOdds = Core.priceFrom(snap, pick);
    upsert(pick);
    if (pick.status === '賽後補登') toast('已開賽：這筆標為「賽後補登」');
  }
  function cycle(g, layer, side) {
    const cur = findPick(view.analyst, g.officialId, layer);
    if (!cur || cur.side !== side) return setPick(g, layer, side, 'ML', 0);
    if (cur.market === 'ML') {
      let line = defaultSpreadLine(g.league, stakeSnapshot(g.league, g), side);
      if (line == null) {
        const v = window.prompt(`Stake 沒有這場的讓分線，請輸入 ${side === 'away' ? g.away : g.home} 的讓分（例：${g.league === 'NHL' ? '+1.5 或 -2.5' : '+6.5 或 -4.5'}）`);
        if (v == null || !Number.isFinite(Number(v))) return;
        line = Number(v);
      }
      return setPick(g, layer, side, 'SPREAD', line);
    }
    return setPick(g, layer, null);
  }
  function editLine(g) {
    const p = [findPick(view.analyst, g.officialId, 'card'), findPick(view.analyst, g.officialId, 'lotto')].find((x) => x && x.market === 'SPREAD');
    if (!p) { toast('先在隊伍上點兩下選讓分，再改線'); return; }
    const v = window.prompt(`改 ${view.analyst} 的讓分線（${p.team}，目前 ${signed(p.line)}）`, signed(p.line));
    if (v == null || !Number.isFinite(Number(v))) return;
    setPick(g, p.layer, p.side, 'SPREAD', Number(v));
    render();
  }
  function copyFrom(src) {
    const games = gamesFor(view.league, view.date);
    const n = picks.filter((p) => p.analyst === src && !p.deleted && games.some((g) => g.officialId === p.officialId)).length;
    if (!n) { toast(`${src} 在這天的 ${view.league} 沒有推薦`); return; }
    if (!window.confirm(`把 ${src} 的 ${n} 筆推薦複製給 ${view.analyst}？（同場同層會被覆蓋）`)) return;
    for (const g of games) {
      for (const layer of Core.LAYERS) {
        const s = findPick(src, g.officialId, layer);
        if (s) setPick(g, layer, s.side, s.market, s.line);
      }
    }
    render();
  }

  /* ---------- GitHub 同步（本頁唯一寫 state/analyst_picks.json） ---------- */
  function getPAT() { try { return localStorage.getItem(PAT_KEY) || ''; } catch (e) { return ''; } }
  function b64ToUtf8(b64) { const bin = atob(b64.replace(/\n/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function utf8ToB64(str) { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
  const ORDER = (p) => [p.date, p.league, p.time || '', p.officialId, ANALYSTS.indexOf(p.analyst), p.layer].join('|');
  function serialize(list) {
    const sorted = list.slice().sort((a, b) => (ORDER(a) < ORDER(b) ? -1 : ORDER(a) > ORDER(b) ? 1 : 0));
    return `{"version":1,"updatedAt":"${nowIso()}","picks":[\n${sorted.map((p) => JSON.stringify(p)).join(',\n')}\n]}\n`;
  }
  async function remoteGet() {
    const pat = getPAT();
    const headers = { Accept: 'application/vnd.github+json' };
    if (pat) headers.Authorization = `Bearer ${pat}`;
    const r = await fetch(`${API}?ref=main&t=${Date.now()}`, { headers, cache: 'no-store' });
    if (r.status === 404) return { sha: null, picks: [] };
    if (!r.ok) {
      if (!pat) { const raw = await fetchJson(PICKS_PATH); return { sha: null, picks: (raw && raw.picks) || [], readOnly: true }; }
      throw new Error(`讀取失敗 HTTP ${r.status}`);
    }
    const meta = await r.json();
    let b64 = meta.content || '';
    // 檔案超過 1MB 時 Contents API 只給 sha、content 空白（encoding "none"）→ 用同一個 sha 向 git blob 取內容（上限 100MB）
    if (!b64 && meta.sha && meta.size > 0) {
      const br = await fetch(`${BLOB_API}${meta.sha}`, { headers });
      if (!br.ok) throw new Error(`讀取失敗 HTTP ${br.status}`);
      b64 = (await br.json()).content || '';
    }
    const doc = JSON.parse(b64ToUtf8(b64));
    return { sha: meta.sha, picks: doc.picks || [] };
  }
  async function remotePut(list, sha) {
    const body = { message: `analyst picks ${view.date} ${view.league}`, content: utf8ToB64(serialize(list)), branch: 'main' };
    if (sha) body.sha = sha;
    const r = await fetch(API, { method: 'PUT', headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${getPAT()}` }, body: JSON.stringify(body) });
    if (!r.ok) { const e = new Error(`上傳失敗 HTTP ${r.status}`); e.status = r.status; throw e; }
  }
  const same = (a, b) => JSON.stringify(a.map(ORDER_FULL).sort()) === JSON.stringify(b.map(ORDER_FULL).sort());
  function ORDER_FULL(p) { return JSON.stringify(Object.keys(p).sort().reduce((o, k) => { o[k] = p[k]; return o; }, {})); }
  let syncing = false; let again = false; let timer = null;
  // 同步狀態：小燈＋字（手機只留燈，字在提示）；綠＝已同步、黃＝等待／唯讀、紅＝失敗
  function setSync(text, err) {
    const el = $('sync'); const st = err ? 'bad' : /^已(同步|上傳)/.test(text) ? 'ok' : 'wait';
    el.innerHTML = `<i class="sdot ${st}"></i><span class="stxt">${esc(text)}</span>`; el.title = text; el.classList.toggle('err', !!err);
  }
  function scheduleUpload() { setSync('已存本機，等待上傳…'); clearTimeout(timer); timer = setTimeout(syncNow, 3000); }
  async function syncNow() {
    if (syncing) { again = true; return; }
    syncing = true;
    try {
      for (let attempt = 1; attempt <= 3; attempt++) {
        const remote = await remoteGet();
        const merged = Core.mergePicks(remote.picks, picks);
        picks = merged; saveLocal();
        if (!getPAT() || remote.readOnly) { setSync('唯讀（未設權杖，只存在這台裝置）', !getPAT()); break; }
        if (same(merged, remote.picks)) { setSync(`已同步 ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`); break; }
        try { await remotePut(merged, remote.sha); setSync(`已上傳 ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`); break; }
        catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 3) continue; throw e; }
      }
    } catch (e) {
      setSync(`同步失敗：${e.message}（資料仍在本機）`, true);
    } finally {
      syncing = false;
      render();
      if (again) { again = false; syncNow(); }
    }
  }

  /* ---------- 畫面 ---------- */
  // 賽程檔（滾動、只留幾天）∪ 結算檔（永久）：結算檔有結論時以它為準；舊日期靠結算檔才看得到
  function gamesFor(league, date) {
    const byId = new Map();
    for (const g of DATA[league].games) if (g.date === date) byId.set(g.officialId, Object.assign({}, g));
    for (const [id, r] of Object.entries(RESULTS)) {
      if (r.league !== league || r.date !== date) continue;
      const g = byId.get(id) || { league, officialId: id, date: r.date, time: r.time, away: r.away, home: r.home, startMs: startMs(r) };
      if (r.final) Object.assign(g, { awayScore: r.awayScore, homeScore: r.homeScore, final: true });
      Object.assign(g, { closing: r.closing || null, phase: r.phase || null, review: r.review || null, officialCheck: r.officialCheck || null });
      if (r.review) g.final = false;
      byId.set(id, g);
    }
    return [...byId.values()].sort((a, b) => a.startMs - b.startMs);
  }
  function mainPick(analyst, officialId) { return findPick(analyst, officialId, 'card') || findPick(analyst, officialId, 'lotto'); }

  function renderTabs() {
    const ids = new Set(gamesFor(view.league, view.date).map((g) => g.officialId));
    $('tabs').innerHTML = ROSTER.map((a) => {
      const n = picks.filter((p) => p.analyst === a && !p.deleted && ids.has(p.officialId)).length;
      const on = view.multi ? multiSel().includes(a) : a === view.analyst;
      return `<button class="tab${on ? ' on' : ''}${isWatch(a) ? ' watch' : ''}" data-a="${a}"${isWatch(a) ? ' title="觀察中：只看他自己的戰績，不進合併統計"' : ''}>${isWatch(a) ? '👁 ' : ''}<span class="fn">${a}</span><span class="sn">${SHORT[a]}</span><small>${n || ''}</small></button>`;
    }).join('') + `<span class="tbr"></span>${!view.multi && canRevise(view.analyst) ? `<button class="hbtn${view.rev ? ' on' : ''}" data-rev="1" title="改版另計：同日第二版表單改動的場次，開著時左鍵改記這一層">✎ 改版</button>` : ''}<button class="hbtn${view.multi ? ' on' : ''}" data-multi="1" title="複選：選兩位以上看他們的推薦關係（只看不登錄）">☑ 複選</button>` + (view.multi ? '' : `<select class="hbtn" id="copySel" title="把另一位分析師在這天這聯盟的推薦複製過來"><option value="">⧉ 複製自…</option>${ANALYSTS.filter((a) => a !== view.analyst).map((a) => `<option>${a}</option>`).join('')}</select>`);
  }
  function renderDates() {
    const set = new Set([twToday(), view.date]);
    for (const lg of LEAGUES) DATA[lg].games.forEach((g) => set.add(g.date));
    picks.forEach((p) => { if (!p.deleted) set.add(p.date); });
    const dates = [...set].sort();
    $('dates').innerHTML = dates.map((d) => `<button class="dbtn${d === view.date ? ' on' : ''}" data-d="${d}">${d.slice(5).replace('-', '/')}${d === twToday() ? ' 今' : ''}</button>`).join('');
    const on = $('dates').querySelector('.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  function renderRail() {
    $('rail').innerHTML = LEAGUES.map((lg) => `<button class="lg${lg === view.league ? ' on' : ''}" data-l="${lg}">${lg}<small>${gamesFor(lg, view.date).length} 場</small></button>`).join('');
  }
  function teamButton(g, side, snap) {
    const card = findPick(view.analyst, g.officialId, 'card');
    const lotto = findPick(view.analyst, g.officialId, 'lotto');
    const rev = findPick(view.analyst, g.officialId, 'rev');
    const sp = defaultSpreadLine(g.league, snap, side);
    const mlOdds = snap && snap.ml ? snap.ml[side] : null;
    const spOdds = sp == null ? null : Core.priceFrom(snap, { side, market: 'SPREAD', line: sp });
    let cls = 'team'; let badge = ''; let badge2 = ''; let who = '';
    const mk = (p) => (p.market === 'ML' ? 'ML' : signed(p.line));
    const icon = (p) => { const r = Core.settlePick(p, g).result; return r === 'win' ? '✅' : r === 'loss' ? '❌' : '➖'; };
    let res = '';
    if (view.multi) {
      // 每位用主帳那張（有表單用表單，沒表單用 LOTTO）；一人照單選配色，兩人以上：同盤口金、同隊不同盤口紫、有人押對面＝紅
      const all = multiSel().map((a) => mainPick(a, g.officialId)).filter(Boolean);
      const mine = all.filter((p) => p.side === side);
      if (mine.length) {
        if (all.some((p) => p.side !== side)) cls += ' cf';
        else if (mine.length === 1) cls += mine[0].layer === 'lotto' ? ' lotonly' : mine[0].market === 'ML' ? ' ml' : ' sp';
        else cls += new Set(mine.map(mk)).size === 1 ? ' gold' : ' rel';
        const same = new Set(mine.map(mk)).size === 1;
        if (same) badge = mk(mine[0]);
        who = mine.map((p) => `${SHORT[p.analyst]}${p.layer === 'lotto' ? 'ᴸ' : ''}${same ? '' : ` ${mk(p)}`}`).join('・');
        if (g.final) res = mine.map(icon).join('');
      }
    } else {
      if (card && card.side === side) {
        cls += card.market === 'ML' ? ' ml' : ' sp';
        badge = mk(card);

          openHere = drillGamesHtml(anchor, `${x} ${st.matrix === 'same' ? '與' : '對'} ${y}${st.matrix === 'same' ? ' 同向' : ' 對立'}`, groups, st.matrix === 'same' ? `${SHORT[x]}・${SHORT[y]}` : SHORT[x], st.matrix === 'same' ? '' : SHORT[y]);

      const members = k.split('+'); const anchor = `cb:${k}`;
      return anchorRow(anchor, `<td><b>${members.map((a) => SHORT[a]).join('＋')}</b></td><td class="num">${b.games}</td><td>${ratePill(b.dirWins / b.games, b.games, minN)}</td><td>${ratePill(b.allWin / b.games, b.games, minN)}</td><td class="num">${b.opposed}</td>`, () => {
        const firsts = ann.filter((r) => r.analyst === members[0] && [r.analyst, ...r.ctx.partners].sort((a, c) => ANALYSTS.indexOf(a) - ANALYSTS.indexOf(c)).join('+') === k);
        return drillGamesHtml(anchor, `組合 ${k}`, firsts.map((r) => ({ id: r.officialId, left: ann.filter((z) => z.officialId === r.officialId && z.side === r.side), right: [], note: `對面 ${r.ctx.oppCount} 人` })), members.map((a) => SHORT[a]).join('＋'), '對面人數');

  // 觀察名單：各人自己的戰績（主帳／改版另計／LOTTO 另計）＋出勤（比賽日 vs 有發推薦的日子）
  let SEASON_DAYS = null; let seasonLoading = false;   // 整季每天場數（NHL：data/nhl_games.json；其他聯盟用手上的賽程）
  async function loadSeasonDays() {
    if (SEASON_DAYS || seasonLoading) return;
    seasonLoading = true;
    const nhl = await fetchJson('data/nhl_games.json');
    const days = { NHL: {}, MLB: {}, NBA: {} };
    for (const g of (nhl && nhl.games) || []) (days.NHL[g.date] || (days.NHL[g.date] = new Set())).add(g.sid);
    SEASON_DAYS = days; seasonLoading = false;
    render();
  }
  function slateSizes(league) {
    const days = {};
    const add = (date, id) => { if (date && id) (days[date] || (days[date] = new Set())).add(id); };
    for (const [date, ids] of Object.entries((SEASON_DAYS && SEASON_DAYS[league]) || {})) ids.forEach((id) => add(date, id));
    for (const g of DATA[league].games) add(g.date, g.officialId);
    for (const [id, r] of Object.entries(RESULTS)) if (r.league === league) add(r.date, id);
    return days;
  }
  function renderWatchTab(allRows) {
    if (!SEASON_DAYS) loadSeasonDays();

      html += `<div class="st-sec">${a}</div><div class="wrap-x"><table class="tbl"><tr><th>分類</th><th>戰績</th><th>命中率</th><th>球隊直勝</th><th>收盤損益／ROI（張）</th></tr>`;
      for (const [k, label, list, head] of [
        ['main', '主帳（表單＋沒表單時的 LOTTO）', mine.filter((r) => r.countsInMain), '推薦'],

        html += `<div>${days.map((d) => `<span class="wday${dates.includes(d) ? ' on' : ''}" title="${d}：當天 ${sizes[d].size} 場${dates.includes(d) ? '，有發推薦' : '，沒發'}">${d.slice(5).replace('-', '/')} ${sizes[d].size}場 ${dates.includes(d) ? '✓' : '—'}</span>`).join('')}</div>`;
      }

  /* ---------- 登錄頁最下面：「今天押什麼」（2026-11-13 取代今日對決卡） ----------
     每場一列：押哪隊＋盤口＋現價｜跟不跟主跟的人｜一句理由；點開看最多 3 條證據。
     規則在 analyst-core.js adviseGame()。歷史只用同一聯盟、到前一天為止，不混球種。
     ⚙：主跟誰、忽略誰（記在這台裝置）；忽略的人今天和歷史都拿掉。 */
  function afterLine(bw, bn, aw, an) {   // 分析頁對決卡用：賽前 bw/bn → 賽後 aw/an
    if (!an || an === bn && aw === bw) return '<div class="d-after">賽後 不變 ＝</div>';
    const diff = (aw / an) - (bn ? bw / bn : 0);
    const arrow = !bn || Math.abs(diff) < 0.0005 ? '＝' : diff > 0 ? '<b class="up">▲</b>' : '<b class="dn">▼</b>';
    return `<div class="d-after">賽後 ${pctOf(aw, an)}（${aw}／${an}）${arrow}</div>`;
  }
  const ADV_KEY = 'analyst_advice_v1';
  const adv = Object.assign({ core: 'BOOKIE', ignore: ['BANKROLL'], set: false }, readJson(ADV_KEY) || {});
  const advCore = () => (ANALYSTS.includes(adv.core) ? adv.core : 'BOOKIE');
  // 2026-11-13 使用者：「NBA 不用主跟分析師，因為幾乎所有人都是賠錢的」

    const lg = rec.byLeague[view.league];
    const short = (c) => (c && c.n ? `${c.w}/${c.n}${c.priced ? ` <b class="${c.profit >= 0 ? 'pos' : 'neg'}">${c.profit >= 0 ? '+' : ''}${Math.round(100 * c.profit / c.priced)}%</b>` : ''}` : '—');
    if (!table) return `<span class="arec" data-advrec="1" title="系統戰績（存檔判斷，自 ${rec.since.slice(5).replace('-', '/')}）">📒 ${short(lg)}</span>`;
    let h = '';
    {
      const RULE = { anomaly: '收斂異常', both: '分析師＋異常', spot: '熱門價差', lineMove: '讓分加深', analysts: '分析師' };
      const RULE_ICON = { anomaly: '⚡', both: '⚡', spot: '💰', lineMove: '📈', analysts: '👥' };
      h += `<div class="aev arec-tbl">${Object.entries(rec.byLeague).map(([k, c]) => `<div class="evl"><span class="evk">🏟</span><span>${k} ${fmt(c)}${c.skip ? ` · ⏭ ${c.skip}` : ''}</span></div>`).join('')}
        ${Object.entries(rec.byRule).map(([k, c]) => `<div class="evl"><span class="evk">${RULE_ICON[k] || '•'}</span><span>${RULE[k] || k} ${fmt(c)}</span></div>`).join('')}
        ${rec.alt.ok.n || rec.alt.no.n ? `<div class="evl"><span class="evk">＋</span><span>−1.5 可加 ${fmt(rec.alt.ok)}</span></div>` : ''}
      </div>`;
    }
    return h;
  }
  function renderAdvice(games) {
    if (!games.some((g) => ANALYSTS.some((a) => mainPick(a, g.officialId)))) return '';
    const core = advCore();
    const ign = (adv.ignore || []).filter((a) => a !== core);
    const head = `<div class="ahead" id="advTop"><span class="st-sec" style="margin:0">🎯 今天押什麼</span>${oddsAge(view.league)}${renderAdviceRecord()}<button class="hbtn${adv.set ? ' on' : ''}" data-advset="1" title="主跟${leagueCore(view.league) ? ` ${core}` : '：NBA 不設'}${ign.length ? `｜忽略 ${ign.join('、')}` : ''}">⚙</button></div>${advRecOpen ? renderAdviceRecord(true) : ''}`;
    if (view.league === 'NBA' && games.every((g) => g.startMs < Date.parse('2026-10-20T04:00:00Z'))) {
      return `<div class="today">${head}<div class="st-help">⏸ 季前賽</div></div>`;
    }
    const L = adviceIndex(view.league, view.date);
    if (!L) return `<div class="today">${head}${renderAdviceSettings()}<div class="st-help">${histLoading ? '載入歷史中…' : '歷史紀錄載入失敗'}</div></div>`;
    const rows = games.map((g) => adviceRow(g, L)).filter(Boolean);
    // 只用同聯盟、到前一天為止的歷史；數字＝過盤率、顏色＝收盤報酬（綠賺紅賠）；點一列看證據
    let html = `<div class="today">${head}${renderAdviceSettings()}`;
    for (const t of ['bet', 'skip']) {
      const list = rows.filter((r) => r.tier === t).sort((a, b) => a.time - b.time);
      if (!list.length) continue;
      html += `<div class="asec ${t}">${TIER[t][0]} ${TIER[t][1]} <small>${list.length}</small></div>${list.map((r) => r.html).join('')}`;
    }
    return `${html}</div>`;
  }

  function render() {
    const stats = view.mode === 'stats';
    $('tabs').style.display = stats ? 'none' : '';
    $('dates').style.display = stats ? 'none' : '';
    $('retroBtn').style.display = stats ? 'none' : '';
    $('modeBtn').innerHTML = stats ? '✏️<span class="t"> 登錄</span>' : '📊<span class="t"> 分析</span>';
    $('jumpBtn').style.display = stats ? 'none' : '';
    if (stats) { renderStats(); return; }
    renderTabs(); renderDates(); renderRail(); renderList(); renderSummary();
    $('retroBtn').classList.toggle('on', view.retro);
  }

  /* ---------- 事件 ---------- */
  function gameById(id) { return gamesFor(view.league, view.date).find((g) => g.officialId === id); }
  // 手機長按只走計時器：觸控中收到的 contextmenu（Android 長按）一律忽略，放開後補發的 click 也擋掉；
  // 滑鼠右鍵不去重，快速連按兩下右鍵＝LOTTO 讓分。
  let touchActive = false; let suppressClick = { t: 0, key: '' }; let pressTimer = null;
  const btnKey = (btn) => `${btn.dataset.g}|${btn.dataset.s}`;
  function doLotto(btn, viaTouch) {
    if (viaTouch) suppressClick = { t: Date.now(), key: btnKey(btn) };
    if (view.multi) { toast('複選檢視中：點隊伍不會登錄，關掉「☑ 複選」才能登錄'); return; }
    const g = gameById(btn.dataset.g); if (!g) return;
    cycle(g, 'lotto', btn.dataset.s); render();
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-a],[data-d],[data-l],.team,[data-pen],[data-sl],[data-st],[data-anchor],[data-adv],[data-advrec],[data-advrules],[data-advset],[data-advcore],[data-advign],[data-sel],[data-opp],[data-multi],[data-rev]');
    if (!t) return;
    if (t.dataset.sl) { view.st.league = t.dataset.sl; drill = null; saveView(); render(); return; }
    if (t.dataset.st) { view.st[t.dataset.st] = t.dataset.v; if (t.dataset.st !== 'matrix') drill = null; saveView(); render(); return; }
    if (t.dataset.adv) { const id = t.dataset.adv; if (advOpen.has(id)) advOpen.delete(id); else advOpen.add(id); const keep = $('list').scrollTop; render(); $('list').scrollTop = keep; return; }
    if (t.dataset.advrules) { advRules = !advRules; const keep = $('list').scrollTop; render(); $('list').scrollTop = keep; return; }
    if (t.dataset.advrec) { advRecOpen = !advRecOpen; const keep = $('list').scrollTop; render(); $('list').scrollTop = keep; return; }
    if (t.dataset.advset) { adv.set = !adv.set; saveAdv(); const keep = $('list').scrollTop; render(); $('list').scrollTop = keep; return; }
    if (t.dataset.advcore) { adv.core = t.dataset.advcore; adv.ignore = (adv.ignore || []).filter((a) => a !== adv.core); saveAdv(); const keep = $('list').scrollTop; render(); $('list').scrollTop = keep; return; }
    if (t.dataset.advign) { const set = new Set(adv.ignore || []); if (set.has(t.dataset.advign)) set.delete(t.dataset.advign); else set.add(t.dataset.advign); adv.ignore = ANALYSTS.filter((a) => set.has(a)); saveAdv(); const keep = $('list').scrollTop; render(); $('list').scrollTop = keep; return; }
    if (t.dataset.rev) { view.rev = !view.rev; saveView(); render(); toast(view.rev ? '✎ 改版模式：左鍵記成「改版另計」' : '改版模式已關閉，左鍵回到表單'); return; }
    if (t.dataset.multi) { view.multi = !view.multi; if (view.multi && !multiSel().length) view.multiSel = [view.analyst]; saveView(); render(); return; }
    if (t.dataset.sel) { const sel = new Set(view.st.sel || []); if (sel.has(t.dataset.sel)) sel.delete(t.dataset.sel); else sel.add(t.dataset.sel); view.st.sel = ANALYSTS.filter((a) => sel.has(a)); drill = null; saveView(); render(); return; }
    if (t.dataset.opp) { const o = new Set(view.st.opp || []); if (o.has(t.dataset.opp)) o.delete(t.dataset.opp); else o.add(t.dataset.opp); view.st.opp = ANALYSTS.filter((a) => o.has(a)); drill = null; saveView(); render(); return; }
    if (t.dataset.anchor) { drill = drill && drill.anchor === t.dataset.anchor ? null : { anchor: t.dataset.anchor }; render(); return; }
    if (t.dataset.a) {
      if (view.multi) { const sel = new Set(multiSel()); if (sel.has(t.dataset.a)) sel.delete(t.dataset.a); else sel.add(t.dataset.a); view.multiSel = ROSTER.filter((a) => sel.has(a)); }
      else view.analyst = t.dataset.a;
      saveView(); render(); return;
    }
    if (t.dataset.d) { view.date = t.dataset.d; saveView(); render(); return; }
    if (t.dataset.l) { view.league = t.dataset.l; saveView(); render(); return; }
    if (view.multi && (t.dataset.pen || t.classList.contains('team'))) { toast('複選檢視中：點隊伍不會登錄，關掉「☑ 複選」才能登錄'); return; }
    if (t.dataset.pen) { const g = gameById(t.dataset.pen); if (g) editLine(g); return; }
    if (t.classList.contains('team')) {
      if (suppressClick.key === btnKey(t) && Date.now() - suppressClick.t < 800) return;   // 長按放開的補發 click
      const g = gameById(t.dataset.g); if (!g) return;
      cycle(g, revMode() ? 'rev' : 'card', t.dataset.s); render();
    }
  });
  document.addEventListener('contextmenu', (e) => {
    const t = e.target.closest('.team'); if (!t) return;
    e.preventDefault();
    if (touchActive) return;
    doLotto(t, false);
  });
  document.addEventListener('touchstart', (e) => {
    const t = e.target.closest('.team'); if (!t) return;
    touchActive = true;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => doLotto(t, true), 500);
  }, { passive: true });
  for (const ev of ['touchend', 'touchmove', 'touchcancel']) {
    document.addEventListener(ev, () => { clearTimeout(pressTimer); setTimeout(() => { touchActive = false; }, 50); }, { passive: true });
  }
  document.addEventListener('change', (e) => {
    if (e.target.id === 'copySel' && e.target.value) { const src = e.target.value; e.target.value = ''; copyFrom(src); }
    if (e.target.id === 'minIn') { view.st.min = Math.max(0, Math.round(Number(e.target.value) || 0)); saveView(); render(); }
    if (e.target.id === 'fromIn' || e.target.id === 'toIn') { view.st[e.target.id === 'fromIn' ? 'from' : 'to'] = e.target.value; drill = null; saveView(); render(); }
  });
  $('modeBtn').onclick = () => { view.mode = view.mode === 'stats' ? 'entry' : 'stats'; drill = null; saveView(); render(); };
  $('retroBtn').onclick = () => { view.retro = !view.retro; saveView(); render(); toast(view.retro ? '回溯模式：新登錄標「回溯」' : '回溯模式已關閉'); };
  $('syncBtn').onclick = () => syncNow();
  // 🎯 跳到今天押什麼（清單在 #list 裡捲動；再按一次回到最上面）
  $('jumpBtn').onclick = () => {
    const box = $('list'); const top = $('advTop');
    if (!top) { toast('這天沒有推薦'); return; }
    const y = top.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 6;
    const target = Math.abs(box.scrollTop - y) < 40 ? 0 : y;
    const start = box.scrollTop;
    box.scrollTo({ top: target, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    setTimeout(() => { if (Math.abs(box.scrollTop - start) < 2 && Math.abs(target - start) > 2) box.scrollTop = target; }, 700);   // 平滑捲動沒動（背景分頁等）就直接跳
  };
  $('patBtn').onclick = () => {
    const t = window.prompt('貼上 GitHub 權杖（fine-grained PAT，只需本 repo 的 Contents 讀寫；與盤面同步共用，只存在這台裝置）。留空＝不變更：');
    if (t && t.trim()) { try { localStorage.setItem(PAT_KEY, t.trim()); } catch (e) {} toast('權杖已更新'); syncNow(); }
  };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && timer) { clearTimeout(timer); syncNow(); } });

  /* ---------- 啟動 ---------- */
  async function boot() {
    render();
    readNhlDoc(); readNbaDoc();
    const loaded = await Promise.all(LEAGUES.flatMap((lg) => [fetchJson(SRC[lg].pregame), fetchJson(SRC[lg].stake)]).concat([fetchJson('data/analyst_results.json'), fetchJson(SRC.NHL.b365)]));
    LEAGUES.forEach((lg, i) => { DATA[lg].games = normalizeGames(lg, loaded[i * 2]); DATA[lg].stake = loaded[i * 2 + 1]; });
    RESULTS = (loaded[LEAGUES.length * 2] && loaded[LEAGUES.length * 2].games) || {};
    DATA.NHL.b365 = loaded[LEAGUES.length * 2 + 1];
    RESULTS_VER++;
    render();
    syncNow();
    loadHistory();
  }
  // 每 5 分鐘（與切回這個分頁時）重讀賽程、Stake 與結算檔：開著不關也看得到新結算
  let refreshing = false;
  async function refreshData() {
    if (refreshing) return;
    refreshing = true;
    try {
      readNhlDoc(); readNbaDoc();
      const loaded = await Promise.all(LEAGUES.flatMap((lg) => [fetchJson(SRC[lg].pregame), fetchJson(SRC[lg].stake)]).concat([fetchJson('data/analyst_results.json'), fetchJson(SRC.NHL.b365)]));
      if (loaded[LEAGUES.length * 2 + 1]) DATA.NHL.b365 = loaded[LEAGUES.length * 2 + 1];
      LEAGUES.forEach((lg, i) => { if (loaded[i * 2]) DATA[lg].games = normalizeGames(lg, loaded[i * 2]); if (loaded[i * 2 + 1]) DATA[lg].stake = loaded[i * 2 + 1]; });
      const res = loaded[LEAGUES.length * 2];
      if (res && res.games && JSON.stringify(res.games) !== JSON.stringify(RESULTS)) { RESULTS = res.games; RESULTS_VER++; }
      const box = $('list'); const keep = box.scrollTop;
      render();
      box.scrollTop = keep;
    } finally { refreshing = false; }
  }
  setInterval(refreshData, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshData(); });
  boot();
})();
</script>
</body>
</html>
