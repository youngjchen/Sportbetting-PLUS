<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分析師推薦</title>
<!-- 分析師推薦登錄頁（計畫：docs/plans/2026-10-14-analyst-picks-page.md）
     上方橫排五位分析師、左側豎排聯盟；每場兩顆隊伍鈕：
       左鍵＝表單層：ML → 讓分 → 取消；右鍵／長按＝LOTTO 層：同樣循環。
     推薦只存 state/analyst_picks.json（本頁唯一寫手，沿用 github-sync 的權杖 gh_sync_pat）；
     不讀寫盤面 doc（sportbetting_plus_doc_v2），異常統計／七類零接觸。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0f14; --panel:#151a22; --panel-2:#1b222c; --line:#2a3340;
    --ink:#e9eef5; --ink-dim:#97a3b3; --lit:#ffb02e;
    --ml:#2f6fb5; --ml-bg:rgba(47,111,181,.28); --sp:#2f9b6a; --sp-bg:rgba(47,155,106,.28);
    --lotto:#ffb02e; --win:#3ecf7a; --loss:#ff5b6e; --conflict:#ff3b5c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;font-size:16px}
  header,.tabs,.datebar{flex:0 0 auto}   /* 有 overflow 的列在 flex 欄裡會被壓扁蓋到下一列 */
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .logo{font-size:20px;font-weight:700;margin-right:6px}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:14.5px;font-weight:700;color:var(--ink-dim);text-decoration:none;white-space:nowrap}
  .hbtn{padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .hbtn.on{border-color:var(--lit);color:var(--lit)}
  #sync{margin-left:auto;color:var(--ink-dim);font-size:13.5px;white-space:nowrap}
  #sync.err{color:var(--loss)}
  .tabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);overflow-x:auto;align-items:center}
  .tab{min-width:104px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink-dim);font-size:15.5px;font-weight:700;cursor:pointer;text-align:center;white-space:nowrap}
  .tab.on{color:#151006;background:var(--lit);border-color:var(--lit)}
  .tab small{font-weight:500;opacity:.8;margin-left:4px;font-size:13px}
  select.hbtn{appearance:auto}
  .datebar{display:flex;gap:6px;padding:7px 14px;border-bottom:1px solid var(--line);overflow-x:auto;align-items:center}
  .dbtn{padding:5px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .dbtn.on{background:var(--ink);color:var(--bg)}
  .body{flex:1 1 auto;display:flex;min-height:0}
  nav.rail{flex:0 0 82px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:var(--panel)}
  .lg{padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink-dim);font-size:15.5px;font-weight:700;cursor:pointer;text-align:center;line-height:1.3}
  .lg.on{color:var(--ink);border-color:var(--lit)}
  .lg small{display:block;font-weight:500;font-size:12.5px}
  main{flex:1 1 auto;overflow:auto;padding:10px 14px 28px}
  .legend{color:var(--ink-dim);font-size:13.5px;padding:2px 2px 8px}
  .game{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) minmax(220px,0.95fr);gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
  .gtime{color:var(--ink-dim);font-size:13.5px;text-align:center;line-height:1.4}
  .gtime b{display:block;color:var(--ink);font-size:15.5px}
  .team{position:relative;height:68px;padding:7px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);text-align:left;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;font-family:inherit}
  .team .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team.hasb .nm{padding-right:54px}
  .team .od{color:var(--ink-dim);font-size:13.5px;margin-top:4px;white-space:nowrap}
  .team.ml{background:var(--ml-bg);border-color:var(--ml)}
  .team.sp{background:var(--sp-bg);border-color:var(--sp)}
  .team.lot{outline:2px dashed var(--lotto);outline-offset:-5px}
  .badge{position:absolute;top:6px;right:7px;font-size:12.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.35)}
  .badge2{position:absolute;bottom:6px;right:7px;font-size:12.5px;font-weight:700;color:var(--lotto)}
  .res{font-size:14px;margin-left:5px}
  .info{font-size:13.5px;color:var(--ink-dim);line-height:1.55;min-width:0}
  .info .who span{display:inline-block;padding:0 6px;margin:1px 3px 1px 0;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink)}
  .info .who span.l{border-style:dashed;border-color:var(--lotto)}
  .info .tag{font-weight:700;color:var(--ink);font-size:14px}
  .info .tag.c{color:var(--conflict)}
  .info .hist{margin-top:4px;color:var(--ink);font-size:13.5px;line-height:1.6}
  .info .hist .h-dim{color:var(--ink-dim)}
  .pen{border:none;background:none;color:var(--ink-dim);cursor:pointer;font-size:15px;padding:0 3px}
  .empty{color:var(--ink-dim);text-align:center;padding:40px 10px;line-height:2}
  footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);padding:8px 14px;font-size:14px;color:var(--ink-dim);display:flex;gap:16px;flex-wrap:wrap}
  footer b{color:var(--ink)}
  /* 命中率色階：45% 以下灰 → 80% 以上金（rateStyle()），樣本不足淡化 */
  .rate{display:inline-block;min-width:58px;padding:1px 7px;border-radius:6px;font-weight:700;text-align:center}
  .rate.few{opacity:.45}
  /* ---------- 分析頁 ---------- */
  .st-sec{margin:18px 0 6px;font-weight:700;font-size:18px}
  .st-help{color:var(--ink-dim);font-size:13.5px;margin:0 0 8px;line-height:1.65}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
  .chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--ink-dim);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip.on{color:#151006;background:var(--lit);border-color:var(--lit)}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .filters label{color:var(--ink-dim);font-size:13.5px}
  .filters input{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:14px}
  .tbl{width:100%;border-collapse:collapse;font-size:16px}
  .tbl th{color:var(--ink-dim);font-weight:500;font-size:13.5px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td.num{font-size:17px;font-weight:700}
  .tbl tr[data-drill]{cursor:pointer}
  .tbl tr[data-drill]:hover td{background:var(--panel-2)}
  .tbl tr.open td{background:var(--panel-2)}
  .tbl .thin td{opacity:.5}
  .tbl tr.drill-row td{padding:0 0 8px;background:transparent;white-space:normal;text-align:left}
  .pos{color:var(--win)} .neg{color:var(--loss)}
  .mx{display:grid;grid-template-columns:78px repeat(5,minmax(0,1fr));gap:5px;font-size:13.5px}
  .mx > div{padding:8px 2px;text-align:center;border-radius:7px;line-height:1.35}
  .mx .h{color:var(--ink-dim);font-weight:700}
  .mx .cell b{display:block;font-size:17px}
  .mx [data-drill]{cursor:pointer}
  .mx .drill{grid-column:1 / -1;text-align:left;padding:8px 10px}
  .mx-legend{display:flex;align-items:center;gap:8px;color:var(--ink-dim);font-size:13px;margin:6px 0}
  .mx-legend .bar{width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgb(84,92,106),rgb(214,168,40))}
  .drill{border:1px solid var(--lit);border-radius:10px;padding:8px 10px;margin:4px 0 2px;background:var(--panel)}
  .drill .dh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px;font-size:15px}
  .drill .dr{display:grid;grid-template-columns:96px minmax(0,1.3fr) minmax(0,1fr) 34px minmax(0,1.2fr) 118px;gap:8px;font-size:14px;padding:5px 0;border-top:1px solid var(--line);align-items:center}
  .drill .dr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap-x{overflow-x:auto}
  /* ---------- 登錄頁底部：今日組合 vs 歷史 ---------- */
  .today{margin-top:22px;padding-top:6px;border-top:2px solid var(--line)}
  .tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px}
  .tcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px}
  .tc-head{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tc-head b{font-size:17px}
  .tc-head .tag{font-weight:700;font-size:15px}
  .tc-head .tag.c{color:var(--conflict)}
  .tc-sides{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:14px}
  .tc-lab{color:var(--ink-dim);display:inline-block;min-width:96px}
  .tchip{padding:4px 11px;margin:2px 5px 2px 0;border:1px solid var(--lit);border-radius:8px;background:rgba(255,176,46,.12);color:var(--ink);font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit}
  .tchip.off{border-color:var(--line);background:transparent;color:var(--ink-dim);text-decoration:line-through}
  .bars{display:flex;flex-direction:column;gap:8px}
  .bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:14.5px}
  .bar-row .bl{line-height:1.35}
  .bar-row .bt{height:26px;background:var(--panel-2);border-radius:6px;overflow:hidden}
  .bar-row .bf{display:flex;align-items:center;justify-content:flex-end;height:100%;padding-right:7px;font-weight:700;font-size:14px;border-radius:6px;white-space:nowrap}
  .bar-row .bn{color:var(--ink-dim);font-size:13.5px;text-align:right}
  .bar-row.few{opacity:.5}
  .h-dim{color:var(--ink-dim)}
  @media (max-width:720px){
    .tcards{grid-template-columns:1fr}
    .bar-row{grid-template-columns:minmax(0,1fr) 84px;grid-template-areas:"l l" "t n";gap:3px 8px}
    .bar-row .bl{grid-area:l;white-space:normal}.bar-row .bt{grid-area:t}.bar-row .bn{grid-area:n}
  }
  #toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--lit);color:var(--ink);padding:8px 15px;border-radius:10px;font-size:14.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  #toast.show{opacity:1}
  @media (max-width:720px){
    body{font-size:15px}
    header{padding:7px 10px;gap:6px}
    .logo{font-size:17px}
    .pill .t{display:none}
    .pill{padding:4px 9px}
    #sync{flex-basis:100%;text-align:right;font-size:12.5px}
    nav.rail{flex-basis:60px}
    .lg{font-size:14px}
    .game{grid-template-columns:46px minmax(0,1fr) minmax(0,1fr);grid-template-areas:"t a h" "i i i"}
    .gtime{grid-area:t}.game .info{grid-area:i;padding-left:56px}
    .tabs{flex-wrap:wrap;padding:7px 10px}
    .tab{flex:1 1 0;min-width:0;padding:8px 2px;font-size:13px}
    .tab small{display:block;margin:0}
    #copySel{flex-basis:100%}
    .team{padding:6px 8px;height:64px}
    .team .nm{font-size:15.5px}
    .team .od{font-size:12.5px}
    .team.hasb .nm{padding-right:46px}
    .badge{font-size:11px;padding:1px 4px}
    .tbl{font-size:14.5px}
    .tbl td.num{font-size:15.5px}
    .tbl td,.tbl th{padding:6px 5px}
    .rate{min-width:50px;padding:1px 4px}
    .mx{grid-template-columns:50px repeat(5,minmax(0,1fr));font-size:12px;gap:3px}
    .mx .cell b{font-size:14.5px}
    .drill .dr{grid-template-columns:78px minmax(0,1fr) minmax(0,1fr) 28px;font-size:13px}
    .drill .dr .x{display:none}
  }
</style>
</head>
<body>
<header>
  <span class="logo">🎯 分析師推薦</span>
  <a class="pill" href="index.html" title="棒球排盤板">⚾<span class="t"> 棒球</span></a>
  <a class="pill" href="nba.html" title="籃球排盤板">🏀<span class="t"> 籃球</span></a>
  <a class="pill" href="nhl.html" title="冰球排盤板">🏒<span class="t"> 冰球</span></a>
  <button class="hbtn" id="modeBtn" title="切換登錄／分析">📊 分析</button>
  <button class="hbtn" id="retroBtn" title="補登過去的推薦：不提示開賽，狀態標「回溯」">回溯模式</button>
  <button class="hbtn" id="patBtn" title="設定 GitHub 權杖（與盤面同步共用）">🔑</button>
  <button class="hbtn" id="syncBtn" title="立即與 GitHub 同步">↻</button>
  <span id="sync">載入中…</span>
</header>
<div class="tabs" id="tabs"></div>
<div class="datebar" id="dates"></div>
<div class="body">
  <nav class="rail" id="rail"></nav>
  <main id="list"></main>
</div>
<footer id="summary"></footer>
<div id="toast"></div>

<script src="./analyst-core.js?v=20261015c"></script>
<script src="./nhl_stake_core.js?v=20261004total2"></script>
<script>
(function () {
  'use strict';
  const Core = window.AnalystCore;
  const ANALYSTS = Core.ANALYSTS;
  const SHORT = { APE: 'APE', BOOKIE: 'BOO', BANKROLL: 'BAN', SNIPER: 'SNI', MONEY: 'MON' };
  const LEAGUES = ['NHL', 'MLB', 'NBA'];
  const REPO = 'youngjchen/Sportbetting-PLUS';
  const RAW = `https://raw.githubusercontent.com/${REPO}/main/`;
  const PICKS_PATH = 'state/analyst_picks.json';
  const API = `https://api.github.com/repos/${REPO}/contents/${PICKS_PATH}`;
  const LOCAL_KEY = 'analyst_picks_v1';
  const VIEW_KEY = 'analyst_picks_view_v1';
  const PAT_KEY = 'gh_sync_pat';   // 與 github-sync.js 共用
  const SRC = {
    NHL: { pregame: 'data/nhl_pregame.json', stake: 'data/stake_api_odds.json' },
    MLB: { pregame: 'data/pregame_data.json', stake: 'data/baseball_stake_odds.json' },
    NBA: { pregame: 'data/nba_pregame.json', stake: 'data/nba_stake_odds.json' },
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const fmtOdds = (v) => (v == null ? '—' : Number(v).toFixed(2));
  const signed = (n) => (n > 0 ? `+${n}` : `${n}`);
  function twToday() { return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); }
  function nowIso() { return new Date().toISOString(); }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

  /* ---------- 狀態 ---------- */
  const view = Object.assign({ analyst: 'APE', league: 'NHL', date: twToday(), retro: false, mode: 'entry' }, readJson(VIEW_KEY) || {});
  view.st = Object.assign({ league: 'ALL', range: 'all', from: '', to: '', phase: 'default', scenario: 'all', matrix: 'same', min: 20, sel: [] }, view.st || {});
  const DATA = { NHL: { games: [], stake: null }, MLB: { games: [], stake: null }, NBA: { games: [], stake: null } };
  let RESULTS = {};   // data/analyst_results.json（analyst-settle 工作流寫）：官方核對後的比分、賽季階段、Stake 收盤價
  let picks = (readJson(LOCAL_KEY) || {}).picks || [];

  function readJson(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
  function saveView() { try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch (e) {} }
  function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ version: 1, savedAt: nowIso(), picks })); } catch (e) { toast('本機儲存失敗：' + e.message); } }

  /* ---------- 資料載入：raw GitHub（最新）→ 本站 data/ 後備 ---------- */
  async function fetchJson(rel) {
    // 本機預覽（localhost）先讀工作目錄的檔案，方便驗證還沒推送的資料；線上一律先讀 raw GitHub（最新）
    const urls = [`${RAW}${rel}?t=${Date.now()}`, `./${rel}?t=${Date.now()}`];
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) urls.reverse();
    for (const url of urls) {
      try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {}
    }
    return null;
  }
  function startMs(g) { return Date.parse(`${g.date}T${String(g.time || '00:00').padStart(5, '0')}:00+08:00`); }
  function normalizeGames(league, feed) {
    const list = Array.isArray(feed) ? feed : (feed && feed.games) || [];
    return list.filter((g) => !g.league || g.league === league).map((g) => {
      const away = g.away || g.awayTeam; const home = g.home || g.homeTeam;
      const out = { league, officialId: g.officialId, date: g.date, time: g.time, away, home,
        awayScore: g.awayScore, homeScore: g.homeScore, final: g.status === 'finished', status: g.status };
      out.startMs = startMs(out);
      return out;
    }).filter((g) => g.officialId && g.away && g.home);
  }
  // 各聯盟 Stake → core.priceFrom 用的 {ml:{away,home}, spread:{line,favorite,away,home}}
  function stakeSnapshot(league, g) {
    const feed = DATA[league].stake;
    if (!feed) return null;
    if (league === 'NHL') {
      const hit = window.NhlStake && window.NhlStake.findStakeGame(feed, { date: g.date, time: g.time, away: g.away, home: g.home });
      if (!hit) return null;
      return { ml: hit.ml && { away: hit.ml.away, home: hit.ml.home },
        spread: hit.hd && { line: hit.hd.line, favorite: hit.hd.favorite, away: hit.hd.away, home: hit.hd.home } };
    }
    if (league === 'MLB') {
      const m = feed.matches && feed.matches[g.officialId];
      if (!m) return null;
      return { ml: m.moneyline, spread: m.handicapOdds && { line: m.canonicalLine, favorite: m.favorite, away: m.handicapOdds.away, home: m.handicapOdds.home } };
    }
    const list = Array.isArray(feed.matches) ? feed.matches : Object.values(feed.matches || {});
    const m = list.filter((x) => x.away === g.away && x.home === g.home && Math.abs(Date.parse(x.scheduledStart) - g.startMs) < 12 * 3600e3)
      .sort((a, b) => Math.abs(Date.parse(a.scheduledStart) - g.startMs) - Math.abs(Date.parse(b.scheduledStart) - g.startMs))[0];
    if (!m) return null;
    return { ml: m.moneyline, spread: m.handicapOdds && m.line != null && { line: m.line, favorite: m.favorite, away: m.handicapOdds.away, home: m.handicapOdds.home } };
  }
  // 第 2 下的讓分線：NHL／MLB 固定 +1.5；NBA 用當下 Stake 該隊的線
  function defaultSpreadLine(league, snap, side) {
    if (league !== 'NBA') return 1.5;
    const s = snap && snap.spread;
    if (!s || s.line == null) return null;
    return s.favorite === side ? -Number(s.line) : Number(s.line);
  }

  /* ---------- 推薦操作 ---------- */
  function findPick(analyst, officialId, layer) {
    return picks.find((p) => p.analyst === analyst && p.officialId === officialId && p.layer === layer && !p.deleted);
  }
  function upsert(fields) {
    const key = Core.pickKey(fields);
    const i = picks.findIndex((p) => Core.pickKey(p) === key);
    const next = Object.assign({}, i >= 0 ? picks[i] : {}, fields, { updatedAt: nowIso() });
    if (i >= 0) picks[i] = next; else picks.push(next);

    scheduleUpload();

  function statusFor(g) {
    if (view.retro) return '回溯';

  function setPick(g, layer, side, market, line) {
    const snap = stakeSnapshot(g.league, g);
    const base = { analyst: view.analyst, officialId: g.officialId, layer, league: g.league, date: g.date, time: g.time,
      away: g.away, home: g.home, deleted: false };
    if (!side) { upsert(Object.assign(base, { deleted: true })); return; }
    const pick = Object.assign(base, { side, team: side === 'away' ? g.away : g.home, market, line: market === 'ML' ? 0 : line,
      enteredAt: nowIso(), status: statusFor(g) });
    pick.entryOdds = Core.priceFrom(snap, pick);

  function cycle(g, layer, side) {
    const cur = findPick(view.analyst, g.officialId, layer);

    if (cur.market === 'ML') {
      let line = defaultSpreadLine(g.league, stakeSnapshot(g.league, g), side);
      if (line == null) {
        const v = window.prompt(`Stake 沒有這場的讓分線，請輸入 ${side === 'away' ? g.away : g.home} 的讓分（例：+6.5 或 -4.5）`);
        if (v == null || !Number.isFinite(Number(v))) return;

  function editLine(g) {

    if (!p) { toast('先在隊伍上點兩下選讓分，再改線'); return; }
    const v = window.prompt(`改 ${view.analyst} 的讓分線（${p.team}，目前 ${signed(p.line)}）`, signed(p.line));

  function copyFrom(src) {

  /* ---------- GitHub 同步（本頁唯一寫 state/analyst_picks.json） ---------- */
  function getPAT() { try { return localStorage.getItem(PAT_KEY) || ''; } catch (e) { return ''; } }
  function b64ToUtf8(b64) { const bin = atob(b64.replace(/\n/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function utf8ToB64(str) { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
  const ORDER = (p) => [p.date, p.league, p.time || '', p.officialId, ANALYSTS.indexOf(p.analyst), p.layer].join('|');
  function serialize(list) {
    const sorted = list.slice().sort((a, b) => (ORDER(a) < ORDER(b) ? -1 : ORDER(a) > ORDER(b) ? 1 : 0));
    return `{"version":1,"updatedAt":"${nowIso()}","picks":[\n${sorted.map((p) => JSON.stringify(p)).join(',\n')}\n]}\n`;
  }
  async function remoteGet() {
    const pat = getPAT();
    const headers = { Accept: 'application/vnd.github+json' };
    if (pat) headers.Authorization = `Bearer ${pat}`;
    const r = await fetch(`${API}?ref=main&t=${Date.now()}`, { headers, cache: 'no-store' });
    if (r.status === 404) return { sha: null, picks: [] };
    if (!r.ok) {
      if (!pat) { const raw = await fetchJson(PICKS_PATH); return { sha: null, picks: (raw && raw.picks) || [], readOnly: true }; }
      throw new Error(`讀取失敗 HTTP ${r.status}`);
    }
    const meta = await r.json();
    const doc = JSON.parse(b64ToUtf8(meta.content || ''));
    return { sha: meta.sha, picks: doc.picks || [] };
  }
  async function remotePut(list, sha) {
    const body = { message: `analyst picks ${view.date} ${view.league}`, content: utf8ToB64(serialize(list)), branch: 'main' };
    if (sha) body.sha = sha;
    const r = await fetch(API, { method: 'PUT', headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${getPAT()}` }, body: JSON.stringify(body) });
    if (!r.ok) { const e = new Error(`上傳失敗 HTTP ${r.status}`); e.status = r.status; throw e; }
  }
  const same = (a, b) => JSON.stringify(a.map(ORDER_FULL).sort()) === JSON.stringify(b.map(ORDER_FULL).sort());
  function ORDER_FULL(p) { return JSON.stringify(Object.keys(p).sort().reduce((o, k) => { o[k] = p[k]; return o; }, {})); }
  let syncing = false; let again = false; let timer = null;
  function setSync(text, err) { const el = $('sync'); el.textContent = text; el.classList.toggle('err', !!err); }
  function scheduleUpload() { setSync('已存本機，等待上傳…'); clearTimeout(timer); timer = setTimeout(syncNow, 3000); }
  async function syncNow() {
    if (syncing) { again = true; return; }
    syncing = true;
    try {
      for (let attempt = 1; attempt <= 3; attempt++) {
        const remote = await remoteGet();
        const merged = Core.mergePicks(remote.picks, picks);
        picks = merged; saveLocal();
        if (!getPAT() || remote.readOnly) { setSync('唯讀（未設權杖，只存在這台裝置）', !getPAT()); break; }
        if (same(merged, remote.picks)) { setSync(`已同步 ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`); break; }
        try { await remotePut(merged, remote.sha); setSync(`已上傳 ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`); break; }
        catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 3) continue; throw e; }
      }
    } catch (e) {
      setSync(`同步失敗：${e.message}（資料仍在本機）`, true);
    } finally {
      syncing = false;
      render();
      if (again) { again = false; syncNow(); }
    }
  }

  /* ---------- 畫面 ---------- */
  // 賽程檔（滾動、只留幾天）∪ 結算檔（永久）：結算檔有結論時以它為準；舊日期靠結算檔才看得到
  function gamesFor(league, date) {
    const byId = new Map();
    for (const g of DATA[league].games) if (g.date === date) byId.set(g.officialId, Object.assign({}, g));
    for (const [id, r] of Object.entries(RESULTS)) {
      if (r.league !== league || r.date !== date) continue;
      const g = byId.get(id) || { league, officialId: id, date: r.date, time: r.time, away: r.away, home: r.home, startMs: startMs(r) };
      if (r.final) Object.assign(g, { awayScore: r.awayScore, homeScore: r.homeScore, final: true });
      Object.assign(g, { closing: r.closing || null, phase: r.phase || null, review: r.review || null, officialCheck: r.officialCheck || null });
      if (r.review) g.final = false;
      byId.set(id, g);
    }
    return [...byId.values()].sort((a, b) => a.startMs - b.startMs);
  }

  function renderList() {

  /* ================= 分析頁 =================

  const SCEN = [
    ['all', '全部', '主帳每一張已結算的票。'],

  const DEFAULT_PHASES = ['regular', 'postseason', null];
  let HISTORY = null; let histLoading = false; let drill = null;   // drill = { anchor }

  function addDays(date, n) { const d = new Date(`${date}T00:00:00Z`); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

  // 命中率色階：45% 以下灰 → 80% 以上金；樣本少於門檻淡化（超過門檻就不再隨場數變色）

  function statCells(label, s, minN) {

  }
  const TH = '<tr><th>分析師</th><th>戰績</th><th>命中率</th><th>球隊直勝</th><th>收盤損益／ROI（張）</th></tr>';

  function renderStats() {
    const st = view.st;
    $('rail').innerHTML = ['ALL', ...LEAGUES].map((lg) => `<button class="lg${lg === st.league ? ' on' : ''}" data-sl="${lg}">${lg === 'ALL' ? '全部' : lg}</button>`).join('');
    if (!HISTORY) { $('list').innerHTML = '<div class="empty">載入歷史紀錄中…</div>'; loadHistory(); return; }
    const chips = (key, opts) => `<div class="chips">${opts.map(([v, t]) => `<button class="chip${String(st[key]) === v ? ' on' : ''}" data-st="${key}" data-v="${v}">${t}</button>`).join('')}</div>`;
    const rows = Core.filterRows(statsLedger(), statsFilter());
    const main = rows.filter((r) => r.countsInMain && ['win', 'loss', 'push', 'refund'].includes(r.result));
    const ann = Core.annotateContexts(rows);
    const minN = Math.max(0, Number(st.min) || 0);
    let html = `<div class="filters">
      ${chips('range', [['all', '全部日期'], ['30', '近 30 天'], ['7', '近 7 天'], ['custom', '自訂']])}
      ${st.range === 'custom' ? `<label>從 <input type="date" id="fromIn" value="${esc(st.from)}"></label><label>到 <input type="date" id="toIn" value="${esc(st.to)}"></label>` : ''}
      ${chips('phase', [['default', '例行＋季後'], ['withPre', '含季前'], ['post', '只季後'], ['pre', '只季前']])}
      <label>最少樣本 <input type="number" id="minIn" min="0" step="1" value="${minN}" style="width:60px"></label>
      </div>`;
    html += `<div class="st-help">${HISTORY.failed ? '⚠ 歷史紀錄載入失敗，只顯示 10/13 起的推薦。' : ''}資料：MLB 美國 4/1 起、NHL 9/29 起、NBA 10/13 起。損益用收盤賠率、每張 1 單位（Stake 優先，沒有才用 bet365；讓分推薦對不到盤口就不算）。命中率顏色：灰＝低、金＝高；樣本少於 ${minN} 會變淡。點任一列或格子，明細在下方展開。</div>`;
    // 1. 情境
    const sc = SCEN.find((x) => x[0] === st.scenario) || SCEN[0];
    html += `<div class="st-sec">情境命中率</div>${chips('scenario', SCEN.map((x) => [x[0], x[1]]))}<div class="st-help">${sc[2]}</div>`;
    const scRows = (a) => (sc[0] === 'all' ? main.filter((r) => r.analyst === a) : ann.filter((r) => r.analyst === a && Core.inScenario(r, sc[0])));
    html += `<div class="wrap-x"><table class="tbl">${TH}${ANALYSTS.map((a) => { const list = scRows(a); return anchorRow(`sc:${sc[0]}:${a}`, statCells(a, Core.summarize(list), minN), list, `${a}｜${sc[1]}`); }).join('')}</table></div>`;
    // 2. 兩兩矩陣（灰→金；少於門檻淡化）
    const { same, versus } = Core.pairMatrix(ann);
    html += `<div class="st-sec">兩兩組合</div>${chips('matrix', [['same', '同向時（球隊直勝率）'], ['versus', '對立時（行的人命中率）']])}`;
    html += `<div class="mx-legend"><span>低</span><span class="bar"></span><span>高</span><span>｜淡色＝少於 ${minN} 場</span></div>`;
    html += `<div class="mx"><div></div>${ANALYSTS.map((a) => `<div class="h">${SHORT[a]}</div>`).join('')}`;
    for (const x of ANALYSTS) {
      html += `<div class="h" style="text-align:left">${SHORT[x]}</div>`;
      let openHere = null;
      for (const y of ANALYSTS) {
        if (x === y) { html += '<div style="background:var(--panel)">—</div>'; continue; }
        let n = 0; let rate = null; let list = [];
        if (st.matrix === 'same') {
          const k = ANALYSTS.indexOf(x) < ANALYSTS.indexOf(y) ? `${x}+${y}` : `${y}+${x}`;
          const v = same[k]; if (v) { n = v.games; rate = v.dirWins / v.games; }
          list = ann.filter((r) => r.analyst === x && r.ctx.partners.includes(y));
        } else {
          const v = versus[`${x}>${y}`]; if (v) { n = v.games; rate = v.wins / v.games; }
          list = ann.filter((r) => r.analyst === x && r.ctx.opponents.includes(y));
        }
        if (!n) { html += '<div style="background:var(--panel);color:var(--ink-dim)">—</div>'; continue; }
        const anchor = `mx:${st.matrix}:${x}:${y}`;
        const title = `${x} ${st.matrix === 'same' ? '與' : '對'} ${y}${st.matrix === 'same' ? ' 同向' : ' 對立'}`;
        if (drill && drill.anchor === anchor) openHere = { anchor, title, list };
        html += `<div class="cell" data-anchor="${esc(anchor)}" style="${rateStyle(rate)};opacity:${n < minN ? 0.42 : 1}${drill && drill.anchor === anchor ? ';outline:2px solid var(--ink)' : ''}"><b>${Math.round(rate * 100)}%</b>${n} 場</div>`;
      }
      if (openHere) html += drillHtml(openHere.anchor, openHere.title, openHere.list);
    }
    html += '</div>';
    // 2b. 自選組合：多選 ≥2 位，只看「這幾位全都有推薦」的比賽
    const sel = (st.sel || []).filter((a) => ANALYSTS.includes(a));
    html += `<div class="st-sec">自選組合</div><div class="st-help">選兩位以上，只看這幾位「全都有推薦」的比賽：同一邊時的球隊直勝，以及互相衝突時各自的命中率。</div>`;
    html += `<div class="chips">${ANALYSTS.map((a) => `<button class="chip${sel.includes(a) ? ' on' : ''}" data-sel="${a}">${a}</button>`).join('')}</div>`;
    if (sel.length >= 2) {
      const byGame = new Map();
      for (const r of ann) {
        if (!sel.includes(r.analyst)) continue;
        if (!byGame.has(r.officialId)) byGame.set(r.officialId, []);
        byGame.get(r.officialId).push(r);
      }
      const aligned = { all: [], unopp: [], opp: [], exact: [] }; const split = [];
      for (const list of byGame.values()) {
        if (list.length !== sel.length) continue;
        if (new Set(list.map((r) => r.side)).size === 1) {
          aligned.all.push(list);
          (list[0].ctx.oppCount > 0 ? aligned.opp : aligned.unopp).push(list);
          if (list[0].ctx.ownCount === sel.length) aligned.exact.push(list);
        } else split.push(list);
      }
      const names = sel.map((a) => SHORT[a]).join('+');
      html += `<div class="wrap-x"><table class="tbl"><tr><th>${names} 同一邊</th><th>場數</th><th>球隊直勝</th><th>全員過盤</th><th>收盤損益／ROI（張）</th></tr>`;
      for (const [k, label] of [['all', '全部同向'], ['unopp', '其中沒人反對'], ['opp', '其中有人反對'], ['exact', '同邊只有這幾位']]) {
        const games = aligned[k]; const n = games.length;
        const dir = games.filter((l) => l[0].direction === 'win').length; const allw = games.filter((l) => l.every((r) => r.result === 'win')).length;
        const tickets = games.flat();
        html += anchorRow(`sel:al:${sel.join('+')}:${k}`, `<td><b>${label}</b></td><td class="num">${n}</td><td>${n ? ratePill(dir / n, n, minN) : '—'}</td><td>${n ? ratePill(allw / n, n, minN) : '—'}</td><td>${roiTxt(Core.summarize(tickets))}</td>`, tickets, `${names}｜${label}`);
      }
      html += '</table></div>';
      html += `<div class="wrap-x" style="margin-top:8px"><table class="tbl"><tr><th>${names} 互相衝突（${split.length} 場）</th><th>戰績</th><th>命中率</th><th>球隊直勝</th><th>收盤損益／ROI（張）</th></tr>`;
      for (const a of sel) {
        const l = split.map((g) => g.find((r) => r.analyst === a));
        html += anchorRow(`sel:cf:${sel.join('+')}:${a}`, statCells(a, Core.summarize(l), minN), l, `${a}｜與 ${names} 互相衝突時`);
      }
      html += '</table></div>';
    } else {
      html += '<div class="st-help">再多選一位以上。</div>';
    }
    // 3. 精確組合排行
    const board = Core.comboBoard(ann);
    const combos = Object.entries(board).filter(([k, b]) => k.includes('+') && b.games >= minN)
      .sort((a, b) => b[1].dirWins / b[1].games - a[1].dirWins / a[1].games || b[1].games - a[1].games).slice(0, 30);
    html += `<div class="st-sec">精確組合排行</div><div class="st-help">同一邊「正好是這幾位」；只列場數 ≥ ${minN}。</div><div class="wrap-x"><table class="tbl"><tr><th>組合</th><th>場數</th><th>球隊直勝</th><th>全員過盤</th><th>有人押對面</th></tr>`;
    html += combos.map(([k, b]) => {
      const members = k.split('+');
      const list = ann.filter((r) => r.analyst === members[0] && [r.analyst, ...r.ctx.partners].sort((a, c) => ANALYSTS.indexOf(a) - ANALYSTS.indexOf(c)).join('+') === k);
      return anchorRow(`cb:${k}`, `<td><b>${members.map((a) => SHORT[a]).join('+')}</b></td><td class="num">${b.games}</td><td>${ratePill(b.dirWins / b.games, b.games, minN)}</td><td>${ratePill(b.allWin / b.games, b.games, minN)}</td><td class="num">${b.opposed}</td>`, list, `組合 ${k}`);
    }).join('') || `<tr><td colspan="5" style="color:var(--ink-dim)">沒有場數 ≥ ${minN} 的組合，可把最少樣本調低。</td></tr>`;
    html += '</table></div>';
    // 4. 表單 vs LOTTO
    const settled = rows.filter((r) => r.result !== 'pending');
    html += `<div class="st-sec">表單 vs LOTTO</div><div class="st-help">表單＝左鍵層；LOTTO 另計＝同場已有表單的 LOTTO 腿（不進主帳）；串關腿計入＝當天沒表單時的 LOTTO／串關腿。10/13 起才分得出來。</div>`;
    html += '<div class="wrap-x"><table class="tbl"><tr><th>分析師｜分類</th><th>戰績</th><th>命中率</th><th>球隊直勝</th><th>收盤損益／ROI（張）</th></tr>';
    for (const a of ANALYSTS) {
      const groups = [
        ['表單', settled.filter((r) => r.analyst === a && r.layer === 'card')],
        ['LOTTO 另計', settled.filter((r) => r.analyst === a && !r.countsInMain)],
        ['串關腿計入', settled.filter((r) => r.analyst === a && r.layer === 'lotto' && r.countsInMain)],
      ].filter(([, l]) => l.length);
      html += groups.map(([t, l]) => anchorRow(`lt:${a}:${t}`, statCells(`${a}｜${t}`, Core.summarize(l), 0), l, `${a}｜${t}`)).join('');
    }
    const extra = settled.filter((r) => !r.countsInMain);
    for (const rel of ['跟表單一樣', '同隊改盤口', '反向']) {
      const l = extra.filter((r) => r.relation === rel);
      if (l.length) html += anchorRow(`lt:rel:${rel}`, statCells(`全部｜LOTTO・${rel}`, Core.summarize(l), 0), l, `LOTTO・${rel}`);
    }
    html += '</table></div>';
    const box = $('list'); const keep = box.scrollTop;
    box.innerHTML = html;
    box.scrollTop = keep;   // 原地展開，不跳回頂端
    $('summary').innerHTML = `<span>${st.league === 'ALL' ? '全部聯盟' : st.league}｜主帳已結算 <b>${Core.summarize(main).settled}</b> 張</span>`;
  }

  /* ---------- 登錄頁：今天每場的組合，對照歷史 ---------- */
  let IDX_CACHE = {};
  function leagueIndex(league) {
    if (!HISTORY) return null;
    const settledLive = Core.livePicks(picks).filter((p) => RESULTS[p.officialId] && RESULTS[p.officialId].final).length;
    const key = `${Object.keys(RESULTS).length}|${settledLive}`;
    if (IDX_CACHE[league] && IDX_CACHE[league].key === key) return IDX_CACHE[league];
    const ann = Core.annotateContexts(Core.filterRows(statsLedger(), { league, phases: DEFAULT_PHASES }));
    const val = { key, idx: Core.sideIndex(ann), lone: Core.scenarioStats(ann, 'loneDissent'), solo: {}, byCount: {} };
    for (const a of ANALYSTS) val.solo[a] = Core.summarize(ann.filter((r) => r.analyst === a && r.ctx.alignment === 'solo'));
    val.noOpp = Core.scenarioStats(ann, 'noOpposition'); val.pairs = Core.pairMatrix(ann);
    val.all = {}; for (const a of ANALYSTS) val.all[a] = Core.summarize(ann.filter((r) => r.analyst === a));
    for (const s of val.idx.sides) {
      if (s.oppKey !== '') continue;
      const n = s.key.split('+').length; const b = val.byCount[n] || (val.byCount[n] = { games: 0, dirWins: 0 });
      b.games++; if (s.dirWin) b.dirWins++;
    }
    IDX_CACHE[league] = val;
    return val;
  }
  const sideKey = (list) => list.slice().sort((a, b) => ANALYSTS.indexOf(a) - ANALYSTS.indexOf(b)).join('+');
  const shortKey = (k) => k.split('+').map((a) => SHORT[a]).join('+');
  // 長條：label｜灰→金的條（寬＝命中率）｜數字；樣本少於 10 淡化
  function barRow(label, wins, n, what) {
    if (!n) return `<div class="bar-row none"><span class="bl">${label}</span><span class="bt"></span><span class="bn">過去沒出現過</span></div>`;
    const rate = wins / n;
    return `<div class="bar-row${n < 10 ? ' few' : ''}"><span class="bl">${label}</span><span class="bt"><span class="bf" style="width:${Math.max(3, Math.round(rate * 100))}%;${rateStyle(rate)}">${(rate * 100).toFixed(1)}%</span></span><span class="bn">${what} ${wins}/${n}</span></div>`;
  }
  const EXCL = {};   // 今日卡片：暫時排除的分析師（officialId → Set），只影響卡片數據，不動推薦
  function todayCard(g, L) {
    const ex = EXCL[g.officialId] || new Set();
    const sides = { away: [], home: [] };
    for (const a of ANALYSTS) { const p = mainPick(a, g.officialId); if (p) sides[p.side].push(a); }
    if (!sides.away.length && !sides.home.length) return '';
    const chip = (a) => `<button class="tchip${ex.has(a) ? ' off' : ''}" data-ex="${esc(g.officialId)}|${a}" title="${ex.has(a) ? '加回' : '暫時排除'} ${a}">${a}</button>`;
    const A = sides.away.filter((a) => !ex.has(a)); const H = sides.home.filter((a) => !ex.has(a));
    const bars = [];
    let tag = '';
    if (A.length && H.length) {
      const [maj, min] = A.length >= H.length ? [A, H] : [H, A];
      const kMaj = sideKey(maj); const kMin = sideKey(min);
      tag = `<span class="tag c">衝突 ${maj.length}:${min.length}</span>`;
      const m = L.idx.query({ key: kMaj, oppKey: kMin });
      bars.push(barRow(`這個對局：${shortKey(kMaj)} 側（對 ${shortKey(kMin)}）`, m.dirWins, m.games, '直勝'));
      const o = L.idx.query({ key: kMaj, opposed: true });
      bars.push(barRow(`${shortKey(kMaj)} 遇到反對`, o.dirWins, o.games, '直勝'));
      if (min.length === 1 && maj.length >= 2) { const s = L.lone[min[0]]; bars.push(barRow(`${SHORT[min[0]]} 單人反對`, s.wins, s.settled, '命中')); }
      else { const q = L.idx.query({ key: kMin, opposed: true }); bars.push(barRow(`${shortKey(kMin)} 遇到反對`, q.dirWins, q.games, '直勝')); }
      const pairs = [];
      for (const x of maj) for (const y of min) pairs.push([x, y]);
      for (const [x, y] of pairs.slice(0, 6)) {
        const vx = L.pairs.versus[`${x}>${y}`]; const vy = L.pairs.versus[`${y}>${x}`];
        if (vx) bars.push(barRow(`${SHORT[x]} 對上 ${SHORT[y]}：${SHORT[x]}`, vx.wins, vx.games, '命中'));
        if (vy) bars.push(barRow(`${SHORT[x]} 對上 ${SHORT[y]}：${SHORT[y]}`, vy.wins, vy.games, '命中'));
      }
    } else if (A.length + H.length >= 2) {
      const side = A.length ? A : H; const k = sideKey(side);
      tag = `<span class="tag">同向 ${side.length}:0</span>`;
      const u = L.idx.query({ key: k, opposed: false });
      bars.push(barRow(`${shortKey(k)} 同向、無人反對`, u.dirWins, u.games, '直勝'));
      const all = L.idx.query({ key: k });
      bars.push(barRow(`${shortKey(k)} 同一邊（不論有無反對）`, all.dirWins, all.games, '直勝'));
      const c = L.byCount[side.length] || { games: 0, dirWins: 0 };
      bars.push(barRow(`任何 ${side.length} 人同向、無人反對`, c.dirWins, c.games, '直勝'));
      for (const a of side) { const s = L.noOpp[a]; bars.push(barRow(`${SHORT[a]} 在無反方同向時`, s.wins, s.settled, '命中')); }
    } else if (A.length + H.length === 1) {
      const a = A[0] || H[0]; tag = '<span class="tag">單人</span>';
      const s = L.solo[a]; bars.push(barRow(`${SHORT[a]} 單獨推薦`, s.wins, s.settled, '命中'));
      const t = L.all[a]; bars.push(barRow(`${SHORT[a]} 整體`, t.wins, t.settled, '命中'));
    } else {
      tag = '<span class="tag">已全部排除</span>';
    }
    return `<div class="tcard">
      <div class="tc-head"><b>${esc(g.time)}</b> ${esc(g.away)} @ ${esc(g.home)} ${tag}</div>
      <div class="tc-sides"><div><span class="tc-lab">客 ${esc(g.away)}</span>${sides.away.map(chip).join('') || '<span class="h-dim">—</span>'}</div><div><span class="tc-lab">主 ${esc(g.home)}</span>${sides.home.map(chip).join('') || '<span class="h-dim">—</span>'}</div></div>
      <div class="bars">${bars.join('')}</div>
    </div>`;
  }
  function renderToday(games) {
    if (!games.some((g) => ANALYSTS.some((a) => mainPick(a, g.officialId)))) return '';
    if (games[0] && games[0].league === 'NBA' && games.every((g) => g.startMs < Date.parse('2026-10-20T04:00:00Z'))) {
      return '<div class="today"><div class="st-sec">今日組合 vs 歷史</div><div class="st-help">NBA 季前賽不比對（例行賽 10/20 起才有歷史可對照）。</div></div>';
    }
    const L = leagueIndex(view.league);
    if (!L) return `<div class="today"><div class="st-sec">今日組合 vs 歷史</div><div class="st-help">${histLoading ? '載入歷史中…' : '歷史紀錄載入失敗'}</div></div>`;
    return `<div class="today"><div class="st-sec">今日組合 vs 歷史（${view.league}｜${view.date.slice(5).replace('-', '/')}）</div>
      <div class="st-help">依你目前的登錄即時計算，只看 ${view.league} 歷史（例行＋季後）。點分析師名字可暫時排除他、改看其餘人的組合（不會改到推薦）。長條寬度＝命中率，顏色灰→金；少於 10 場會變淡。</div>
      <div class="tcards">${games.map((g) => todayCard(g, L)).join('')}</div></div>`;
  }

  function render() {
    const stats = view.mode === 'stats';
    $('tabs').style.display = stats ? 'none' : '';
    $('dates').style.display = stats ? 'none' : '';
    $('retroBtn').style.display = stats ? 'none' : '';
    $('modeBtn').textContent = stats ? '✏️ 登錄' : '📊 分析';
    if (stats) { renderStats(); return; }
    renderTabs(); renderDates(); renderRail(); renderList(); renderSummary();
    $('retroBtn').classList.toggle('on', view.retro);
  }

  /* ---------- 事件 ---------- */
  function gameById(id) { return gamesFor(view.league, view.date).find((g) => g.officialId === id); }
  // 手機長按只走計時器：觸控中收到的 contextmenu（Android 長按）一律忽略，放開後補發的 click 也擋掉；
  // 滑鼠右鍵不去重，快速連按兩下右鍵＝LOTTO 讓分。
  let touchActive = false; let suppressClick = { t: 0, key: '' }; let pressTimer = null;
  const btnKey = (btn) => `${btn.dataset.g}|${btn.dataset.s}`;
  function doLotto(btn, viaTouch) {
    if (viaTouch) suppressClick = { t: Date.now(), key: btnKey(btn) };
    const g = gameById(btn.dataset.g); if (!g) return;
    cycle(g, 'lotto', btn.dataset.s); render();
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-a],[data-d],[data-l],.team,[data-pen],[data-sl],[data-st],[data-anchor],[data-ex],[data-sel]');
    if (!t) return;
    if (t.dataset.sl) { view.st.league = t.dataset.sl; drill = null; saveView(); render(); return; }
    if (t.dataset.st) { view.st[t.dataset.st] = t.dataset.v; if (t.dataset.st !== 'matrix') drill = null; saveView(); render(); return; }
    if (t.dataset.ex) { const [id, a] = t.dataset.ex.split('|'); const set = EXCL[id] || (EXCL[id] = new Set()); if (set.has(a)) set.delete(a); else set.add(a); const keep = $('list').scrollTop; render(); $('list').scrollTop = keep; return; }
    if (t.dataset.sel) { const sel = new Set(view.st.sel || []); if (sel.has(t.dataset.sel)) sel.delete(t.dataset.sel); else sel.add(t.dataset.sel); view.st.sel = ANALYSTS.filter((a) => sel.has(a)); drill = null; saveView(); render(); return; }
    if (t.dataset.anchor) { drill = drill && drill.anchor === t.dataset.anchor ? null : { anchor: t.dataset.anchor }; render(); return; }
    if (t.dataset.a) { view.analyst = t.dataset.a; saveView(); render(); return; }
    if (t.dataset.d) { view.date = t.dataset.d; saveView(); render(); return; }
    if (t.dataset.l) { view.league = t.dataset.l; saveView(); render(); return; }
    if (t.dataset.pen) { const g = gameById(t.dataset.pen); if (g) editLine(g); return; }
    if (t.classList.contains('team')) {
      if (suppressClick.key === btnKey(t) && Date.now() - suppressClick.t < 800) return;   // 長按放開的補發 click
      const g = gameById(t.dataset.g); if (!g) return;
      cycle(g, 'card', t.dataset.s); render();
    }
  });
  document.addEventListener('contextmenu', (e) => {
    const t = e.target.closest('.team'); if (!t) return;
    e.preventDefault();
    if (touchActive) return;
    doLotto(t, false);
  });
  document.addEventListener('touchstart', (e) => {
    const t = e.target.closest('.team'); if (!t) return;
    touchActive = true;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => doLotto(t, true), 500);
  }, { passive: true });
  for (const ev of ['touchend', 'touchmove', 'touchcancel']) {
    document.addEventListener(ev, () => { clearTimeout(pressTimer); setTimeout(() => { touchActive = false; }, 50); }, { passive: true });
  }
  document.addEventListener('change', (e) => {
    if (e.target.id === 'copySel' && e.target.value) { const src = e.target.value; e.target.value = ''; copyFrom(src); }
    if (e.target.id === 'minIn') { view.st.min = Math.max(0, Math.round(Number(e.target.value) || 0)); saveView(); render(); }
    if (e.target.id === 'fromIn' || e.target.id === 'toIn') { view.st[e.target.id === 'fromIn' ? 'from' : 'to'] = e.target.value; drill = null; saveView(); render(); }
  });
  $('modeBtn').onclick = () => { view.mode = view.mode === 'stats' ? 'entry' : 'stats'; drill = null; saveView(); render(); };
  $('retroBtn').onclick = () => { view.retro = !view.retro; saveView(); render(); toast(view.retro ? '回溯模式：新登錄標「回溯」' : '回溯模式已關閉'); };
  $('syncBtn').onclick = () => syncNow();
  $('patBtn').onclick = () => {
    const t = window.prompt('貼上 GitHub 權杖（fine-grained PAT，只需本 repo 的 Contents 讀寫；與盤面同步共用，只存在這台裝置）。留空＝不變更：');
    if (t && t.trim()) { try { localStorage.setItem(PAT_KEY, t.trim()); } catch (e) {} toast('權杖已更新'); syncNow(); }
  };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && timer) { clearTimeout(timer); syncNow(); } });

  /* ---------- 啟動 ---------- */
  async function boot() {
    render();
    const loaded = await Promise.all(LEAGUES.flatMap((lg) => [fetchJson(SRC[lg].pregame), fetchJson(SRC[lg].stake)]).concat([fetchJson('data/analyst_results.json')]));
    LEAGUES.forEach((lg, i) => { DATA[lg].games = normalizeGames(lg, loaded[i * 2]); DATA[lg].stake = loaded[i * 2 + 1]; });
    RESULTS = (loaded[LEAGUES.length * 2] && loaded[LEAGUES.length * 2].games) || {};
    render();
    syncNow();
    loadHistory();
  }
  boot();
})();
</script>
</body>
</html>
