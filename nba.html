<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>籃球排盤板</title>
<!-- 籃球頁（NBA＋WNBA 雙聯盟,WNBA_PLAN.md D8）。
     卡片=棒球板 bcard 1:1 移植（2026-08-03 使用者指令「排版跟所有操作都要跟棒球的一樣」）：
     CSS/欄位網格/燈號操作(左+右−長按清零/點隊名−1)/⇄換讓分方/收合刪除/賽前✓/ⓘ近況/明牌◉欄/基準輸入/衝突框色/結算pills。
     籃球差異僅：節數表在中央 VS 位（2026-07 DEMO v2 核准位）、無投手與模型%列。
     隊伍統計=doc.games 推導引擎(快取鍵帶聯盟防撞名)。localStorage sportbetting_nba_doc_v1 與棒球板隔離。-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* 棒球板同款調色盤（bcard CSS 原樣移植的前提） */
    --bg:#0c0f14; --panel:#151a22; --panel-2:#1b222c; --line:#2a3340;
    --ink:#e9eef5; --ink-dim:#8a96a6;
    --lit:#ffb02e; --lit-glow:rgba(255,176,46,.55);
    --hot:#ff7a1a; --hot-glow:rgba(255,110,20,.6);
    --conflict:#ff3b5c; --cross:#b56bff; --danger:#ff5b6e;
    --nba:#e56020; --wnba:#ff9d3c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* 棒球架構移植：整頁不捲動,只有卡片區(#board)內捲 —— 表頭與日期列永遠固定可見,
     右側導覽列/總結面板的 top 才不會在捲動後空出一大截（2026-08-03 使用者回報） */
  html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;}
  /* z-index 400：表頭建立堆疊脈絡,內含的 ⋯ 選單必須高於總結面板(150)/導覽列(140),
     否則選單會被面板蓋住（2026-08-03 使用者回報「功能列表被蓋在最下面」的根因） */
  header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;flex:0 0 auto;z-index:400;flex-wrap:wrap}
  .logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
  .logo .dot{width:12px;height:12px;border-radius:50%;background:var(--nba)}
  .swpill{display:inline-flex;align-items:center;gap:5px;margin:0 4px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-dim);text-decoration:none;white-space:nowrap}
  .lgchip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:14px;font-weight:700;cursor:pointer;color:var(--ink-dim)}
  .lgchip .lgdot{width:8px;height:8px;border-radius:50%}
  .lgchip.on{color:var(--ink);border-color:var(--lit);background:rgba(255,176,46,.08)}
  .hbtn{padding:5px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer}
  .stamp{margin-left:auto;color:var(--ink-dim);font-size:12.5px}
  .datebar{display:flex;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto;background:var(--bg);position:relative;z-index:5}
  .datebar .lab{color:var(--ink-dim);font-size:13px;margin-right:4px}
  .dbtn{padding:5px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .dbtn.on{background:var(--lit);color:#151006;border-color:var(--lit)}
  main{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 16px 60px;flex:1 1 auto;overflow:auto;min-height:0}
  /* 棒球版面幾何（index.html ≥1180 同款）：卡片靠左、右側讓給導覽列＋總結面板 */
  @media (min-width:1180px){
    main{align-items:flex-start;padding-left:clamp(16px,3vw,48px);padding-right:24px;}
  }
  .empty{max-width:640px;text-align:center;color:var(--ink-dim);font-size:14px;line-height:2;border:1px dashed var(--line);border-radius:14px;padding:26px 22px}
  .empty b{color:var(--ink)}

  /* ============ 棒球 bcard 移植（index.html 1278-1412 原樣;canvas 專屬碼移除） ============ */
  .card.bcard{
    width:100%; max-width:960px; overflow:visible;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line); border-radius:16px;
    box-shadow:0 10px 26px rgba(0,0,0,.45);
  }
  .card.bcard.has-strong{ border-color:rgba(255,176,46,.55); box-shadow:0 0 0 1px rgba(255,176,46,.22),0 10px 26px rgba(0,0,0,.5); }
  .card.bcard.has-conflict{ border-color:var(--conflict); }
  .card.bcard.has-cross{ border-color:var(--cross); }
  .bhead{ display:flex; align-items:center; gap:8px; padding:11px 16px 9px; border-bottom:1px solid rgba(255,255,255,.06); flex-wrap:wrap; }
  .btime{ font-family:"Oswald"; font-size:13px; letter-spacing:.04em; color:var(--ink-dim); }
  .bhead-sp{ flex:1 1 auto; }
  .bbadge{
    font-family:"Noto Sans TC"; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
    color:#ffb24d; background:rgba(255,150,40,.10); border:1px solid rgba(255,150,40,.5);
    border-radius:8px; padding:4px 10px; transition:.12s;
  }
  .bbadge:hover{ background:rgba(255,150,40,.22); }
  .bbadge.done{ color:#2ee07f; background:rgba(40,199,111,.10); border-color:rgba(40,199,111,.5); }
  .bbadge.ppd{ color:#ffb0a6; background:rgba(255,107,107,.10); border-color:rgba(255,107,107,.45); cursor:default; }
  .bico{ width:26px; height:26px; display:grid; place-items:center; border-radius:7px; cursor:pointer; color:var(--ink-dim); font-size:14px; flex:0 0 auto; }
  .bico:hover{ background:#222a36; color:var(--ink); }
  .bico.bdel:hover{ color:var(--danger); }
  .bflipbanner{ display:flex; align-items:center; gap:8px; padding:7px 16px; background:rgba(160,90,255,.16); border-bottom:1px solid rgba(160,90,255,.45); color:#d9b3ff; font-size:12.5px; font-weight:700; letter-spacing:.02em; }
  .bflipbanner .ic{ font-size:15px; }
  .card.bcard.flip{ border-color:rgba(160,90,255,.6); box-shadow:0 0 0 1px rgba(160,90,255,.3),0 10px 26px rgba(0,0,0,.5); }
  .bflipbanner.swap{ background:rgba(43,191,160,.13); border-bottom-color:rgba(43,191,160,.4); color:#7fe8d4; }
  .card.bcard.flip-swap{ border-color:rgba(43,191,160,.5); box-shadow:0 0 0 1px rgba(43,191,160,.26),0 10px 26px rgba(0,0,0,.5); }
  .bbody{ display:grid; grid-template-columns:212px 1fr; align-items:stretch; }
  .bscore{ display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; gap:4px; padding:16px 14px; border-right:1px solid rgba(255,255,255,.07); text-align:center; }
  .bana{ padding:12px 16px 16px; min-width:0; }
  .bteam{ display:flex; flex-direction:column; align-items:center; gap:3px; width:100%; }
  .bteam-nm{ font-weight:500; font-size:21px; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
  /* 模型／盤口勝率列（棒球 .bteam-pcts 原樣;先前漏移植→兩值黏在一起「模型—盤口47%」） */
  .bteam-pcts{ display:flex; gap:12px; font-family:"Oswald"; font-size:12px; line-height:1.4; }
  .bteam-pcts .pm{ color:#9fb0c4; } .bteam-pcts .pm b{ color:#d8e6f5; font-weight:700; }
  .bteam-pcts .pi{ color:#8a97a8; } .bteam-pcts .pi b{ color:#bcd0e4; font-weight:700; }
  .bteam-pcts .l{ color:var(--ink-dim); letter-spacing:.03em; margin-right:3px; }
  .bteam-sc{ font-family:"Oswald"; font-weight:700; font-size:42px; line-height:1.05; color:var(--lit); }
  .bteam-sc.live{ color:#3ad6a0; }
  .bvs{ font-family:"Oswald"; font-size:12px; letter-spacing:.16em; color:var(--ink-dim); padding:2px 0; }
  .bmid{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:0 0 auto; }
  .bmid-score{ font-family:"Oswald"; font-weight:700; font-size:38px; line-height:1; color:var(--lit); white-space:nowrap; }
  .bmid-score .c{ color:var(--ink-dim); margin:0 4px; }
  .bmid-score.live{ color:#3ad6a0; }
  .blivechip{ font-family:"Oswald"; font-size:11px; font-weight:700; letter-spacing:.05em; padding:2px 8px; border-radius:8px; white-space:nowrap; }
  .blivechip.on{ color:#3ad6a0; background:rgba(58,214,160,.15); border:1px solid rgba(58,214,160,.42); }
  .blivechip.fin{ color:#ffb24d; background:rgba(255,176,46,.14); border:1px solid rgba(255,176,46,.5); animation:blivepulse 1.8s ease-in-out infinite; }
  @keyframes blivepulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
  /* 節數表（籃球專屬,中央 VS 位;2026-07 DEMO v2 核准） */
  .bqs{ border-collapse:collapse; font-size:11px; color:var(--ink-dim); margin-top:5px; font-family:"Oswald"; }
  .bqs th{ font-weight:400; color:#5c6678; padding:1px 5px; }
  .bqs td{ padding:1px 5px; text-align:center; }
  .bqs .side{ color:var(--ink-dim); font-size:10px; }
  .bqs .liveq{ color:#3ad6a0; font-weight:700; }
  .binfo{ display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; border:1px solid var(--ink-dim); color:var(--ink-dim); font-size:11px; font-weight:700; font-family:Georgia,serif; font-style:italic; cursor:pointer; flex:0 0 auto; user-select:none; }
  .binfo:hover{ border-color:var(--lit); color:var(--lit); }
  .bpop{ position:fixed; z-index:6000; min-width:210px; max-width:320px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 34px rgba(0,0,0,.6); padding:11px 13px; font-size:12px; line-height:1.75; color:var(--ink); }
  .bpop .ph{ font-family:"Oswald"; font-size:10px; letter-spacing:.08em; color:var(--ink-dim); margin-bottom:5px; }
  .bpop .boxes{ display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
  .bpop .bx{ width:18px; height:18px; border-radius:5px; display:grid; place-items:center; font-size:10px; font-weight:700; font-family:"Oswald"; }
  .bpop .bx.w{ background:rgba(40,199,111,.16); color:#2ee07f; border:1px solid rgba(40,199,111,.45); }
  .bpop .bx.l{ background:rgba(255,92,92,.10); color:#ff7a7a; border:1px solid rgba(255,92,92,.4); }
  .bpop .bx.t{ background:rgba(255,255,255,.05); color:#8a97a8; border:1px solid var(--line); }
  .bana-head{ display:flex; align-items:center; gap:8px; padding:0 0 8px; }
  .bana-lbl{ font-family:"Oswald"; font-size:11px; letter-spacing:.1em; color:var(--ink-dim); }
  .bvenue{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .bvenue button{ font-size:11px; padding:3px 11px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer; font-family:"Noto Sans TC"; }
  .bvenue button.on{ background:#28c76f; color:#06210f; font-weight:700; }
  .bmkt-sec{ display:flex; align-items:center; gap:8px; padding:8px 0 4px; font-family:"Oswald"; font-size:11px; letter-spacing:.1em; color:var(--ink-dim); border-top:1px solid rgba(255,255,255,.06); }
  .bmkt:first-of-type .bmkt-sec{ border-top:none; }
  .bmkt-sec .mname{ color:#cdd8e6; font-size:12.5px; letter-spacing:.06em; flex:0 0 auto; font-family:"Noto Sans TC"; font-weight:700; }
  .bmkt-sec.conflict .mname{ color:var(--conflict); }
  .bmkt-sec .bswap{ cursor:pointer; color:#ff9f43; font-size:15px; line-height:1; }
  .bmkt-sec .basis{ display:inline-flex; align-items:center; gap:4px; font-size:11px; letter-spacing:0; color:var(--ink-dim); font-family:"Noto Sans TC"; }
  .bmkt-sec .basis input{ width:58px; background:#0c0f14; border:1px solid var(--line); border-radius:6px; color:var(--ink); font-size:13px; font-weight:700; text-align:center; padding:3px 2px; font-family:"Oswald"; outline:none; }
  .bmkt-sec .basis input:focus{ border-color:var(--lit); }
  .bmkt-sec .mksp{ flex:1 1 auto; }
  .bmkt-sec .bcmt{ font-size:11.5px; letter-spacing:0; color:#9fb0c4; white-space:nowrap; font-family:"Noto Sans TC"; text-align:right; }
  .bmkt-sec .bcmt .l{ color:var(--ink-dim); font-family:"Oswald"; font-size:10px; letter-spacing:.05em; margin-right:3px; }
  .bmkt-sec .bcmt .tm{ color:#9bd5ff; font-weight:600; }
  .bmkt-sec .bcmt.strong .tm{ color:#ffd27f; }
  /* 六欄網格：badge｜選項名｜燈號｜明牌◉(64px)｜注(24px)｜%(48px) —— 棒球 v2.2 定案欄距 */
  .bmkt-row{ display:grid; grid-template-columns:28px minmax(88px,126px) max-content 64px 24px 48px; align-items:center; column-gap:8px; padding:6px 0; }
  .bmkt-row .bside{ font-family:"Oswald"; font-size:11px; color:#0c0f14; background:var(--ink-dim); border-radius:5px; padding:3px 0; width:100%; text-align:center; font-weight:700; justify-self:stretch; }
  .bmkt-row .bside.give{ background:var(--lit); }
  .bmkt-row .bside.recv{ background:#5b6b80; color:#dfe6ef; }
  .bmkt-row .bnm{ font-weight:700; font-size:17px; color:var(--ink); cursor:default; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
  .bmkt-row .bnm .hv{ color:var(--ink-dim); font-family:"Oswald"; font-weight:700; margin-left:4px; }
  .bmkt-row.conflict .bnm{ color:var(--conflict); }
  .blights{ display:flex; align-items:center; gap:7px; cursor:pointer; justify-self:start; padding:3px 0; }
  .blights .lt{ width:19px; height:19px; border-radius:50%; flex:0 0 auto; cursor:pointer; transition:.1s; }
  .blights .lt.off{ border:1.5px solid #44556a; background:transparent; }
  .blights .lt.amber{ background:radial-gradient(circle at 35% 30%, #ffe39a, var(--lit) 70%); box-shadow:0 0 8px var(--lit-glow); }
  .blights .lt.red{ background:radial-gradient(circle at 35% 30%, #ffc2a0, var(--hot) 72%); box-shadow:0 0 9px var(--hot-glow); }
  .blights .lt.purple{ background:radial-gradient(circle at 35% 30%, #e6c2ff, #a05aff 72%); box-shadow:0 0 9px rgba(160,90,255,.55); }
  .betchip{ font-size:11px; border:1.5px dashed #4a5a70; border-radius:6px; color:var(--ink-dim); cursor:pointer; user-select:none; width:26px; text-align:center; line-height:1.55; justify-self:center; padding:1px 0; }
  .betchip.on{ border:1.5px solid var(--lit); color:#1a1205; font-weight:700; background:var(--lit); box-shadow:0 0 8px var(--lit-glow); }
  .bmkt-row .bcover{ font-family:"Oswald"; font-weight:700; font-size:15px; color:#aeb9c8; justify-self:end; white-space:nowrap; }
  .bmkt-row .bcover.hi{ color:#28c76f; } .bmkt-row .bcover.lo{ color:var(--conflict); } .bmkt-row .bcover.ls{ color:#5b6b80; }
  .bmkt-row .bcover .ss{ font-size:9px; color:#5b6b80; }
  .intl-strip{ display:flex; align-items:center; gap:8px; background:rgba(58,160,255,.07); border:1px solid rgba(58,160,255,.3); border-radius:8px; padding:6px 10px; margin:8px 6px 2px; font-size:13px; cursor:pointer; line-height:1.6; }
  .intl-more{ display:none; color:var(--ink-dim); font-size:12.5px; padding:5px 12px 2px; line-height:1.8; }
  .intl-strip.open + .intl-more{ display:block; }
  .bsettled{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px 12px; border-top:1px solid rgba(255,255,255,.06); }
  .bpill{ font-size:12px; font-weight:700; padding:3px 9px; border-radius:7px; border:1px solid var(--line); color:var(--ink-dim); }
  .bpill.hit{ color:#2ee07f; border-color:rgba(40,199,111,.5); background:rgba(40,199,111,.08); }
  .bpill.miss{ color:#ff6b6b; border-color:rgba(255,59,92,.5); background:rgba(255,59,92,.08); }
  .bpill.void{ color:#9fb0c4; }
  .bpill.sc{ color:var(--ink); border-color:var(--lit); background:rgba(255,176,46,.06); }
  @media (min-width:1180px){ .card.bcard{ max-width:672px; zoom:1.4; } }
  @media (min-width:900px) and (max-width:1179px){ .card.bcard{ zoom:1.2; } }
  @media (max-width:680px){
    .bbody{ grid-template-columns:1fr; }
    .bscore{ flex-direction:row; justify-content:space-between; border-right:none; border-bottom:1px solid rgba(255,255,255,.07); padding:12px 14px; }
    .bteam{ width:auto; }
  }
  /* ===== 結算視窗（棒球版移植） ===== */
  #settleModal{ position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:20px; }
  #settleModal.show{ display:flex; }
  #settleModal .box{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px 0; width:464px; max-width:100%; box-shadow:0 16px 48px rgba(0,0,0,.7); max-height:90vh; overflow:auto; }
  /* 按鈕列凍結在視窗底部：長表單不必捲到最下面才按得到（2026-08-03 使用者要求） */
  #settleModal .settle-actions{
    position:sticky; bottom:0; z-index:2; display:flex; gap:8px; flex-wrap:wrap;
    margin:16px -20px 0; padding:12px 20px; background:var(--panel);
    border-top:1px solid var(--line); box-shadow:0 -8px 18px rgba(0,0,0,.35);
  }
  #settleModal h3{ margin:0 0 4px; font-size:16px; }
  #settleModal .sub{ color:var(--ink-dim); font-size:12px; margin-bottom:14px; }
  #settleModal .btn{ padding:8px 14px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--ink); font-size:13.5px; font-weight:700; cursor:pointer; }
  #settleModal .odds-grid{ display:grid; grid-template-columns:74px 1fr 1fr; gap:8px 10px; align-items:center; margin-top:10px; }
  #settleModal .odds-grid .og-h{ font-size:11px; color:var(--ink-dim); text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #settleModal .odds-grid .og-l{ font-size:12px; color:var(--ink-dim); font-family:"Oswald"; letter-spacing:.04em; }
  #settleModal .odds-grid input{ width:100%; padding:7px 8px; text-align:center; background:#1b232e; border:1px solid var(--line); border-radius:7px; color:var(--ink); font-size:15px; font-family:"Oswald"; }
  #settleModal .odds-grid input:focus{ outline:none; border-color:var(--lit); }
  #settleModal .odds-grid input.dash{ background:#161d27; border-style:dashed; }
  .settle-q{ margin:14px 0; }
  .settle-q .qlabel{ font-size:13px; color:var(--ink-dim); margin-bottom:6px; font-family:"Oswald"; letter-spacing:.05em; display:flex; align-items:center; gap:8px; }
  .settle-q .qline{ margin-left:auto; font-size:11px; color:var(--ink-dim); display:flex; align-items:center; gap:4px; letter-spacing:0; }
  .settle-q .qline input{ width:54px; padding:4px 5px; text-align:center; background:#161d27; border:1px dashed var(--line); border-radius:6px; color:var(--ink); font-size:13px; font-family:"Oswald"; }
  .settle-q .opts{ display:flex; gap:6px; flex-wrap:wrap; }
  .settle-q .opt{ flex:1 1 auto; min-width:80px; padding:10px 12px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); font-size:14px; font-weight:700; cursor:pointer; text-align:center; }
  .settle-q .opt:hover{ border-color:#46566a; }
  .settle-q .opt.on{ background:var(--lit); border-color:var(--lit); color:#1a1205; }
  .settle-q .opt.tie{ background:#2a3340; color:#aeb9c8; }
  .settle-q .opt.tie.on{ background:#5b6b80; color:#fff; }
  .settle-q.score-row .score-inputs{ display:flex; align-items:flex-end; gap:18px; justify-content:center; }
  .settle-q.score-row label{ display:flex; flex-direction:column; align-items:center; gap:9px; }

<script src="./storage-pressure.js?v=20260902sp1"></script>
<script>
"use strict";
// ===== 文檔（與棒球板完全隔離的命名空間）=====
const DOC_KEY = "sportbetting_nba_doc_v1";
function loadDoc(){ try{ return JSON.parse(localStorage.getItem(DOC_KEY)) || null; }catch(e){ return null; } }
function saveDoc(d){
  const payload=JSON.stringify(d);
  if(window.__storagePressure) window.__storagePressure.setCritical(localStorage, DOC_KEY, payload);
  else localStorage.setItem(DOC_KEY, payload);
}
try{ if(window.__storagePressure) window.__storagePressure.cleanup(localStorage, false); }catch(_){}
let doc = loadDoc() || { v:1, activeDate: today(), boards:{} };
if(!doc.games) doc.games = [];
if(!doc.activeLeague) doc.activeLeague = "WNBA";
if(!doc.covMode) doc.covMode = "venue";   // venue=主客 / all=綜（棒球 venueMode split/combined 同義）
if(!doc.covWin) doc.covWin = "season";    // 過盤率視窗:season|10|30（棒球同款）
if(!doc.covThr) doc.covThr = 0.55;        // 過盤率高亮門檻（棒球同款 55/60/65）
if(!doc.cols) doc.cols = "auto";
if(!doc.uiScale) doc.uiScale = 1;
// ===== 復原（棒球 snapshot 系統移植;燈/注/⇄/收合/刪除/結算前存快照,⌘Z 或選單復原） =====
const _snaps = [];
function snapshot(){
  try{ _snaps.push(JSON.stringify({ boards: doc.boards, games: doc.games })); if(_snaps.length>30) _snaps.shift();
    const b=document.getElementById("undoBtn"); if(b) b.disabled=false; }catch(_){}
}
function undo(){
  const s = _snaps.pop(); if(!s) return;
  try{ const o = JSON.parse(s); doc.boards = o.boards; doc.games = o.games;
    bumpGamesVersion(); saveDoc(doc); render(); }catch(_){}
  const b=document.getElementById("undoBtn"); if(b) b.disabled = !_snaps.length;
}
document.addEventListener("keydown",(e)=>{ if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); } });
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const esc = (s)=> String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (sel)=> document.querySelector(sel);
// wnba-picks-addon.js（棒球 expert-picks-addon 複製版）依賴的棒球全域介面
function leagueOf(){ return "wnba"; }
function save(){ saveDoc(doc); }
function fmtDate(d){ const p=d.split("-"); return `${parseInt(p[1])}/${parseInt(p[2])}`; }
const SAMPLE_MIN = 8;   // WNBA 半季 44 場、主客拆分樣本天然小,門檻自棒球 15 降為 8（樣本數照樣印出）

// ===== 聯盟 =====
const LEAGUES = {
  NBA:  { name:"NBA",  colorHex:"#e56020", teams:["老鷹","塞爾提克","籃網","黃蜂","公牛","騎士","獨行俠","金塊","活塞","勇士","火箭","溜馬","快艇","湖人","灰熊","熱火","公鹿","灰狼","鵜鶘","尼克","雷霆","魔術","76人","太陽","拓荒者","國王","馬刺","暴龍","爵士","巫師"] },
  WNBA: { name:"WNBA", colorHex:"#ff9d3c", teams:["王牌","自由","山貓","狂熱","風暴","水星","金州","太陽","飛翼","神秘","美夢","天空","火花","節奏","火焰"] }
};

// ============================================================
// GAMES — 統計唯一真相源（棒球板引擎移植;快取鍵帶聯盟防撞名 NBA太陽 vs WNBA太陽）
// doc.games = [{sid,date,league,awayTeam,homeTeam,awayScore,homeScore,hdFav,hdVal,totBasis,mlOffered,manual?}]
// ============================================================
function seasonOf(dateStr){ return (dateStr && /^\d{4}/.test(dateStr)) ? dateStr.slice(0,4) : String(new Date().getFullYear()); }
function emptyTeamRow(){
  return {
    ml:   { home:{w:0,l:0,t:0}, away:{w:0,l:0,t:0} },
    hd:   { home:{w:0,l:0},     away:{w:0,l:0}     },
    recv: { home:{w:0,l:0},     away:{w:0,l:0}     },
    tot:  { home:{w:0,l:0},     away:{w:0,l:0}     }
  };
}
let _statsCache = { version:-1, byKey:{} };
function bumpGamesVersion(){
  doc.gamesVersion = (doc.gamesVersion||0) + 1;
  _statsCache = { version:-1, byKey:{} };
}
function _gameResultFor(team, g){
  if(g.awayTeam!==team && g.homeTeam!==team) return null;
  const isAway = g.awayTeam===team;
  const venue = isAway ? "away" : "home";
  const teamScore = isAway ? g.awayScore : g.homeScore;
  const oppScore  = isAway ? g.homeScore : g.awayScore;
  const out = { venue };
  if(teamScore!=null && oppScore!=null && g.mlOffered!==false){
    if(teamScore === oppScore) out.ml = "t";
    else out.ml = (teamScore-oppScore)>0 ? "w" : "l";
  }
  if(g.hdFav && g.hdVal!=null && teamScore!=null && oppScore!=null){
    const favTeam = g.hdFav==="away" ? g.awayTeam : g.homeTeam;
    const isFav = favTeam === team;
    const favScore = isFav ? teamScore : oppScore;
    const undScore = isFav ? oppScore : teamScore;
    const diff = (favScore - undScore) - g.hdVal;
    if(diff !== 0){
      const favCovered = diff > 0;
      if(isFav) out.hd = favCovered ? "w" : "l";
      else      out.recv = favCovered ? "l" : "w";
    }
  }
  if(g.totBasis!=null && teamScore!=null && oppScore!=null){
    const tot = teamScore + oppScore;
    if(tot !== g.totBasis) out.tot = (tot > g.totBasis) ? "w" : "l";
  }
  return out;
}
function _rebuildTeamCache(league, team){
  const bySeason = {};
  for(const g of (doc.games||[])){
    if(g.league!==league) continue;
    if(g.awayTeam!==team && g.homeTeam!==team) continue;
    if(g.awayScore==null || g.homeScore==null) continue;
    const season = seasonOf(g.date);
    if(!bySeason[season]) bySeason[season] = emptyTeamRow();
    const row = bySeason[season];
    const r = _gameResultFor(team, g);
    if(!r) continue;
    if(r.ml === "w") row.ml[r.venue].w++;
    else if(r.ml === "l") row.ml[r.venue].l++;
    else if(r.ml === "t") row.ml[r.venue].t++;
    if(r.hd === "w") row.hd[r.venue].w++;
    else if(r.hd === "l") row.hd[r.venue].l++;
    if(r.recv === "w") row.recv[r.venue].w++;
    else if(r.recv === "l") row.recv[r.venue].l++;
    if(r.tot === "w") row.tot[r.venue].w++;
    else if(r.tot === "l") row.tot[r.venue].l++;
  }
  _statsCache.byKey[league+"|"+team] = bySeason;
}
function _getTeamSeasonRow(league, season, team){
  if(_statsCache.version !== (doc.gamesVersion||0)) _statsCache = { version:(doc.gamesVersion||0), byKey:{} };
  const k = league+"|"+team;
  if(!_statsCache.byKey[k]) _rebuildTeamCache(league, team);
  return (_statsCache.byKey[k] && _statsCache.byKey[k][season]) || emptyTeamRow();
}
function statRead(league, season, team, market, venue){
  const row = _getTeamSeasonRow(league, season, team)[market];
  if(venue) return {...row[venue], t:row[venue].t||0};
  const h=row.home, a=row.away;
  return { w:(h.w||0)+(a.w||0), l:(h.l||0)+(a.l||0), t:(h.t||0)+(a.t||0) };
}
function pctStr(rec){ const d=(rec.w||0)+(rec.l||0); return d===0 ? null : Math.round((rec.w/d)*100)+"%"; }
function pctNum(rec){ const d=(rec.w||0)+(rec.l||0); return d===0 ? null : rec.w/d; }
function runsRead(league, season, team, venue){
  let scored=0, conceded=0, games=0;
  for(const g of (doc.games||[])){
    if(g.league!==league) continue;
    if(g.awayTeam!==team && g.homeTeam!==team) continue;
    if(seasonOf(g.date) !== season) continue;
    if(g.awayScore==null || g.homeScore==null) continue;
    const isAway = g.awayTeam===team;
    if(venue==="home" && isAway) continue;
    if(venue==="away" && !isAway) continue;
    scored += isAway ? g.awayScore : g.homeScore;
    conceded += isAway ? g.homeScore : g.awayScore;
    games++;
  }
  return { scored, conceded, games };
}
function streakRead(league, season, team, venue){
  const list = (doc.games||[]).filter(g=>{
    if(g.league!==league) return false;
    if(g.awayTeam!==team && g.homeTeam!==team) return false;
    if(seasonOf(g.date) !== season) return false;
    if(g.awayScore==null || g.homeScore==null) return false;
    if(venue){
      const isAway = g.awayTeam===team;
      if(venue==="home" && isAway) return false;
      if(venue==="away" && !isAway) return false;
    }
    return true;
  }).sort((a,b)=> a.date < b.date ? 1 : -1);
  let kind = "", n = 0;
  for(let i=0;i<list.length;i++){
    const won = ((list[i].awayTeam===team ? list[i].awayScore : list[i].homeScore) >
                 (list[i].awayTeam===team ? list[i].homeScore : list[i].awayScore));
    if(i===0){ kind = won?"W":"L"; n=1; continue; }
    if((won && kind==="W") || (!won && kind==="L")) n++;
    else break;
  }
  return { n, kind };
}
function streakStr(s){ return (!s || s.n===0) ? "—" : `${s.n}${s.kind}`; }
function recentResults(league, season, team, n){
  const list = (doc.games||[]).filter(g=>{
    if(g.league!==league) return false;
    if(g.awayTeam!==team && g.homeTeam!==team) return false;
    if(seasonOf(g.date) !== season) return false;
    if(g.awayScore==null || g.homeScore==null) return false;
    return true;
  }).sort((a,b)=> a.date < b.date ? 1 : -1).slice(0, n).reverse();
  return list.map(g=>{
    const isAway = g.awayTeam===team;
    const my = isAway?g.awayScore:g.homeScore, op = isAway?g.homeScore:g.awayScore;
    return { r: my>op?"w":(my<op?"l":"t"), date:g.date, opp:isAway?g.homeTeam:g.awayTeam, my, op, venue:isAway?"away":"home" };
  });
}
function gameUpsert(g){
  if(!doc.games) doc.games = [];
  let idx = g.sid ? doc.games.findIndex(x => x.sid === g.sid) : -1;
  if(idx<0) idx = doc.games.findIndex(x => x.date===g.date && x.league===g.league && x.awayTeam===g.awayTeam && x.homeTeam===g.homeTeam);
  if(idx<0) doc.games.push(g); else doc.games[idx] = g;
}
function gameFind(sid, date, league, away, home){
  return (doc.games||[]).find(x => x.sid===sid || (x.date===date && x.league===league && x.awayTeam===away && x.homeTeam===home)) || null;
}

// ===== WNBA 種子載入 =====
async function loadSeedGames(){
  try{
    const r = await fetch(`data/wnba_games.json?t=${Date.now()}`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    if(!j || !Array.isArray(j.games)) throw new Error("格式不符");
    for(const g of j.games){
      const old = gameFind(g.sid, g.date, "WNBA", g.awayTeam, g.homeTeam);
      if(old && old.manual) continue;                    // 手動覆蓋優先
      gameUpsert(g);
    }
    bumpGamesVersion(); saveDoc(doc);
    const el = $("#stamp"); if(el && !/資料更新/.test(el.textContent)) el.textContent = `WNBA 數據 ${j.count} 場 · ${String(j.builtAt||"").slice(0,10)}`;
    if($("#statspage").classList.contains("show")) renderStatsPage();
    render();
  }catch(e){
    const el = $("#stamp"); if(el) el.textContent = `種子載入失敗(${e.message}) · 用本機快取`;
  }
}

// ===== 每日管線載入 =====
let pregameCache = { updated:null, games:[] };
let oddsCache = { updated:null, games:{} };
let seriesCache = {};
async function loadPregame(){
  try{
    const r = await fetch(`data/wnba_pregame.json?t=${Date.now()}`);
    if(r.ok){ const j = await r.json(); if(j && Array.isArray(j.games)){ pregameCache = j; autoSettleFromPregame();
      const st=$("#stamp"); if(st && j.updated){ const d=new Date(j.updated); if(!isNaN(d)){ const t=new Date(d.getTime()+8*3600e3);
        st.textContent = `資料更新 ${String(t.getUTCMonth()+1).padStart(2,"0")}-${String(t.getUTCDate()).padStart(2,"0")} ${String(t.getUTCHours()).padStart(2,"0")}:${String(t.getUTCMinutes()).padStart(2,"0")}`; } }
      render(); } }
  }catch(e){}
  try{
    const r2 = await fetch(`data/wnba_odds_log.json?t=${Date.now()}`);
    if(r2.ok){ const j2 = await r2.json(); if(j2 && j2.games){ oddsCache = j2; render(); } }
  }catch(e){}
  try{
    const r3 = await fetch(`data/wnba_lottery_series.json?t=${Date.now()}`);
    if(r3.ok){ const j3 = await r3.json(); if(j3 && typeof j3==="object"){ seriesCache = j3; } }
  }catch(e){}
}
setInterval(loadPregame, 5*60e3);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ loadPregame(); loadSeedGames(); } });
function autoSettleFromPregame(){
  let changed = false;
  for(const g of pregameCache.games||[]){
    if(g.status!=="finished" || g.awayScore==null || g.homeScore==null) continue;
    const useHd = g.hdSrc==="運彩" && g.hdFav && g.hdVal!=null;
    const rec = { sid:g.officialId, date:g.date, league:"WNBA", awayTeam:g.away, homeTeam:g.home,
      awayScore:g.awayScore, homeScore:g.homeScore,
      hdFav:useHd?g.hdFav:null, hdVal:useHd?g.hdVal:null,
      totBasis:g.totLine!=null?g.totLine:null, mlOffered:g.mlOffered!==false };
    const old = gameFind(rec.sid, rec.date, "WNBA", rec.awayTeam, rec.homeTeam);
    if(old && old.manual) continue;                      // 手動覆蓋不被管線洗掉
    // it.settled 同步（手動結算優先;卡片 pills／戰績／導覽全讀這份=棒球資料流）
    const it = ensureItem(g.date, g.officialId);
    // 異常快照落印（2026-08-04）：分類依據=bet365 vs 台彩;odds 快取 5 天滾動,結算當下不落印=歷史永久失考
    if(!it.anomSnap){
      const _i = intlFor(g), _l = lswFor(g);
      const _mlo = (oddsCache.games && oddsCache.games[g.officialId] && oddsCache.games[g.officialId].ml) || null;
      it.anomSnap = {
        flip: !!(_i && g.hdFav && ((_i.fav==="away") !== (g.hdFav==="away"))),
        bswaps: _i ? (_i.flips||0) : 0, lsw: _l||0,
        mlFav: (_mlo && _mlo.curH && _mlo.curA) ? (_mlo.curA < _mlo.curH ? "away" : "home") : null
      };
    }
    if(!it.settled || !it.settled.manual){
      const auto = computeAutoSettled(g);
      if(auto && JSON.stringify(it.settled||null)!==JSON.stringify(auto)){ it.settled = auto; changed = true; }
    }
    if(old && JSON.stringify(old)===JSON.stringify(rec)) continue;
    gameUpsert(rec); changed = true;
  }
  if(changed){ bumpGamesVersion(); saveDoc(doc); }
}

// ===== 使用者卡片狀態（棒球 item 同構:每選項 {lights,bet}） =====
const OPT_KEYS = ["mlAway","mlHome","hdGive","hdRecv","over","under"];
function ensureItem(date, id){
  const b = doc.boards[date] = doc.boards[date] || {};
  const items = b.items = b.items || [];
  let it = items.find(x=>x.id===id);
  if(!it){ it = { id, league:"WNBA" }; items.push(it); }
  for(const k of OPT_KEYS){
    if(!it[k] || typeof it[k].lights!=="number"){
      const oldL = (it.L&&it.L[k])||0, oldB = !!(it.bets&&it.bets[k]);
      it[k] = { lights: oldL, bet: oldB };
    }
  }
  delete it.L; delete it.bets;
  return it;
}

// ===== 國際軸（titan bet365;rows[0]=最新;負=客讓,稽核實證） =====
function intlFor(g){
  const o = oddsCache.games && oddsCache.games[g.officialId];
  if(!o || !o.hd || !o.hd.length) return null;
  const startKey = (o.startBJ||"").slice(5,16);
  const norm = (t)=>{ const m=/^(\d{1,2})-(\d{1,2})\s+(\d{1,2}:\d{2})$/.exec(t); return m?`${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")} ${m[3].padStart(5,"0")}`:t; };
  const pre = startKey ? o.hd.filter(r=>norm(r.t) < startKey) : o.hd;
  const preOu = (o.ou||[]).filter(r=>!startKey || norm(r.t) < startKey);
  if(!pre.length) return null;
  const latest = pre[0], open = pre[pre.length-1];
  const move = (latest.line!=null && open.line!=null) ? Math.abs(latest.line-open.line) : 0;
  const dir  = (latest.line!=null && open.line!=null) ? (latest.line-open.line) : 0;
  const flips = (()=>{ let n=0; for(let i=1;i<pre.length;i++){ if((pre[i-1].line<0)!==(pre[i].line<0)) n++; } return n; })();
  const ouLatest = preOu.length?preOu[0]:null, ouOpen = preOu.length?preOu[preOu.length-1]:null;
  return { latest, open, move, dir, flips,
    fav: latest.line<0 ? "away" : "home", il: Math.abs(latest.line),
    ouMove: (ouLatest&&ouOpen)? (ouLatest.line-ouOpen.line) : 0 };
}
function lswFor(g){
  const rows = seriesCache[g.officialId] || [];
  let n=0; for(let i=1;i<rows.length;i++){ if(rows[i-1].hdFav && rows[i].hdFav && rows[i-1].hdFav!==rows[i].hdFav) n++; }
  return n;
}

// ===== 過盤率（隊伍統計同源;covMode 主客/綜＋covWin 本季/近N＋covThr 門檻＝棒球三旋鈕） =====
function recentRec(league, season, team, market, venue, n){
  const list = (doc.games||[]).filter(g=>{
    if(g.league!==league) return false;
    if(g.awayTeam!==team && g.homeTeam!==team) return false;
    if(seasonOf(g.date)!==season) return false;
    if(g.awayScore==null||g.homeScore==null) return false;
    if(venue){ const isAway=g.awayTeam===team; if(venue==="home"&&isAway) return false; if(venue==="away"&&!isAway) return false; }
    return true;
  }).sort((a,b)=> a.date<b.date?1:-1);
  const out={w:0,l:0}; let took=0;
  for(const g of list){
    const r=_gameResultFor(team,g); if(!r) continue;
    const res=r[market]; if(res==null) continue;
    if(res==="w") out.w++; else if(res==="l") out.l++; else continue;
    if(++took>=n) break;
  }
  return out;
}
function pctInfo(league, season, team, market, side){
  const venue = doc.covMode==="venue" ? side : null;
  const rec = (doc.covWin==="season")
    ? statRead(league, season, team, market, venue)
    : recentRec(league, season, team, market, venue, +doc.covWin);
  const sample = (rec.w||0)+(rec.l||0);
  if(sample===0) return null;
  const pn = rec.w/sample;
  return { pct: Math.round(pn*100)+"%", pn, sample, lowSample: sample<SAMPLE_MIN,
    cls: pn>=(doc.covThr||0.55) ? "hi" : (pn<0.40 ? "lo" : "") };
}
function bCoverHTML(info){
  if(!info) return `<span class="bcover ls">—</span>`;
  const cls = info.lowSample ? "ls" : info.cls;
  const ss = info.lowSample ? `<span class="ss">(${info.sample})</span>` : "";
  return `<span class="bcover ${cls}">${info.pct}${ss}</span>`;
}
function _firstEl(htmlStr){ const t=document.createElement("span"); t.innerHTML=htmlStr; return t.firstElementChild || t; }

// ===== 燈號（棒球操作 1:1:左鍵+1、右鍵−1、長按清零;點隊名−1） =====
function bLightSlots(n){
  n = Math.max(0, Math.min(12, n|0));
  const out = [], overflow = Math.max(0, n-5), escN = Math.min(overflow, 5), purple = Math.max(0, n-10);
  for(let i=0;i<5;i++){
    if(n<=5) out.push(i<n ? "amber" : "off");
    else if(i<purple) out.push("purple");
    else if(i<escN) out.push("red");
    else out.push("amber");
  }
  return out;
}
function bLightsEl(obj){
  const wrap = document.createElement("div"); wrap.className="blights"; wrap.title="左鍵＝加燈、右鍵＝減燈（長按整排清零）";
  bLightSlots(obj.lights).forEach(c=>{ const d=document.createElement("div"); d.className="lt "+c; wrap.appendChild(d); });
  let lpTimer=null, lpFired=false;
  wrap.addEventListener("pointerdown", (e)=>{ if(e.button===2) return; lpFired=false; lpTimer=setTimeout(()=>{ lpFired=true; if(obj.lights>0){ snapshot(); obj.lights=0; saveDoc(doc); render(); } }, 550); });
  const cancel=()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } };
  wrap.addEventListener("pointerup", cancel); wrap.addEventListener("pointerleave", cancel); wrap.addEventListener("pointercancel", cancel);
  wrap.addEventListener("click", ()=>{ if(lpFired){ lpFired=false; return; } if(obj.lights<12){ snapshot(); obj.lights++; saveDoc(doc); render(); } });
  wrap.addEventListener("contextmenu", (e)=>{ e.preventDefault(); e.stopPropagation(); if(obj.lights>0){ snapshot(); obj.lights--; saveDoc(doc); render(); } });
  return wrap;
}

// ===== ⓘ 彈窗 =====
let _bpop = null;
function closeBPop(){ if(_bpop){ _bpop.remove(); _bpop=null; } }
document.addEventListener("click", (e)=>{ if(_bpop && !_bpop.contains(e.target) && !(_bpop.__anchor && _bpop.__anchor.contains(e.target))) closeBPop(); }, true);
function bTogglePop(anchorEl, html){
  if(_bpop && _bpop.__anchor===anchorEl){ closeBPop(); return; }
  closeBPop();
  const p = document.createElement("div"); p.className="bpop"; p.innerHTML=html; p.__anchor=anchorEl;
  document.body.appendChild(p);
  const r = anchorEl.getBoundingClientRect();
  const pw = p.offsetWidth, ph = p.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let left = r.left, top = r.bottom + 6;
  if(left + pw > vw - 8) left = vw - 8 - pw;
  if(left < 8) left = 8;
  if(top + ph > vh - 8) top = Math.max(8, r.top - 6 - ph);
  p.style.left = left+"px"; p.style.top = top+"px";
  _bpop = p;
}
function bFormHTML(league, team){
  const season = seasonOf(doc.activeDate);
  let res=[]; try{ res = recentResults(league, season, team, 10) || []; }catch(_){}
  if(!res.length) return `<div class='ph'>近況</div>${esc(team)}：尚無比賽資料`;
  let boxes="";
  res.forEach(e=>{ const c=e.r==="w"?"w":(e.r==="l"?"l":"t"), word=e.r==="w"?"勝":(e.r==="l"?"敗":"和"), md=e.date.slice(5).replace("-","/");
    boxes += `<span class="bx ${c}" title="${md} ${e.venue==="away"?"客":"主"} vs ${esc(e.opp)} ${e.my}:${e.op} ${word}">${c.toUpperCase()}</span>`; });
  return `<div class='ph'>${esc(team)}　近${res.length}場（左舊右新）</div><div class="boxes">${boxes}</div>`;
}

// ===== 結算語義（it.settled=棒球同構;自動路徑由管線比分+盤口推導,手動視窗覆蓋） =====
function computeAutoSettled(model){
  const a=model.awayScore, h=model.homeScore;
  if(a==null||h==null) return null;
  const s = { awayScore:a, homeScore:h };
  s.ml = a>h ? "away" : "home";
  if(model.hdSrc==="運彩" && model.hdFav && model.hdVal!=null){
    const favM = model.hdFav==="home" ? (h-a) : (a-h);
    s.hd = favM - model.hdVal > 0 ? "cover" : (favM - model.hdVal === 0 ? "push" : "nocover");
  }
  if(model.totLine!=null){
    const t=a+h; s.tot = t>model.totLine ? "over" : (t===model.totLine ? "push" : "under");
  }
  return s;
}

function leagueOfModel(m){ return (m.league||"WNBA").toLowerCase(); }
function currentModels(){
  if(doc.activeLeague!=="WNBA") return [];
  return (pregameCache.games||[]).filter(g=>g.date===doc.activeDate)
    .map(modelFromPregame).filter(m=>!m._item.hidden);

function collectSummary(models){
  const strong = [], conflicts = [];
  models.forEach(m=>{
    const it = m._item;
    if(it.settled || m.status==="finished") return;   // 已結算/已終場退出即時總結
    const favSide = m.hdFav||"home", undSide = favSide==="away"?"home":"away";
    const favName = favSide==="away"?m.away:m.home, undName = undSide==="away"?m.away:m.home;
    const matchName = `${m.away}/${m.home}`;
    const lg = leagueOfModel(m);
    const mlC  = it.mlAway.lights>0 && it.mlHome.lights>0;
    const hdC  = it.hdGive.lights>0 && it.hdRecv.lights>0;
    const totC = it.over.lights>0  && it.under.lights>0;
    const oppML = (undSide==="away") ? it.mlAway.lights : it.mlHome.lights;
    const crossC = it.hdGive.lights>0 && oppML>0;
    if(mlC)  conflicts.push({matchName, league:lg, market:"獨贏", kind:"same"});
    if(hdC)  conflicts.push({matchName, league:lg, market:"讓分", kind:"same"});
    if(totC) conflicts.push({matchName, league:lg, market:"大小分", kind:"same"});
    if(crossC) conflicts.push({matchName, league:lg, market:"讓分↔對手獨贏", kind:"cross"});
    const hv = m.hdVal!=null?` ${m.hdVal}`:"", tv = m.totLine!=null?` ${m.totLine}`:"";
    const add=(cond,lights,pick,mk,market)=>{ if(cond && lights>=3) strong.push({matchName, league:lg, pick, mk, n:lights, m, market}); };
    add(!mlC && !(crossC && undSide==="away"), it.mlAway.lights, m.away, "獨贏", "ml");
    add(!mlC && !(crossC && undSide==="home"), it.mlHome.lights, m.home, "獨贏", "ml");
    add(!hdC && !crossC, it.hdGive.lights, favName, "讓"+hv, "hd");
    add(!hdC, it.hdRecv.lights, undName, "受讓"+hv, "recv");
    add(!totC, it.over.lights,  "大分", "大小分"+tv, "tot");
    add(!totC, it.under.lights, "小分", "大小分"+tv, "tot");
    try{
      const eps = (window.__expertPicks && window.__expertPicks.epStrong) ? window.__expertPicks.epStrong(m, doc.activeDate) : {recs:[],splits:[]};
      eps.recs.forEach(r=> strong.push({matchName, league:lg, pick:r.pick, mk:r.mk, n:r.w, m, market:r.market, ep:true, np:r.n, tipLine:r.tipLine}));
      eps.splits.forEach(sp=> conflicts.push({matchName, league:lg, market:`${sp.market}明牌分歧 ${sp.txt}`, kind:"ep"}));
    }catch(_){}
  });
  strong.forEach(s=>{ if(!s.ep){ const e=strong.find(x=>x.ep && !x.drop && x.m===s.m && x.market===s.market && x.pick===s.pick
      && (x.tipLine==null || (s.market==="hd" ? x.tipLine<0 : s.market==="recv" ? x.tipLine>0 : true))); if(e){ s.dual=true; s.epW=e.n; s.np=e.np; e.drop=true; } } });
  const strongOut = strong.filter(s=>!s.drop);
  strongOut.sort((a,b)=> ((b.dual?1:0)-(a.dual?1:0)) || b.n-a.n);
  return {strong: strongOut, conflicts};
}
function todayHitRate(models){
  const r = { ml:{hit:0,miss:0}, hd:{hit:0,miss:0}, tot:{hit:0,miss:0}, bet:{hit:0,miss:0}, ep:{hit:0,miss:0}, dual:{hit:0,miss:0}, any:0, rows:[] };
  models.forEach(m=>{
    const it = m._item;
    const s = it.settled || computeAutoSettled(m);
    if(!s || m.status!=="finished" && !it.settled) return;
    const matchName = `${m.away}/${m.home}`;
    const fav = m.hdFav==="away"?m.away:m.home, und = m.hdFav==="away"?m.home:m.away;
    const hv = m.hdVal!=null?` ${m.hdVal}`:"";
    const lg = leagueOfModel(m);
    const det = (acct,label,hit)=>r.rows.push({acct, m:matchName, label, hit, lg, itId:m.officialId});
    let epMap = null;
    const epRec = (opt)=>{
      if(epMap===null){ epMap={}; try{ window.__expertPicks.epStrong(m, doc.activeDate).recs.forEach(x=>epMap[x.opt]=x); }catch(_){} }
      return epMap[opt];
    };
    const epTally = (opt, litOK, hit, label)=>{
      const rec = epRec(opt); if(!rec) return;
      if((opt==="hdGive"||opt==="hdRecv") && rec.tipLine!=null && s.awayScore!=null && s.homeScore!=null){
        const aTeam = rec.pick===m.away;
        const ts = aTeam?s.awayScore:s.homeScore, os = aTeam?s.homeScore:s.awayScore;
        if(ts+rec.tipLine===os) return;
        hit = (ts+rec.tipLine)>os;
        label = `${rec.pick} ${rec.tipLine>0?"+":""}${rec.tipLine}`;
      }
      (hit?r.ep.hit++:r.ep.miss++); det("🎯",label,hit);
      if(litOK){ (hit?r.dual.hit++:r.dual.miss++); det("⚡",label,hit); }
    };
    if(s.ml==="away"||s.ml==="home"){
      if(it.mlAway.lights>=3){ r.any++; const h=s.ml==="away"; (h?r.ml.hit++:r.ml.miss++); det("獨贏",m.away,h); }
      if(it.mlHome.lights>=3){ r.any++; const h=s.ml==="home"; (h?r.ml.hit++:r.ml.miss++); det("獨贏",m.home,h); }
      epTally("mlAway", it.mlAway.lights>=3, s.ml==="away", m.away);
      epTally("mlHome", it.mlHome.lights>=3, s.ml==="home", m.home);
      if(it.mlAway.bet){ const h=s.ml==="away"; (h?r.bet.hit++:r.bet.miss++); det("注",m.away,h); }
      if(it.mlHome.bet){ const h=s.ml==="home"; (h?r.bet.hit++:r.bet.miss++); det("注",m.home,h); }
    }
    if(s.hd==="cover"||s.hd==="nocover"){
      const gv = (s.myHdGive!=null) ? s.myHdGive : (s.hd==="cover"?"cover":"nocover");
      const rv = (s.myHdRecv!=null) ? s.myHdRecv : (s.hd==="cover"?"nocover":"cover");
      if(it.hdGive.lights>=3 && gv!=="push"){ r.any++; const h=gv==="cover"; (h?r.hd.hit++:r.hd.miss++); det("讓分",fav+hv,h); }
      if(it.hdRecv.lights>=3 && rv!=="push"){ r.any++; const h=rv==="cover"; (h?r.hd.hit++:r.hd.miss++); det("讓分",und+" 受讓",h); }
      if(gv!=="push") epTally("hdGive", it.hdGive.lights>=3, gv==="cover", fav+hv);
      if(rv!=="push") epTally("hdRecv", it.hdRecv.lights>=3, rv==="cover", und+" 受讓");
      if(it.hdGive.bet && gv!=="push"){ const h=gv==="cover"; (h?r.bet.hit++:r.bet.miss++); det("注",fav+hv,h); }
      if(it.hdRecv.bet && rv!=="push"){ const h=rv==="cover"; (h?r.bet.hit++:r.bet.miss++); det("注",und+" 受讓",h); }
    }
    { const st=(s.myTot!=null)?s.myTot:s.tot; if(st==="over"||st==="under"){
      const tv = (it.totVal!=null&&it.totVal!=="")?` ${it.totVal}`:(m.totLine!=null?` ${m.totLine}`:"");
      if(it.over.lights>=3){ r.any++; const h=st==="over"; (h?r.tot.hit++:r.tot.miss++); det("大小","大"+tv,h); }
      if(it.under.lights>=3){ r.any++; const h=st==="under"; (h?r.tot.hit++:r.tot.miss++); det("大小","小"+tv,h); }
      epTally("over", it.over.lights>=3, st==="over", "大"+tv);
      epTally("under", it.under.lights>=3, st==="under", "小"+tv);
      if(it.over.bet){ const h=st==="over"; (h?r.bet.hit++:r.bet.miss++); det("注","大"+tv,h); }
      if(it.under.bet){ const h=st==="under"; (h?r.bet.hit++:r.bet.miss++); det("注","小"+tv,h); }
    } }
  });
  return r;
}
// ===== 異常組合統計（棒球 collectCrossTab 移植;分類=手標優先,無手標用結算落印的 anomSnap）=====
// 2026-08-04 使用者拍板：燈號分析可簡,異常比賽統計規範必留。前瞻累積,不回填。
let __ctMemo=null, __ctMemoAt=0;
function collectCrossTab(leagueFilter){
  const cell=()=>({ n:0, cov:0, covN:0, fw:0, fwN:0, ov:0, ovN:0, games:[] });
  const grp={ flip:{ solo:cell(), swap:cell(), div:cell(), both:cell(), all:cell() },
              conv:{ solo:cell(), swap:cell(), div:cell(), both:cell(), all:cell() } };
  const other={ swapOnly:cell(), bothOD:cell() };
  let total=0;
  for(const d of Object.keys(doc.boards||{})){
    for(const it of ((doc.boards[d]||{}).items||[])){
      if(!it.settled || it.settled.awayScore==null) continue;
      const rec=(doc.games||[]).find(x=>x.sid===it.id); if(!rec) continue;
      if(leagueFilter && leagueFilter!=="all" && String(rec.league||"").toLowerCase()!==leagueFilter) continue;
      const snap=it.anomSnap||{};
      const kind = it.platformFlip ? "flip" : it.flipVanished ? "was"
                 : (it.preGameSwap || snap.lsw>0 || snap.bswaps>0) ? "swap"
                 : (snap.flip ? "flip" : null);
      if(!kind) continue;
      const sw = !!(it.preGameSwap || snap.lsw>0 || snap.bswaps>0);
      const dv = !!(snap.mlFav && rec.hdFav && snap.mlFav!==rec.hdFav);
      const margin=rec.homeScore-rec.awayScore;
      const o={ date:d, m:rec.awayTeam+"/"+rec.homeTeam, itId:it.id };
      const upd=(c)=>{
        c.n++; c.games.push(o); 
        if(rec.hdFav && rec.hdVal!=null){ const fm=(rec.hdFav==="home"?margin:-margin)-rec.hdVal;
          if(fm!==0){ c.covN++; if(fm>0) c.cov++; }
          c.fwN++; if((rec.hdFav==="home"?margin:-margin)>0) c.fw++; }
        if(rec.totBasis!=null){ const t=rec.awayScore+rec.homeScore;
          if(t!==rec.totBasis){ c.ovN++; if(t>rec.totBasis) c.ov++; } }
      };
      total++;
      if(kind==="flip"||kind==="was"){
        const G=kind==="flip"?grp.flip:grp.conv;
        upd(G.all);
        upd(sw&&dv?G.both: sw?G.swap: dv?G.div: G.solo);
      } else {
        upd(dv?other.bothOD:other.swapOnly);
      }
    }
  }
  return { total, grp, other };
}

// 卡面讓分區晶片：這場屬哪型異常＋該格歷史讓分過盤率（棒球 bAnomInfo 同構）
function bAnomInfo(model, it){
  const snap = it.anomSnap || (function(){ const _i=intlFor(model), _l=lswFor(model);
    return { flip: !!(_i && model.hdFav && ((_i.fav==="away")!==(model.hdFav==="away"))), bswaps:_i?(_i.flips||0):0, lsw:_l||0, mlFav:null }; })();
  const kind = it.platformFlip ? "flip" : it.flipVanished ? "was"
             : (it.preGameSwap || snap.lsw>0 || snap.bswaps>0) ? "swap" : (snap.flip ? "flip" : null);
  if(!kind) return null;
  const ct = crossTabCached(); if(!ct || !ct.total) return null;
  const sw = !!(it.preGameSwap || snap.lsw>0 || snap.bswaps>0);
  const dv = !!(snap.mlFav && model.hdFav && snap.mlFav!==model.hdFav);
  const pc=(x,n)=> n? Math.round(100*x/n)+"%" : "—";
  let lbl, cls, B, groupAll, groupName;
  if(kind==="flip"||kind==="was"){
    const G = kind==="flip"?ct.grp.flip:ct.grp.conv;
    groupName = kind==="flip"?"顛倒":"收斂"; cls = kind==="flip"?"af":"aw";
    const combo=(sw&&dv)?"both": sw?"swap": dv?"div":"solo";
    B=G[combo]; groupAll=G.all;
    lbl=groupName+(combo==="both"?"＋對調＋背離":combo==="swap"?"＋對調":combo==="div"?"＋背離":"");
  } else {
    cls="as"; groupName="對調";
    B = dv?ct.other.bothOD:ct.other.swapOnly;
    lbl = dv?"對調＋背離":"對調"; groupAll=null;
  }
  if(!B||!B.n) return null;
  let tip=`${lbl}場歷史（WNBA+NBA ${B.n} 場）
讓分過盤 ${pc(B.cov,B.covN)}・熱門勝 ${pc(B.fw,B.fwN)}・開大 ${pc(B.ov,B.ovN)}`;
  if(groupAll&&groupAll.n) tip+=`
${groupName}全部：讓過 ${pc(groupAll.cov,groupAll.covN)}（${groupAll.n}場）`;
  return { lbl, cls, covTxt:pc(B.cov,B.covN), n:B.n, tip };
}

  });
  const cnt = document.createElement("span"); cnt.className="count";
  cnt.textContent = (tab==="重") ? `${strong.length} 強訊號` : `今日 ${zhan.any} 注`;

  mn.style.cssText="cursor:pointer;margin-left:6px;font-size:15px;line-height:1;color:#9fb6c9;";
  head.append(dot, tabsWrap, cnt, mn);
  mn.addEventListener("pointerdown",(e)=>e.stopPropagation());
  mn.addEventListener("click",(e)=>{ e.stopPropagation(); doc.summaryMin=true; saveDoc(doc); render(); });
  // 拖曳移動（棒球操作）
  head.addEventListener("pointerdown",(e)=>{
    if(e.target!==head && e.target!==dot && e.target!==cnt) return;
    const r=box.getBoundingClientRect(); const dx=e.clientX-r.left, dy=e.clientY-r.top;
    const mv=(ev)=>{ box.style.left=(ev.clientX-dx)+"px"; box.style.top=(ev.clientY-dy)+"px"; box.style.right="auto"; };
    const up=(ev)=>{ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up);
      doc.summaryPos={ l:parseInt(box.style.left,10), t:parseInt(box.style.top,10) }; saveDoc(doc); };
    document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up);
  });

  const body = document.createElement("div"); body.className="sumbody";
  if(tab==="戰"){

                    `<span class="zhit">${mm.hit}</span><span class="zslash">/</span><span class="zmiss">${mm.miss}</span>`+
                    `<span class="zrate">${rate}%</span>`;
      return rr;
    };
    const ACCT_KEY = {"讓分過盤":"讓分","大小過盤":"大小","獨贏命中":"獨贏","🎯 明牌軌":"🎯","⚡ 雙訊號":"⚡","自主注":"注"};
    [["讓分過盤", zhan.hd],["大小過盤", zhan.tot],["獨贏命中", zhan.ml],["🎯 明牌軌", zhan.ep],["⚡ 雙訊號", zhan.dual],["自主注", zhan.bet]].forEach(([lab,mm])=>{
      const rr=rowFor(lab,mm); if(!rr) return;

      if(!mine.length) return;
      rr.classList.add("zhas"); rr.title="點擊展開場次明細";
      rr.addEventListener("click",(e)=>{ e.stopPropagation(); doc.zhanOpen=(doc.zhanOpen===key?null:key); saveDoc(doc); render(); });
      if(doc.zhanOpen===key){
        rr.classList.add("zon");
        const dt=document.createElement("div"); dt.className="zhandetail";
        const lgs = LG_ORDER.filter(k=>mine.some(e=>e.lg===k));
        const multi = lgs.length>1;
        lgs.forEach(k=>{
          if(multi){ const hh=document.createElement("div"); hh.className="zdlg"; hh.textContent=LG_LABEL[k]||k; dt.appendChild(hh); }

            const d=document.createElement("div"); d.className="zdrow";
            d.innerHTML = `<span class="zmk ${en.hit?"ok":"no"}">${en.hit?"✓":"✗"}</span>`+
                          `<span class="zm">${esc(en.m)}</span><span class="zp">${esc(en.label)}</span>`;
            d.title="跳到該場卡片";
            d.addEventListener("click",(e)=>{ e.stopPropagation(); jumpToCard(en.itId); });

          });
        });
        body.appendChild(dt);
      }
    });
    if(!body.children.length){ const e=document.createElement("div"); e.className="zhanempty"; e.textContent="今天還沒有已結算的手動燈（≥3）、明牌軌或注章選項。"; body.appendChild(e); }
  } else {
    if(strong.length){
      const t = document.createElement("div"); t.className="sumsec"; t.textContent="強訊號（手動 ≥3 燈 ∪ 🎯明牌共識）";
      body.appendChild(t);
      const byGame = new Map();
      strong.forEach(s=>{ if(!byGame.has(s.matchName)) byGame.set(s.matchName, []); byGame.get(s.matchName).push(s); });
      const games = [...byGame.values()].sort((a,b)=> Math.max(...b.map(x=>x.n)) - Math.max(...a.map(x=>x.n)));
      games.forEach(sigs=>{
        const rr = document.createElement("div"); rr.className="sumgrow";
        const picksHtml = sigs.slice().sort((a,b)=>((b.dual?1:0)-(a.dual?1:0))||b.n-a.n).map(s=>{
          const nCls = s.n>=6 ? "n6" : s.n===5 ? "n5" : s.n===4 ? "n4" : "n3";
          const tag = s.dual ? "⚡" : (s.ep ? "🎯" : "");
          const tip = s.dual ? `雙訊號：手動 ${s.n} 燈＋明牌加權 ${s.epW}（${s.np} 人）` : (s.ep ? `明牌加權 ${s.n}（${s.np} 人）` : `${s.n} 燈`);
          return `<span class="sp ${nCls}" title="${tip}">${tag}${esc(s.pick)}<span class="mk">${esc(s.mk)}</span></span>`;
        }).join("");
        rr.innerHTML = `<span class="gmt">${esc(sigs[0].matchName)}</span><span class="gpk">${picksHtml}</span>`;
        body.appendChild(rr);
      });
    }
    if(conflicts.length){
      const cCar = doc.conflictsCollapsed ? "▸" : "▾";
      const t = document.createElement("div"); t.className="sumsec collapsible";
      t.innerHTML = `<span>衝突 / 矛盾</span><span class="seccaret">${cCar}</span>`;
      t.onclick = ()=>{ doc.conflictsCollapsed = !doc.conflictsCollapsed; saveDoc(doc); render(); };
      body.appendChild(t);
      if(!doc.conflictsCollapsed){
        conflicts.forEach(c=>{
          const rr = document.createElement("div"); rr.className="sumrow conflict"+(c.kind==="cross"?" cross":"");
          const desc = c.kind==="ep" ? esc(c.market) : (c.kind==="cross" ? `${esc(c.market)} 矛盾` : `${esc(c.market)} 兩邊都有燈`);
          rr.innerHTML = `<span class="mt">${esc(c.matchName)}</span><span class="pk">${desc}</span><span class="n">⚠</span>`;
          body.appendChild(rr);
        });
      }
    }
    if(!strong.length && !conflicts.length){
      const e = document.createElement("div"); e.className="sumempty"; e.textContent="目前沒有 3 燈以上的強訊號。";
      body.appendChild(e);
    }
  }
  if(doc.summarySize && doc.summarySize.bodyH) body.style.maxHeight = doc.summarySize.bodyH+"px";
  box.appendChild(body);
  const rz = document.createElement("div"); rz.className="sum-resize"; rz.title="拖曳調整大小";
  rz.addEventListener("pointerdown", (e)=>{
    e.preventDefault(); e.stopPropagation();
    const r0=box.getBoundingClientRect(), b0=body.getBoundingClientRect();
    const x0=e.clientX, y0=e.clientY, w0=r0.width, h0=b0.height;
    const mv=(ev)=>{ const w=Math.max(240, w0+(ev.clientX-x0)), h=Math.max(120, h0+(ev.clientY-y0));
      box.style.width=w+"px"; body.style.maxHeight=h+"px"; };
    const up=(ev)=>{ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up);
      doc.summarySize={ w:parseInt(box.style.width,10), bodyH:parseInt(body.style.maxHeight,10) }; saveDoc(doc); };
    document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up);
  });
  box.appendChild(rz);
  host.appendChild(box);
}

// ===== 對戰導覽列（棒球版移植） =====
let _navDrag=null;
function navMatchState(m, it){
  if(it.platformFlip) return "st-flip";                  // 仍顛倒(紫)
  if(it.flipVanished) return "st-flip-was";              // 曾顛倒已收斂(靛藍)
  if(it.preGameSwap) return "st-swap";                   // 賽前對調(青綠)
  if(it.settled || m.status==="finished") return "st-full";   // 已結算(綠)
  // 黃色＝「使用者自己填了幾組賠率」（棒球同義:開盤/下注/收盤三組）——
  // 管線有台彩線不算「填過賠率」（2026-08-03 使用者指正:賠率尚未填寫卻呈金色）
  let c=0;
  if(it.openOddsAway!=null && it.openOddsHome!=null) c++;
  if(it.flipOddsAway!=null && it.flipOddsHome!=null) c++;
  if(it.closeOddsAway!=null && it.closeOddsHome!=null) c++;
  return c<=0 ? "st-empty" : ("st-odds"+c);
}
// 棒球 index.html layoutRightColumns() 原樣移植（2026-08-03：先前自寫版本 top 寫死 74px、
// 面板高度隨內容＝與棒球不同,使用者三度指正）。常數與行為全部照抄：
//   top = 日期列底部 + 8（動態,不寫死）；NAVW 256 / GAP 20 / PGAP 14 / EDGE 14
//   導覽列 maxHeight = 視窗高 − top − 16；總結面板 top→bottom:14 撐滿、sumbody 內捲
// 上緣＝日期列底部 + 卡片區的 padding-top ＝ 與第一張卡片頂端切齊
// （2026-08-03 使用者：「沒有與比賽卡片對齊」；棒球用 +8 是因其卡片容器另有內距,對齊結果相同）
function summaryTopPad(){
  const d = document.querySelector("#datebar") || document.querySelector("header");
  const b = d ? d.getBoundingClientRect().bottom : 60;
  const main = document.getElementById("board");
  const pad = main ? (parseInt(getComputedStyle(main).paddingTop, 10) || 22) : 22;
  return Math.round(b) + pad;
}
function layoutRightColumns(){
  const nav = document.getElementById("matchnav");
  const panel = document.getElementById("summary");
  if(window.innerWidth < 1180) return;
  const firstCard = document.querySelector("#board .card.bcard");
  const cardRight = firstCard ? Math.round(firstCard.getBoundingClientRect().right) : 900;
  const top = summaryTopPad();
  const NAVW = 256, GAP = 20, PGAP = 14, EDGE = 14;
  let navRightEdge = cardRight + GAP;
  if(nav && nav.style.display !== "none"){
    nav.style.left = (cardRight + GAP) + "px"; nav.style.right = "auto";
    nav.style.top = top + "px"; nav.style.bottom = "auto";
    nav.style.maxHeight = (window.innerHeight - top - 16) + "px";
    navRightEdge = cardRight + GAP + (nav.offsetWidth || NAVW);
  } else { navRightEdge = cardRight; }
  if(panel){
    panel.style.left = (navRightEdge + PGAP) + "px";
    panel.style.right = EDGE + "px"; panel.style.width = "auto";
    panel.style.top = top + "px"; panel.style.bottom = EDGE + "px";
    panel.style.display = "flex"; panel.style.flexDirection = "column";
    const body = panel.querySelector(".sumbody");
    if(body){ body.style.maxHeight = "none"; body.style.flex = "1 1 auto"; body.style.minHeight = "0"; body.style.overflowY = "auto"; }
  }
}
window.addEventListener("resize", ()=>{ clearTimeout(window.__lrcT); window.__lrcT=setTimeout(layoutRightColumns, 150); });
function renderMatchNav(){
  const el = document.getElementById("matchnav"); if(!el) return;
  if(document.querySelector("#statspage.show, #reviewpage.show")){ el.style.display="none"; return; }

  const prevBody = el.querySelector(".nvbody");
