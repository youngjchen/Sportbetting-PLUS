<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>籃球排盤板</title>
<!-- 籃球頁（NBA＋WNBA 雙聯盟,WNBA_PLAN.md D8）。
     卡片=棒球板 bcard 1:1 移植（2026-08-03 使用者指令「排版跟所有操作都要跟棒球的一樣」）：
     CSS/欄位網格/燈號操作(左+右−長按清零/點隊名−1)/⇄換讓分方/收合刪除/賽前✓/ⓘ近況/明牌◉欄/基準輸入/衝突框色/結算pills。
     籃球差異僅：節數表在中央 VS 位（2026-07 DEMO v2 核准位）、無投手與模型%列。
     隊伍統計=doc.games 推導引擎(快取鍵帶聯盟防撞名)。localStorage sportbetting_nba_doc_v1 與棒球板隔離。-->
<style>
  :root{
    /* 棒球板同款調色盤（bcard CSS 原樣移植的前提） */
    --bg:#0c0f14; --panel:#151a22; --panel-2:#1b222c; --line:#2a3340;
    --ink:#e9eef5; --ink-dim:#8a96a6;
    --lit:#ffb02e; --lit-glow:rgba(255,176,46,.55);
    --hot:#ff7a1a; --hot-glow:rgba(255,110,20,.6);
    --conflict:#ff3b5c; --cross:#b56bff; --danger:#ff5b6e;
    --nba:#e56020; --wnba:#ff9d3c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
  .logo .dot{width:12px;height:12px;border-radius:50%;background:var(--nba)}
  .swpill{display:inline-flex;align-items:center;gap:5px;margin:0 4px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-dim);text-decoration:none;white-space:nowrap}
  .lgchip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:14px;font-weight:700;cursor:pointer;color:var(--ink-dim)}
  .lgchip .lgdot{width:8px;height:8px;border-radius:50%}
  .lgchip.on{color:var(--ink);border-color:var(--lit);background:rgba(255,176,46,.08)}
  .hbtn{padding:5px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer}
  .stamp{margin-left:auto;color:var(--ink-dim);font-size:12.5px}
  .datebar{display:flex;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto}
  .datebar .lab{color:var(--ink-dim);font-size:13px;margin-right:4px}
  .dbtn{padding:5px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .dbtn.on{background:var(--lit);color:#151006;border-color:var(--lit)}
  main{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 16px 60px}
  .empty{max-width:640px;text-align:center;color:var(--ink-dim);font-size:14px;line-height:2;border:1px dashed var(--line);border-radius:14px;padding:26px 22px}
  .empty b{color:var(--ink)}

  /* ============ 棒球 bcard 移植（index.html 1278-1412 原樣;canvas 專屬碼移除） ============ */
  .card.bcard{
    width:100%; max-width:960px; overflow:visible;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line); border-radius:16px;
    box-shadow:0 10px 26px rgba(0,0,0,.45);
  }
  .card.bcard.has-strong{ border-color:rgba(255,176,46,.55); box-shadow:0 0 0 1px rgba(255,176,46,.22),0 10px 26px rgba(0,0,0,.5); }
  .card.bcard.has-conflict{ border-color:var(--conflict); }
  .card.bcard.has-cross{ border-color:var(--cross); }
  .bhead{ display:flex; align-items:center; gap:8px; padding:11px 16px 9px; border-bottom:1px solid rgba(255,255,255,.06); flex-wrap:wrap; }
  .btime{ font-family:"Oswald",monospace; font-size:13px; letter-spacing:.04em; color:var(--ink-dim); }
  .bhead-sp{ flex:1 1 auto; }
  .bbadge{
    font-family:"Noto Sans TC"; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
    color:#ffb24d; background:rgba(255,150,40,.10); border:1px solid rgba(255,150,40,.5);
    border-radius:8px; padding:4px 10px; transition:.12s;
  }
  .bbadge:hover{ background:rgba(255,150,40,.22); }
  .bbadge.done{ color:#2ee07f; background:rgba(40,199,111,.10); border-color:rgba(40,199,111,.5); }
  .bbadge.ppd{ color:#ffb0a6; background:rgba(255,107,107,.10); border-color:rgba(255,107,107,.45); cursor:default; }
  .bico{ width:26px; height:26px; display:grid; place-items:center; border-radius:7px; cursor:pointer; color:var(--ink-dim); font-size:14px; flex:0 0 auto; }
  .bico:hover{ background:#222a36; color:var(--ink); }
  .bico.bdel:hover{ color:var(--danger); }
  .bflipbanner{ display:flex; align-items:center; gap:8px; padding:7px 16px; background:rgba(160,90,255,.16); border-bottom:1px solid rgba(160,90,255,.45); color:#d9b3ff; font-size:12.5px; font-weight:700; letter-spacing:.02em; }
  .bflipbanner .ic{ font-size:15px; }
  .card.bcard.flip{ border-color:rgba(160,90,255,.6); box-shadow:0 0 0 1px rgba(160,90,255,.3),0 10px 26px rgba(0,0,0,.5); }
  .bflipbanner.swap{ background:rgba(43,191,160,.13); border-bottom-color:rgba(43,191,160,.4); color:#7fe8d4; }
  .card.bcard.flip-swap{ border-color:rgba(43,191,160,.5); box-shadow:0 0 0 1px rgba(43,191,160,.26),0 10px 26px rgba(0,0,0,.5); }
  .bbody{ display:grid; grid-template-columns:212px 1fr; align-items:stretch; }
  .bscore{ display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; gap:4px; padding:16px 14px; border-right:1px solid rgba(255,255,255,.07); text-align:center; }
  .bana{ padding:12px 16px 16px; min-width:0; }
  .bteam{ display:flex; flex-direction:column; align-items:center; gap:3px; width:100%; }
  .bteam-nm{ font-weight:500; font-size:21px; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
  .bteam-sc{ font-family:"Oswald",monospace; font-weight:700; font-size:42px; line-height:1.05; color:var(--lit); }
  .bteam-sc.live{ color:#3ad6a0; }
  .bvs{ font-family:"Oswald",monospace; font-size:12px; letter-spacing:.16em; color:var(--ink-dim); padding:2px 0; }
  .bmid{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:0 0 auto; }
  .bmid-score{ font-family:"Oswald",monospace; font-weight:700; font-size:38px; line-height:1; color:var(--lit); white-space:nowrap; }
  .bmid-score .c{ color:var(--ink-dim); margin:0 4px; }
  .bmid-score.live{ color:#3ad6a0; }
  .blivechip{ font-family:"Oswald",monospace; font-size:11px; font-weight:700; letter-spacing:.05em; padding:2px 8px; border-radius:8px; white-space:nowrap; }
  .blivechip.on{ color:#3ad6a0; background:rgba(58,214,160,.15); border:1px solid rgba(58,214,160,.42); }
  .blivechip.fin{ color:#ffb24d; background:rgba(255,176,46,.14); border:1px solid rgba(255,176,46,.5); animation:blivepulse 1.8s ease-in-out infinite; }
  @keyframes blivepulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
  /* 節數表（籃球專屬,中央 VS 位;2026-07 DEMO v2 核准） */
  .bqs{ border-collapse:collapse; font-size:11px; color:var(--ink-dim); margin-top:5px; font-family:"Oswald",monospace; }
  .bqs th{ font-weight:400; color:#5c6678; padding:1px 5px; }
  .bqs td{ padding:1px 5px; text-align:center; }
  .bqs .side{ color:var(--ink-dim); font-size:10px; }
  .bqs .liveq{ color:#3ad6a0; font-weight:700; }
  .binfo{ display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; border:1px solid var(--ink-dim); color:var(--ink-dim); font-size:11px; font-weight:700; font-family:Georgia,serif; font-style:italic; cursor:pointer; flex:0 0 auto; user-select:none; }
  .binfo:hover{ border-color:var(--lit); color:var(--lit); }
  .bpop{ position:fixed; z-index:6000; min-width:210px; max-width:320px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 34px rgba(0,0,0,.6); padding:11px 13px; font-size:12px; line-height:1.75; color:var(--ink); }
  .bpop .ph{ font-family:"Oswald",monospace; font-size:10px; letter-spacing:.08em; color:var(--ink-dim); margin-bottom:5px; }
  .bpop .boxes{ display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
  .bpop .bx{ width:18px; height:18px; border-radius:5px; display:grid; place-items:center; font-size:10px; font-weight:700; font-family:"Oswald",monospace; }
  .bpop .bx.w{ background:rgba(40,199,111,.16); color:#2ee07f; border:1px solid rgba(40,199,111,.45); }
  .bpop .bx.l{ background:rgba(255,92,92,.10); color:#ff7a7a; border:1px solid rgba(255,92,92,.4); }
  .bpop .bx.t{ background:rgba(255,255,255,.05); color:#8a97a8; border:1px solid var(--line); }
  .bana-head{ display:flex; align-items:center; gap:8px; padding:0 0 8px; }
  .bana-lbl{ font-family:"Oswald",monospace; font-size:11px; letter-spacing:.1em; color:var(--ink-dim); }
  .bvenue{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .bvenue button{ font-size:11px; padding:3px 11px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer; font-family:"Noto Sans TC"; }
  .bvenue button.on{ background:#28c76f; color:#06210f; font-weight:700; }
  .bmkt-sec{ display:flex; align-items:center; gap:8px; padding:8px 0 4px; font-family:"Oswald",monospace; font-size:11px; letter-spacing:.1em; color:var(--ink-dim); border-top:1px solid rgba(255,255,255,.06); }
  .bmkt:first-of-type .bmkt-sec{ border-top:none; }
  .bmkt-sec .mname{ color:#cdd8e6; font-size:12.5px; letter-spacing:.06em; flex:0 0 auto; font-family:"Noto Sans TC"; font-weight:700; }
  .bmkt-sec.conflict .mname{ color:var(--conflict); }
  .bmkt-sec .bswap{ cursor:pointer; color:#ff9f43; font-size:15px; line-height:1; }
  .bmkt-sec .basis{ display:inline-flex; align-items:center; gap:4px; font-size:11px; letter-spacing:0; color:var(--ink-dim); font-family:"Noto Sans TC"; }
  .bmkt-sec .basis input{ width:58px; background:#0c0f14; border:1px solid var(--line); border-radius:6px; color:var(--ink); font-size:13px; font-weight:700; text-align:center; padding:3px 2px; font-family:"Oswald",monospace; outline:none; }
  .bmkt-sec .basis input:focus{ border-color:var(--lit); }
  .bmkt-sec .mksp{ flex:1 1 auto; }
  .bmkt-sec .bcmt{ font-size:11.5px; letter-spacing:0; color:#9fb0c4; white-space:nowrap; font-family:"Noto Sans TC"; text-align:right; }
  .bmkt-sec .bcmt .l{ color:var(--ink-dim); font-family:"Oswald",monospace; font-size:10px; letter-spacing:.05em; margin-right:3px; }
  .bmkt-sec .bcmt .tm{ color:#9bd5ff; font-weight:600; }
  .bmkt-sec .bcmt.strong .tm{ color:#ffd27f; }
  /* 六欄網格：badge｜選項名｜燈號｜明牌◉(64px)｜注(24px)｜%(48px) —— 棒球 v2.2 定案欄距 */
  .bmkt-row{ display:grid; grid-template-columns:28px minmax(88px,126px) max-content 64px 24px 48px; align-items:center; column-gap:8px; padding:6px 0; }
  .bmkt-row .bside{ font-family:"Oswald",monospace; font-size:11px; color:#0c0f14; background:var(--ink-dim); border-radius:5px; padding:3px 0; width:100%; text-align:center; font-weight:700; justify-self:stretch; }
  .bmkt-row .bside.give{ background:var(--lit); }
  .bmkt-row .bside.recv{ background:#5b6b80; color:#dfe6ef; }
  .bmkt-row .bnm{ font-weight:700; font-size:17px; color:var(--ink); cursor:default; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
  .bmkt-row .bnm .hv{ color:var(--ink-dim); font-family:"Oswald",monospace; font-weight:700; margin-left:4px; }
  .bmkt-row.conflict .bnm{ color:var(--conflict); }
  .blights{ display:flex; align-items:center; gap:7px; cursor:pointer; justify-self:start; padding:3px 0; }
  .blights .lt{ width:19px; height:19px; border-radius:50%; flex:0 0 auto; cursor:pointer; transition:.1s; }
  .blights .lt.off{ border:1.5px solid #44556a; background:transparent; }
  .blights .lt.amber{ background:radial-gradient(circle at 35% 30%, #ffe39a, var(--lit) 70%); box-shadow:0 0 8px var(--lit-glow); }
  .blights .lt.red{ background:radial-gradient(circle at 35% 30%, #ffc2a0, var(--hot) 72%); box-shadow:0 0 9px var(--hot-glow); }
  .blights .lt.purple{ background:radial-gradient(circle at 35% 30%, #e6c2ff, #a05aff 72%); box-shadow:0 0 9px rgba(160,90,255,.55); }
  .ep-cell{ width:64px; display:flex; justify-content:flex-start; align-items:center; }
  .ep-cell .ep-n{ display:inline-flex; align-items:center; gap:4px; font-family:"Oswald",monospace; font-weight:700; font-size:12.5px; line-height:1; letter-spacing:.02em; color:#ffcf8a; background:rgba(255,176,46,.10); border:1px solid rgba(255,176,46,.42); border-radius:999px; padding:3px 8px; cursor:pointer; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ep-cell .ep-n::before{ content:""; width:10px; height:10px; border-radius:50%; flex:0 0 auto; background:radial-gradient(circle,#ffd88a 0 2px,rgba(255,176,46,.15) 2px 3.2px,rgba(255,176,46,.95) 3.2px 4.6px,transparent 4.6px); }
  .betchip{ font-size:11px; border:1.5px dashed #4a5a70; border-radius:6px; color:var(--ink-dim); cursor:pointer; user-select:none; width:26px; text-align:center; line-height:1.55; justify-self:center; padding:1px 0; }
  .betchip.on{ border:1.5px solid var(--lit); color:#1a1205; font-weight:700; background:var(--lit); box-shadow:0 0 8px var(--lit-glow); }
  .bmkt-row .bcover{ font-family:"Oswald",monospace; font-weight:700; font-size:15px; color:#aeb9c8; justify-self:end; white-space:nowrap; }
  .bmkt-row .bcover.hi{ color:#28c76f; } .bmkt-row .bcover.lo{ color:var(--conflict); } .bmkt-row .bcover.ls{ color:#5b6b80; }
  .bmkt-row .bcover .ss{ font-size:9px; color:#5b6b80; }
  .intl-strip{ display:flex; align-items:center; gap:8px; background:rgba(58,160,255,.07); border:1px solid rgba(58,160,255,.3); border-radius:8px; padding:6px 10px; margin:8px 6px 2px; font-size:13px; cursor:pointer; line-height:1.6; }
  .intl-more{ display:none; color:var(--ink-dim); font-size:12.5px; padding:5px 12px 2px; line-height:1.8; }
  .intl-strip.open + .intl-more{ display:block; }
  .bsettled{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px 12px; border-top:1px solid rgba(255,255,255,.06); }
  .bpill{ font-size:12px; font-weight:700; padding:3px 9px; border-radius:7px; border:1px solid var(--line); color:var(--ink-dim); }
  .bpill.hit{ color:#2ee07f; border-color:rgba(40,199,111,.5); background:rgba(40,199,111,.08); }
  .bpill.miss{ color:#ff6b6b; border-color:rgba(255,59,92,.5); background:rgba(255,59,92,.08); }
  .bpill.void{ color:#9fb0c4; }
  .bpill.sc{ color:var(--ink); border-color:var(--lit); background:rgba(255,176,46,.06); }
  @media (min-width:1180px){ .card.bcard{ max-width:672px; zoom:1.4; } }
  @media (min-width:900px) and (max-width:1179px){ .card.bcard{ zoom:1.2; } }
  @media (max-width:680px){
    .bbody{ grid-template-columns:1fr; }
    .bscore{ flex-direction:row; justify-content:space-between; border-right:none; border-bottom:1px solid rgba(255,255,255,.07); padding:12px 14px; }
    .bteam{ width:auto; }
  }
  /* ===== 結算視窗（手動覆蓋） ===== */
  #settleModal{ position:fixed; inset:0; z-index:200; background:rgba(5,8,14,.72); display:none; align-items:center; justify-content:center; padding:14px; }
  #settleModal.show{ display:flex; }
  #settleModal .box{ width:min(380px,94vw); background:var(--panel); border:1px solid var(--lit); border-radius:14px; padding:16px 18px; }
  #settleModal h3{ font-size:15.5px; margin-bottom:10px; }
  #settleModal .row{ display:flex; align-items:center; gap:8px; margin:8px 0; font-size:13.5px; }
  #settleModal .row label{ flex:0 0 84px; color:var(--ink-dim); }
  #settleModal input, #settleModal select{ background:#0c0f14; border:1px solid var(--line); border-radius:7px; color:var(--ink); font-size:14px; padding:5px 8px; width:100px; font-family:"Oswald",monospace; }
  #settleModal .btns{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  /* ===== 明牌面板 ===== */
  #eppanel{position:fixed;inset:0;z-index:170;background:rgba(5,8,14,.72);display:none;align-items:flex-start;justify-content:center;padding:6vh 12px}
  #eppanel.show{display:flex}
  .epbox{width:min(460px,92vw);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--lit);border-radius:14px;padding:14px 16px}
  .epbox h3{font-size:15.5px;margin-bottom:4px}
  .epbox .epupd{font-size:11.5px;color:var(--ink-dim);margin-bottom:8px}
  .epgrp{margin:10px 0 4px;font-weight:800;font-size:14px;color:var(--lit)}
  .eprow{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13.5px}
  .eprow .nick{font-weight:700}
  .eprow .wp{color:#2ee07f;font-weight:700}
  .eprow .lbl{font-size:11px;color:var(--ink-dim);border:1px solid var(--line);border-radius:5px;padding:0 5px}
  .eprow .res-hit{color:#2ee07f} .eprow .res-miss{color:#ff6b6b}
  .epclose{float:right;cursor:pointer;color:var(--ink-dim);font-size:16px;padding:0 4px}
  /* ===== 隊伍統計頁（棒球版型移植,前輪已驗收） ===== */
  #statspage{position:fixed;inset:0;z-index:160;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
  #statspage.show{display:flex}
  .stats-toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);flex-wrap:wrap}
  .stats-toolbar .title{font-weight:700;font-size:16px;margin-right:6px}
  .stats-toolbar select{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
  .stats-toolbar .closebtn{margin-left:auto}
  .stats-body{flex:1 1 auto;overflow:auto;padding:12px}
  .stats-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;color:var(--ink)}
  .stats-table th,.stats-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  .stats-table th{color:var(--ink-dim);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;background:var(--panel);z-index:2}
  .stats-table th.group{border-left:1px solid var(--line);background:var(--panel-2)}
  .stats-table th.sortable{user-select:none;cursor:pointer}
  .stats-table th.sortable:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  .stats-table td.group{border-left:1px solid var(--line)}
  .stats-table td.team{text-align:left;font-weight:700;font-size:14px}
  .stats-table tr:hover td{background:rgba(255,255,255,.02)}
  .statcell{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border-radius:6px;padding:4px 6px}
  .statcell .wl{font-family:"Oswald",monospace;font-size:13px;font-weight:600}
  .statcell .spct{font-size:11px;color:var(--ink-dim)}
  .statcell.empty .wl{color:#3a4756}
  .statcell.empty .spct{visibility:hidden}
  .pcthi{color:#28c76f}
  .pctlo{color:#ff3b5c}
  .stats-team{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .stats-team .tname{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .stats-team .tname .swatch{width:8px;height:8px;border-radius:50%}

<script>
"use strict";
// ===== 文檔（與棒球板完全隔離的命名空間）=====
const DOC_KEY = "sportbetting_nba_doc_v1";
function loadDoc(){ try{ return JSON.parse(localStorage.getItem(DOC_KEY)) || null; }catch(e){ return null; } }
function saveDoc(d){ localStorage.setItem(DOC_KEY, JSON.stringify(d)); }
let doc = loadDoc() || { v:1, activeDate: today(), boards:{} };
if(!doc.games) doc.games = [];
if(!doc.activeLeague) doc.activeLeague = "WNBA";
if(!doc.covMode) doc.covMode = "venue";   // venue=主客 / all=綜（棒球 venueMode split/combined 同義）
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const esc = (s)=> String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (sel)=> document.querySelector(sel);
function fmtDate(d){ const p=d.split("-"); return `${parseInt(p[1])}/${parseInt(p[2])}`; }
const SAMPLE_MIN = 8;   // WNBA 半季 44 場、主客拆分樣本天然小,門檻自棒球 15 降為 8（樣本數照樣印出）

// ===== 聯盟 =====
const LEAGUES = {
  NBA:  { name:"NBA",  colorHex:"#e56020", teams:["老鷹","塞爾提克","籃網","黃蜂","公牛","騎士","獨行俠","金塊","活塞","勇士","火箭","溜馬","快艇","湖人","灰熊","熱火","公鹿","灰狼","鵜鶘","尼克","雷霆","魔術","76人","太陽","拓荒者","國王","馬刺","暴龍","爵士","巫師"] },
  WNBA: { name:"WNBA", colorHex:"#ff9d3c", teams:["王牌","自由","山貓","狂熱","風暴","水星","金州","太陽","飛翼","神秘","美夢","天空","火花","節奏","火焰"] }
};

// ============================================================
// GAMES — 統計唯一真相源（棒球板引擎移植;快取鍵帶聯盟防撞名 NBA太陽 vs WNBA太陽）
// doc.games = [{sid,date,league,awayTeam,homeTeam,awayScore,homeScore,hdFav,hdVal,totBasis,mlOffered,manual?}]
// ============================================================
function seasonOf(dateStr){ return (dateStr && /^\d{4}/.test(dateStr)) ? dateStr.slice(0,4) : String(new Date().getFullYear()); }
function emptyTeamRow(){
  return {
    ml:   { home:{w:0,l:0,t:0}, away:{w:0,l:0,t:0} },
    hd:   { home:{w:0,l:0},     away:{w:0,l:0}     },
    recv: { home:{w:0,l:0},     away:{w:0,l:0}     },
    tot:  { home:{w:0,l:0},     away:{w:0,l:0}     }
  };
}
let _statsCache = { version:-1, byKey:{} };
function bumpGamesVersion(){
  doc.gamesVersion = (doc.gamesVersion||0) + 1;
  _statsCache = { version:-1, byKey:{} };
}
function _gameResultFor(team, g){
  if(g.awayTeam!==team && g.homeTeam!==team) return null;
  const isAway = g.awayTeam===team;
  const venue = isAway ? "away" : "home";
  const teamScore = isAway ? g.awayScore : g.homeScore;
  const oppScore  = isAway ? g.homeScore : g.awayScore;
  const out = { venue };
  if(teamScore!=null && oppScore!=null && g.mlOffered!==false){
    if(teamScore === oppScore) out.ml = "t";
    else out.ml = (teamScore-oppScore)>0 ? "w" : "l";
  }
  if(g.hdFav && g.hdVal!=null && teamScore!=null && oppScore!=null){
    const favTeam = g.hdFav==="away" ? g.awayTeam : g.homeTeam;
    const isFav = favTeam === team;
    const favScore = isFav ? teamScore : oppScore;
    const undScore = isFav ? oppScore : teamScore;
    const diff = (favScore - undScore) - g.hdVal;
    if(diff !== 0){
      const favCovered = diff > 0;
      if(isFav) out.hd = favCovered ? "w" : "l";
      else      out.recv = favCovered ? "l" : "w";
    }
  }
  if(g.totBasis!=null && teamScore!=null && oppScore!=null){
    const tot = teamScore + oppScore;
    if(tot !== g.totBasis) out.tot = (tot > g.totBasis) ? "w" : "l";
  }
  return out;
}
function _rebuildTeamCache(league, team){
  const bySeason = {};
  for(const g of (doc.games||[])){
    if(g.league!==league) continue;
    if(g.awayTeam!==team && g.homeTeam!==team) continue;
    if(g.awayScore==null || g.homeScore==null) continue;
    const season = seasonOf(g.date);
    if(!bySeason[season]) bySeason[season] = emptyTeamRow();
    const row = bySeason[season];
    const r = _gameResultFor(team, g);
    if(!r) continue;
    if(r.ml === "w") row.ml[r.venue].w++;
    else if(r.ml === "l") row.ml[r.venue].l++;
    else if(r.ml === "t") row.ml[r.venue].t++;
    if(r.hd === "w") row.hd[r.venue].w++;
    else if(r.hd === "l") row.hd[r.venue].l++;
    if(r.recv === "w") row.recv[r.venue].w++;
    else if(r.recv === "l") row.recv[r.venue].l++;
    if(r.tot === "w") row.tot[r.venue].w++;
    else if(r.tot === "l") row.tot[r.venue].l++;
  }
  _statsCache.byKey[league+"|"+team] = bySeason;
}
function _getTeamSeasonRow(league, season, team){
  if(_statsCache.version !== (doc.gamesVersion||0)) _statsCache = { version:(doc.gamesVersion||0), byKey:{} };
  const k = league+"|"+team;
  if(!_statsCache.byKey[k]) _rebuildTeamCache(league, team);
  return (_statsCache.byKey[k] && _statsCache.byKey[k][season]) || emptyTeamRow();
}
function statRead(league, season, team, market, venue){
  const row = _getTeamSeasonRow(league, season, team)[market];
  if(venue) return {...row[venue], t:row[venue].t||0};
  const h=row.home, a=row.away;
  return { w:(h.w||0)+(a.w||0), l:(h.l||0)+(a.l||0), t:(h.t||0)+(a.t||0) };
}
function pctStr(rec){ const d=(rec.w||0)+(rec.l||0); return d===0 ? null : Math.round((rec.w/d)*100)+"%"; }
function pctNum(rec){ const d=(rec.w||0)+(rec.l||0); return d===0 ? null : rec.w/d; }
function runsRead(league, season, team, venue){
  let scored=0, conceded=0, games=0;
  for(const g of (doc.games||[])){
    if(g.league!==league) continue;
    if(g.awayTeam!==team && g.homeTeam!==team) continue;
    if(seasonOf(g.date) !== season) continue;
    if(g.awayScore==null || g.homeScore==null) continue;
    const isAway = g.awayTeam===team;
    if(venue==="home" && isAway) continue;
    if(venue==="away" && !isAway) continue;
    scored += isAway ? g.awayScore : g.homeScore;
    conceded += isAway ? g.homeScore : g.awayScore;
    games++;
  }
  return { scored, conceded, games };
}
function streakRead(league, season, team, venue){
  const list = (doc.games||[]).filter(g=>{
    if(g.league!==league) return false;
    if(g.awayTeam!==team && g.homeTeam!==team) return false;
    if(seasonOf(g.date) !== season) return false;
    if(g.awayScore==null || g.homeScore==null) return false;
    if(venue){
      const isAway = g.awayTeam===team;
      if(venue==="home" && isAway) return false;
      if(venue==="away" && !isAway) return false;
    }
    return true;
  }).sort((a,b)=> a.date < b.date ? 1 : -1);
  let kind = "", n = 0;
  for(let i=0;i<list.length;i++){
    const won = ((list[i].awayTeam===team ? list[i].awayScore : list[i].homeScore) >
                 (list[i].awayTeam===team ? list[i].homeScore : list[i].awayScore));
    if(i===0){ kind = won?"W":"L"; n=1; continue; }
    if((won && kind==="W") || (!won && kind==="L")) n++;
    else break;
  }
  return { n, kind };
}
function streakStr(s){ return (!s || s.n===0) ? "—" : `${s.n}${s.kind}`; }
function recentResults(league, season, team, n){
  const list = (doc.games||[]).filter(g=>{
    if(g.league!==league) return false;
    if(g.awayTeam!==team && g.homeTeam!==team) return false;
    if(seasonOf(g.date) !== season) return false;
    if(g.awayScore==null || g.homeScore==null) return false;
    return true;
  }).sort((a,b)=> a.date < b.date ? 1 : -1).slice(0, n).reverse();
  return list.map(g=>{
    const isAway = g.awayTeam===team;
    const my = isAway?g.awayScore:g.homeScore, op = isAway?g.homeScore:g.awayScore;
    return { r: my>op?"w":(my<op?"l":"t"), date:g.date, opp:isAway?g.homeTeam:g.awayTeam, my, op, venue:isAway?"away":"home" };
  });
}
function gameUpsert(g){
  if(!doc.games) doc.games = [];
  let idx = g.sid ? doc.games.findIndex(x => x.sid === g.sid) : -1;
  if(idx<0) idx = doc.games.findIndex(x => x.date===g.date && x.league===g.league && x.awayTeam===g.awayTeam && x.homeTeam===g.homeTeam);
  if(idx<0) doc.games.push(g); else doc.games[idx] = g;
}
function gameFind(sid, date, league, away, home){
  return (doc.games||[]).find(x => x.sid===sid || (x.date===date && x.league===league && x.awayTeam===away && x.homeTeam===home)) || null;
}

// ===== WNBA 種子載入 =====
async function loadSeedGames(){
  try{
    const r = await fetch(`data/wnba_games.json?t=${Date.now()}`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    if(!j || !Array.isArray(j.games)) throw new Error("格式不符");
    for(const g of j.games){
      const old = gameFind(g.sid, g.date, "WNBA", g.awayTeam, g.homeTeam);
      if(old && old.manual) continue;                    // 手動覆蓋優先
      gameUpsert(g);
    }
    bumpGamesVersion(); saveDoc(doc);
    const el = $("#stamp"); if(el) el.textContent = `WNBA 數據 ${j.count} 場 · ${String(j.builtAt||"").slice(0,10)}`;
    if($("#statspage").classList.contains("show")) renderStatsPage();
    render();
  }catch(e){
    const el = $("#stamp"); if(el) el.textContent = `種子載入失敗(${e.message}) · 用本機快取`;
  }
}

// ===== 每日管線載入 =====
let pregameCache = { updated:null, games:[] };
let oddsCache = { updated:null, games:{} };
let seriesCache = {};
let epCache = { updated:null, picks:[] };
async function loadPregame(){
  try{
    const r = await fetch(`data/wnba_pregame.json?t=${Date.now()}`);
    if(r.ok){ const j = await r.json(); if(j && Array.isArray(j.games)){ pregameCache = j; autoSettleFromPregame(); render(); } }
  }catch(e){}
  try{
    const r2 = await fetch(`data/wnba_odds_log.json?t=${Date.now()}`);
    if(r2.ok){ const j2 = await r2.json(); if(j2 && j2.games){ oddsCache = j2; render(); } }
  }catch(e){}
  try{
    const r3 = await fetch(`data/wnba_lottery_series.json?t=${Date.now()}`);
    if(r3.ok){ const j3 = await r3.json(); if(j3 && typeof j3==="object"){ seriesCache = j3; } }
  }catch(e){}
  try{
    const r4 = await fetch(`data/expert_picks_wnba.json?t=${Date.now()}`);
    if(r4.ok){ const j4 = await r4.json(); if(j4 && Array.isArray(j4.picks)){ epCache = j4; render(); } }
  }catch(e){}
}
setInterval(loadPregame, 5*60e3);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ loadPregame(); loadSeedGames(); } });
function autoSettleFromPregame(){
  let changed = false;
  for(const g of pregameCache.games||[]){
    if(g.status!=="finished" || g.awayScore==null || g.homeScore==null) continue;
    const useHd = g.hdSrc==="運彩" && g.hdFav && g.hdVal!=null;
    const rec = { sid:g.officialId, date:g.date, league:"WNBA", awayTeam:g.away, homeTeam:g.home,
      awayScore:g.awayScore, homeScore:g.homeScore,
      hdFav:useHd?g.hdFav:null, hdVal:useHd?g.hdVal:null,
      totBasis:g.totLine!=null?g.totLine:null, mlOffered:g.mlOffered!==false };
    const old = gameFind(rec.sid, rec.date, "WNBA", rec.awayTeam, rec.homeTeam);
    if(old && old.manual) continue;                      // 手動覆蓋不被管線洗掉
    if(old && JSON.stringify(old)===JSON.stringify(rec)) continue;
    gameUpsert(rec); changed = true;
  }
  if(changed){ bumpGamesVersion(); saveDoc(doc); }
}

// ===== 使用者卡片狀態（棒球 item 同構:每選項 {lights,bet}） =====
const OPT_KEYS = ["mlAway","mlHome","hdGive","hdRecv","over","under"];
function ensureItem(date, id){
  const b = doc.boards[date] = doc.boards[date] || {};
  const items = b.items = b.items || [];
  let it = items.find(x=>x.id===id);
  if(!it){ it = { id, league:"WNBA" }; items.push(it); }
  for(const k of OPT_KEYS){
    if(!it[k] || typeof it[k].lights!=="number"){
      const oldL = (it.L&&it.L[k])||0, oldB = !!(it.bets&&it.bets[k]);
      it[k] = { lights: oldL, bet: oldB };
    }
  }
  delete it.L; delete it.bets;
  return it;
}

// ===== 明牌 =====
function epFor(g){
  return (epCache.picks||[]).filter(p => p.league==="wnba" && p.date===g.date && p.away===g.away && p.home===g.home);
}
// 每列 ◉N：pick → 卡片選項列的歸屬（讓分依 line 正負推讓方;對不上卡片讓方的歸對面列）
function epRowCounts(g, picks, favName, dogName){
  const c = { mlAway:0, mlHome:0, hdGive:0, hdRecv:0, over:0, under:0 };
  for(const p of picks){
    if(p.market==="ml"){ if(p.team===g.away) c.mlAway++; else if(p.team===g.home) c.mlHome++; }
    else if(p.market==="ou"){ if(/大|over/i.test(String(p.side||""))) c.over++; else c.under++; }
    else if(p.market==="hd" && p.team){
      const giveTeam = (p.line!=null && p.line>0) ? (p.team===g.away?g.home:g.away) : p.team;  // 受讓=+線 → 對面讓
      if(giveTeam===favName) c.hdGive++; else c.hdRecv++;
    }
  }
  return c;
}
function openEpPanel(g, picks){
  const box = $("#epbox");
  const MK = { ml:"獨贏", hd:"讓分", ou:"大小" };
  const optLabel = (p)=>{
    if(p.market==="ou") return `${/大|over/i.test(String(p.side||""))?"大":"小"} ${p.line!=null?p.line:""}`;
    const ln = p.line!=null ? (p.line>0?`+${p.line}`:`${p.line}`) : "";
    return `${p.team||p.side||""} ${ln}`.trim();
  };
  const groups = {};
  for(const p of picks){ const k = `${MK[p.market]||p.market}｜${optLabel(p)}`; (groups[k]=groups[k]||[]).push(p); }
  let h = `<span class="epclose" id="epclose">✕</span><h3>🎯 明牌 ${esc(g.away)} @ ${esc(g.home)}</h3>`;
  h += `<div class="epupd">資料 ${esc(String(epCache.updated||"").slice(5,16).replace("T"," "))}</div>`;
  const keys = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  for(const k of keys){
    h += `<div class="epgrp">${esc(k)}（${groups[k].length}）</div>`;
    for(const p of groups[k].sort((a,b)=>b.wp-a.wp)){
      h += `<div class="eprow"><span class="nick">${esc(p.nickname)}</span><span class="wp">${p.wp}%</span>`+
           `<span style="color:var(--ink-dim);font-size:12px">${p.total}注</span>`+
           `${p.main?`<span class="lbl">主推</span>`:""}${p.free?`<span class="lbl">免費</span>`:""}`+
           `<span class="lbl">${esc(p.srcLabel||"")}</span>`+
           `${p.result?`<span class="${/準/.test(p.result)?"res-hit":"res-miss"}">${esc(p.result)}</span>`:""}</div>`;
    }
  }
  box.innerHTML = h;
  $("#eppanel").classList.add("show");
  $("#epclose").onclick = ()=> $("#eppanel").classList.remove("show");
}
document.getElementById("eppanel").addEventListener("click", (e)=>{ if(e.target.id==="eppanel") e.target.classList.remove("show"); });

// ===== 國際軸（titan bet365;rows[0]=最新;負=客讓,稽核實證） =====
function intlFor(g){
  const o = oddsCache.games && oddsCache.games[g.officialId];
  if(!o || !o.hd || !o.hd.length) return null;
  const startKey = (o.startBJ||"").slice(5,16);
  const norm = (t)=>{ const m=/^(\d{1,2})-(\d{1,2})\s+(\d{1,2}:\d{2})$/.exec(t); return m?`${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")} ${m[3].padStart(5,"0")}`:t; };
  const pre = startKey ? o.hd.filter(r=>norm(r.t) < startKey) : o.hd;
  const preOu = (o.ou||[]).filter(r=>!startKey || norm(r.t) < startKey);
  if(!pre.length) return null;
  const latest = pre[0], open = pre[pre.length-1];
  const move = (latest.line!=null && open.line!=null) ? Math.abs(latest.line-open.line) : 0;
  const dir  = (latest.line!=null && open.line!=null) ? (latest.line-open.line) : 0;
  const flips = (()=>{ let n=0; for(let i=1;i<pre.length;i++){ if((pre[i-1].line<0)!==(pre[i].line<0)) n++; } return n; })();
  const ouLatest = preOu.length?preOu[0]:null, ouOpen = preOu.length?preOu[preOu.length-1]:null;
  return { latest, open, move, dir, flips,
    fav: latest.line<0 ? "away" : "home", il: Math.abs(latest.line),
    ouMove: (ouLatest&&ouOpen)? (ouLatest.line-ouOpen.line) : 0 };
}
function lswFor(g){
  const rows = seriesCache[g.officialId] || [];
  let n=0; for(let i=1;i<rows.length;i++){ if(rows[i-1].hdFav && rows[i].hdFav && rows[i-1].hdFav!==rows[i].hdFav) n++; }
  return n;
}

// ===== 過盤率（隊伍統計同源;covMode venue=主客/all=綜） =====
function pctInfo(league, season, team, market, side){
  const venue = doc.covMode==="venue" ? side : null;
  const rec = statRead(league, season, team, market, venue);
  const sample = (rec.w||0)+(rec.l||0);
  if(sample===0) return null;
  const pn = rec.w/sample;
  return { pct: Math.round(pn*100)+"%", pn, sample, lowSample: sample<SAMPLE_MIN,
    cls: pn>=0.55 ? "hi" : (pn<0.40 ? "lo" : "") };
}
function bCoverHTML(info){
  if(!info) return `<span class="bcover ls">—</span>`;
  const cls = info.lowSample ? "ls" : info.cls;
  const ss = info.lowSample ? `<span class="ss">(${info.sample})</span>` : "";
  return `<span class="bcover ${cls}">${info.pct}${ss}</span>`;
}
function _firstEl(htmlStr){ const t=document.createElement("span"); t.innerHTML=htmlStr; return t.firstElementChild || t; }

// ===== 燈號（棒球操作 1:1:左鍵+1、右鍵−1、長按清零;點隊名−1） =====
function bLightSlots(n){
  n = Math.max(0, Math.min(12, n|0));
  const out = [], overflow = Math.max(0, n-5), escN = Math.min(overflow, 5), purple = Math.max(0, n-10);
  for(let i=0;i<5;i++){
    if(n<=5) out.push(i<n ? "amber" : "off");
    else if(i<purple) out.push("purple");
    else if(i<escN) out.push("red");
    else out.push("amber");
  }
  return out;
}
function bLightsEl(obj){
  const wrap = document.createElement("div"); wrap.className="blights"; wrap.title="左鍵＝加燈、右鍵＝減燈（長按整排清零）";
  bLightSlots(obj.lights).forEach(c=>{ const d=document.createElement("div"); d.className="lt "+c; wrap.appendChild(d); });
  let lpTimer=null, lpFired=false;
  wrap.addEventListener("pointerdown", (e)=>{ if(e.button===2) return; lpFired=false; lpTimer=setTimeout(()=>{ lpFired=true; if(obj.lights>0){ obj.lights=0; saveDoc(doc); render(); } }, 550); });
  const cancel=()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } };
  wrap.addEventListener("pointerup", cancel); wrap.addEventListener("pointerleave", cancel); wrap.addEventListener("pointercancel", cancel);
  wrap.addEventListener("click", ()=>{ if(lpFired){ lpFired=false; return; } if(obj.lights<12){ obj.lights++; saveDoc(doc); render(); } });
  wrap.addEventListener("contextmenu", (e)=>{ e.preventDefault(); e.stopPropagation(); if(obj.lights>0){ obj.lights--; saveDoc(doc); render(); } });
  return wrap;
}

// ===== ⓘ 彈窗 =====
let _bpop = null;
function closeBPop(){ if(_bpop){ _bpop.remove(); _bpop=null; } }
document.addEventListener("click", (e)=>{ if(_bpop && !_bpop.contains(e.target) && !(_bpop.__anchor && _bpop.__anchor.contains(e.target))) closeBPop(); }, true);
function bTogglePop(anchorEl, html){
  if(_bpop && _bpop.__anchor===anchorEl){ closeBPop(); return; }
  closeBPop();
  const p = document.createElement("div"); p.className="bpop"; p.innerHTML=html; p.__anchor=anchorEl;
  document.body.appendChild(p);
  const r = anchorEl.getBoundingClientRect();
  const pw = p.offsetWidth, ph = p.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let left = r.left, top = r.bottom + 6;
  if(left + pw > vw - 8) left = vw - 8 - pw;
  if(left < 8) left = 8;
  if(top + ph > vh - 8) top = Math.max(8, r.top - 6 - ph);
  p.style.left = left+"px"; p.style.top = top+"px";
  _bpop = p;
}
function bFormHTML(league, team){
  const season = seasonOf(doc.activeDate);
  let res=[]; try{ res = recentResults(league, season, team, 10) || []; }catch(_){}
  if(!res.length) return `<div class='ph'>近況</div>${esc(team)}：尚無比賽資料`;
  let boxes="";
  res.forEach(e=>{ const c=e.r==="w"?"w":(e.r==="l"?"l":"t"), word=e.r==="w"?"勝":(e.r==="l"?"敗":"和"), md=e.date.slice(5).replace("-","/");
    boxes += `<span class="bx ${c}" title="${md} ${e.venue==="away"?"客":"主"} vs ${esc(e.opp)} ${e.my}:${e.op} ${word}">${c.toUpperCase()}</span>`; });
  return `<div class='ph'>${esc(team)}　近${res.length}場（左舊右新）</div><div class="boxes">${boxes}</div>`;
}

// ===== 結算視窗（手動覆蓋管線） =====
let _smTarget = null;
function openSettleModal(model){
  _smTarget = model;
  $("#smTitle").textContent = `結算：${model.away} @ ${model.home}（${fmtDate(model.date)}）`;
  $("#smAwayLb").textContent = `客 ${model.away}`;
  $("#smHomeLb").textContent = `主 ${model.home}`;
  const rec = gameFind(model.officialId, model.date, model.league, model.away, model.home);
  $("#smAway").value = rec&&rec.awayScore!=null?rec.awayScore:(model.awayScore!=null?model.awayScore:"");
  $("#smHome").value = rec&&rec.homeScore!=null?rec.homeScore:(model.homeScore!=null?model.homeScore:"");
  $("#smFav").value = rec?(rec.hdFav||""):(model.hdFav||"");
  $("#smHd").value = rec&&rec.hdVal!=null?rec.hdVal:(model.hdVal!=null?model.hdVal:"");
  $("#smTot").value = rec&&rec.totBasis!=null?rec.totBasis:(model.totLine!=null?model.totLine:"");
  $("#settleModal").classList.add("show");
}
$("#smClose").onclick = ()=> $("#settleModal").classList.remove("show");
$("#settleModal").addEventListener("click",(e)=>{ if(e.target.id==="settleModal") e.target.classList.remove("show"); });
$("#smSave").onclick = ()=>{
  const m=_smTarget; if(!m) return;
  const a=parseInt($("#smAway").value,10), h=parseInt($("#smHome").value,10);
  if(isNaN(a)||isNaN(h)){ alert("請填兩隊比分"); return; }
  const fav=$("#smFav").value||null, hd=parseFloat($("#smHd").value), tot=parseFloat($("#smTot").value);
  gameUpsert({ sid:m.officialId, date:m.date, league:m.league, awayTeam:m.away, homeTeam:m.home,
    awayScore:a, homeScore:h, hdFav:fav, hdVal:(fav&&!isNaN(hd))?Math.abs(hd):null,
    totBasis:isNaN(tot)?null:tot, mlOffered:m.mlOffered!==false, manual:true });
  bumpGamesVersion(); saveDoc(doc); $("#settleModal").classList.remove("show"); render();
};
$("#smReset").onclick = ()=>{
  const m=_smTarget; if(!m) return;
  doc.games = (doc.games||[]).filter(x=>!(x.sid===m.officialId || (x.date===m.date && x.league===m.league && x.awayTeam===m.away && x.homeTeam===m.home)));
  bumpGamesVersion(); saveDoc(doc);
  autoSettleFromPregame();                       // 管線有結果就立刻回填（非手動）
  loadSeedGames();                               // 歷史場回種子
  $("#settleModal").classList.remove("show"); render();
};

// ===== 卡片（棒球 renderCardB 1:1 移植;model=管線場次+item 使用者狀態） =====
function renderCardW(model){
  const it = model._item;
  const el = document.createElement("div");
  el.className = "card bcard"; el.dataset.id = model.officialId;

  const favSide = model.hdFav || "home";
  const undSide = favSide==="away"?"home":"away";
  const favName = favSide==="away"?model.away:model.home;
  const undName = undSide==="away"?model.away:model.home;

  // conflict / strong（棒球邏輯移植;無 dampen 來源故 strong 直判）
  const mlConflict  = it.mlAway.lights>0 && it.mlHome.lights>0;
  const hdConflict  = it.hdGive.lights>0 && it.hdRecv.lights>0;
  const totConflict = it.over.lights>0  && it.under.lights>0;
  const oppML = (undSide==="away") ? it.mlAway.lights : it.mlHome.lights;
  const crossConflict = it.hdGive.lights>0 && oppML>0;
  const strongSignal = !crossConflict && (
    (!mlConflict  && (it.mlAway.lights>=3 || it.mlHome.lights>=3)) ||
    (!hdConflict  && (it.hdGive.lights>=3 || it.hdRecv.lights>=3)) ||
    (!totConflict && (it.over.lights>=3  || it.under.lights>=3)) );
  if(mlConflict||hdConflict||totConflict) el.classList.add("has-conflict");
  else if(crossConflict) el.classList.add("has-cross");
  else if(strongSignal) el.classList.add("has-strong");

  const settledRec = gameFind(model.officialId, model.date, model.league, model.away, model.home);
  const settled = settledRec && settledRec.awayScore!=null;
  if(settled) el.classList.add("settled");

  const season = seasonOf(model.date);
  const intl = model.league==="WNBA" ? intlFor(model) : null;
  const lsw = model.league==="WNBA" ? lswFor(model) : 0;
  const picks = model.league==="WNBA" ? epFor(model) : [];
  const rowCounts = epRowCounts(model, picks, favName, undName);

  /* ---------- 標頭 ---------- */
  const head = document.createElement("div"); head.className="bhead";
  const time = document.createElement("span"); time.className="btime";
  time.textContent = fmtDate(model.date) + (model.time ? " "+model.time : "");
  const hsp = document.createElement("span"); hsp.className="bhead-sp";
  head.append(time, hsp);
  if(picks.length){ const epb=document.createElement("button"); epb.className="bbadge"; epb.textContent=`明牌 ×${picks.length}`; epb.title="玩運彩合格高手推薦（點開名單）"; epb.onclick=()=>openEpPanel(model,picks); head.appendChild(epb); }
  if(settled){ const sm=document.createElement("span"); sm.className="bbadge done"; sm.textContent="✓ 已結算"; sm.title="點擊修改（手動覆蓋管線）"; sm.onclick=()=>openSettleModal(model); head.appendChild(sm); }
  if(model.status==="postponed"){ const pd=document.createElement("span"); pd.className="bbadge ppd"; pd.textContent="⏸ 延賽"; pd.title="來源判定延賽,此卡不會結算"; head.appendChild(pd); }
  const hasLine = model.hdSrc==="運彩" && model.hdVal!=null;
  const preB = document.createElement("button"); preB.className="bbadge"+(hasLine?" done":""); preB.textContent = hasLine?"賽前 ✓":"賽前 待盤"; preB.title = hasLine?"台彩盤口已到位 / 點開結算視窗":"台彩尚未開盤 / 點開結算視窗"; preB.onclick=()=>openSettleModal(model);
  const colB = document.createElement("span"); colB.className="bico"; colB.textContent = it.collapsed?"▸":"▾"; colB.title=it.collapsed?"展開":"收合"; colB.onclick=()=>{ it.collapsed=!it.collapsed; saveDoc(doc); render(); };
  const delB = document.createElement("span"); delB.className="bico bdel"; delB.textContent="✕"; delB.title="刪除（此日期不再顯示這張卡）"; delB.onclick=()=>{ it.hidden=true; saveDoc(doc); render(); };
  head.append(preB, colB, delB);
  head.title = "右鍵 → 開結算視窗";
  head.addEventListener("contextmenu", (e)=>{ e.preventDefault(); openSettleModal(model); });
  el.appendChild(head);

  /* ---------- 橫幅（顛倒家族;優先序同棒球:顛倒>曾對調） ---------- */
  const intlFlip = intl && hasLine && ((intl.fav==="away") !== (favSide==="away"));
  if(intlFlip){
    el.classList.add("flip");
    const bn=document.createElement("div"); bn.className="bflipbanner";
    bn.innerHTML="<span class='ic'>⇅</span>平台顛倒：台彩與 bet365 讓分方相反";
    el.appendChild(bn);
  } else if(lsw>0 || (intl && intl.flips>0)){
    el.classList.add("flip-swap");
    const bn=document.createElement("div"); bn.className="bflipbanner swap";
    bn.innerHTML=`<span class='ic'>⇆</span>賽前讓分方曾對調（台彩換邊 ${lsw} 次${intl&&intl.flips?`・bet365 換邊 ${intl.flips} 次`:""}）`;
    el.appendChild(bn);
  }

  if(!it.collapsed){
    const body = document.createElement("div"); body.className="bbody";

    /* ----- 左：計分板（棒球同構;比分外緣、隊名內側;中央=LIVE chip/VS＋節數表） ----- */
    const live = model.status==="inprogress";
    const finPending = model.status==="finished" && !settled;
    const showScore = model.awayScore!=null && model.homeScore!=null;
    const score = document.createElement("div"); score.className="bscore";
    function nameEl(side){
      const nm = document.createElement("div"); nm.className="bteam-nm";
      nm.appendChild(document.createTextNode(side==="away"?model.away:model.home));
      const info = document.createElement("span"); info.className="binfo"; info.textContent="i"; info.title="近況勝負";
      info.onclick=(e)=>{ e.stopPropagation(); bTogglePop(info, bFormHTML(model.league, side==="away"?model.away:model.home)); };
      nm.appendChild(info);
      return nm;
    }
    function scoreEl(side){
      if(!showScore) return null;
      const sc=document.createElement("div"); sc.className="bteam-sc"+((live||finPending)?" live":"");
      sc.textContent = side==="away"?model.awayScore:model.homeScore;
      return sc;
    }
    function teamBlock(side, order){
      const wrap = document.createElement("div"); wrap.className="bteam "+side;
      order.forEach(k=>{ const e = (k==="score")?scoreEl(side):nameEl(side); if(e) wrap.appendChild(e); });
      return wrap;
    }
    const mid = document.createElement("div"); mid.className="bmid";
    const vsEl = document.createElement("div");
    if(live){ vsEl.className="blivechip on"; vsEl.textContent = model.inning||"LIVE"; vsEl.title="進行中（即時比分,每輪刷新）"; }
    else if(finPending){ vsEl.className="blivechip fin"; vsEl.textContent="終場待結算"; vsEl.title="已終場,管線結算中"; }
    else { vsEl.className="bvs"; vsEl.textContent="VS"; }
    mid.appendChild(vsEl);
    if((model.qAway&&model.qAway.length)||(model.qHome&&model.qHome.length)){
      const nQ = Math.max(4, (model.qAway||[]).length, (model.qHome||[]).length);
      let th="<tr><th></th>"; for(let i=1;i<=nQ;i++) th+=`<th>${i<=4?"Q"+i:"OT"}</th>`; th+="</tr>";
      const cells=(arr)=>{ let h=""; for(let i=0;i<nQ;i++){ const v=(arr||[])[i]; const liveq = live && i===(arr||[]).length-1; h+=`<td class="${liveq?"liveq":""}">${v==null?"–":v}</td>`; } return h; };
      const t=document.createElement("table"); t.className="bqs";
      t.innerHTML = `${th}<tr><td class="side">客</td>${cells(model.qAway)}</tr><tr><td class="side">主</td>${cells(model.qHome)}</tr>`;
      mid.appendChild(t);
    }
    score.append(teamBlock("away",["score","name"]), mid, teamBlock("home",["name","score"]));
    body.appendChild(score);

    /* ----- 右：分析區 ----- */
    const ana = document.createElement("div"); ana.className="bana";
    const ahead = document.createElement("div"); ahead.className="bana-head";
    const albl = document.createElement("span"); albl.className="bana-lbl"; albl.textContent="過盤率";
    const venueTog = document.createElement("span"); venueTog.className="bvenue";
    [["venue","主客"],["all","綜"]].forEach(([v,lab])=>{
      const b=document.createElement("button"); b.textContent=lab; if(doc.covMode===v) b.classList.add("on");
      b.onclick=()=>{ doc.covMode=v; saveDoc(doc); render(); };
      venueTog.appendChild(b);
    });
    ahead.append(albl, venueTog);
    ana.appendChild(ahead);

    function mktRow(badge, badgeCls, name, hv, lightObj, coverHTML, conflict, epN){
      const row=document.createElement("div"); row.className="bmkt-row"+(conflict?" conflict":"");
      const b=document.createElement("span"); b.className="bside "+(badgeCls||""); b.textContent=badge;
      const nm=document.createElement("span"); nm.className="bnm"; nm.title="點隊名／標籤＝減一盞燈";
      nm.innerHTML = esc(name)+(hv?` <span class="hv">${esc(hv)}</span>`:"");
      nm.onclick=()=>{ if(lightObj.lights>0){ lightObj.lights--; saveDoc(doc); render(); } };
      const lightsEl = bLightsEl(lightObj);
      const ep=document.createElement("span"); ep.className="ep-cell";
      if(epN>0){ const n=document.createElement("span"); n.className="ep-n"; n.textContent=epN; n.title="這選項的明牌數（點開名單）"; n.onclick=(e)=>{ e.stopPropagation(); openEpPanel(model,picks); }; ep.appendChild(n); }
      const chip=document.createElement("span"); chip.className="betchip"+(lightObj.bet?" on":""); chip.textContent="注";
      chip.title = lightObj.bet ? "已標記自主下注（點擊取消）" : "標記：這選項我實際下注了（與明牌分開統計）";
      chip.onclick=(e)=>{ e.stopPropagation(); lightObj.bet=!lightObj.bet; saveDoc(doc); render(); };
      row.append(b, nm, lightsEl, ep, chip, _firstEl(coverHTML));
      return row;
    }
    function mktSecHead(label, conflict, extras, cmtHTML){
      const sec=document.createElement("div"); sec.className="bmkt-sec"+(conflict?" conflict":"");
      const mn=document.createElement("span"); mn.className="mname"; mn.textContent=label; sec.appendChild(mn);
      (extras||[]).forEach(x=> x && sec.appendChild(x));
      const sp=document.createElement("span"); sp.className="mksp"; sec.appendChild(sp);
      const cmt=document.createElement("span"); cmt.className="bcmt"+(cmtHTML&&cmtHTML.strong?" strong":""); if(cmtHTML) cmt.innerHTML=cmtHTML.html; sec.appendChild(cmt);
      return sec;
    }
    const wrapDiv = ()=>{ const d=document.createElement("div"); d.className="bmkt"; return d; };

    // 賠率趨勢評語（bet365 賽前序列;棒球由 odds addon 寫入,此處同語彙自算）
    function hdTrend(){
      if(!intl) return null;
      if(intl.flips>0) return { html:`<span class="l">賠率</span><span class="tm">讓分方曾換邊 ⇄${intl.flips}</span>`, strong:true };
      if(intl.move>=2.5) return { html:`<span class="l">賠率</span><span class="tm">大幅轉向 ${esc(intl.dir<0?model.away:model.home)}讓分</span>`, strong:true };
      if(intl.move>=1) return { html:`<span class="l">賠率</span><span class="tm">看好 ${esc(intl.dir<0?model.away:model.home)}讓分</span>` };
      return { html:`<span class="l">賠率</span>持平` };
    }
    function ouTrend(){
      if(!intl || !intl.ouMove) return null;
      const m = intl.ouMove;
      if(Math.abs(m)>=3) return { html:`<span class="l">賠率</span><span class="tm">大幅轉向 ${m>0?"大":"小"}分</span>`, strong:true };
      if(Math.abs(m)>=1) return { html:`<span class="l">賠率</span><span class="tm">轉向 ${m>0?"大":"小"}分</span>` };
      return null;
    }

    // 獨贏
    const mlWrap=wrapDiv();
    mlWrap.append(mktSecHead("獨贏", mlConflict, [], null),
      mktRow("客","", model.away, "", it.mlAway, bCoverHTML(pctInfo(model.league,season,model.away,"ml","away")), mlConflict, rowCounts.mlAway),
      mktRow("主","", model.home, "", it.mlHome, bCoverHTML(pctInfo(model.league,season,model.home,"ml","home")), mlConflict, rowCounts.mlHome));
    ana.appendChild(mlWrap);

    // 讓分（⇄=手動換讓分方,燈跟隊;棒球同款）
    const hdWrap=wrapDiv();
    const swap=document.createElement("span"); swap.className="bswap"; swap.textContent="⇄"; swap.title="切換讓分方（燈跟隊走）";
    swap.onclick=()=>{ it.hdSwap=!it.hdSwap; const t=it.hdGive; it.hdGive=it.hdRecv; it.hdRecv=t; saveDoc(doc); render(); };
    const hv = model.hdVal!=null ? String(model.hdVal) : "";
    hdWrap.append(mktSecHead("讓分", hdConflict, [swap], hdTrend()),
      mktRow("讓","give", favName, hv?("−"+hv):"", it.hdGive, bCoverHTML(pctInfo(model.league,season,favName,"hd",favSide)), hdConflict, rowCounts.hdGive),
      mktRow("受讓","recv", undName, hv?("+"+hv):"", it.hdRecv, bCoverHTML(pctInfo(model.league,season,undName,"recv",undSide)), hdConflict, rowCounts.hdRecv));
    ana.appendChild(hdWrap);

    // 國際軸藍帶（bet365＋台彩;棒球同構;唯讀）
    if(intl || hasLine){
      const dotc = intlFlip ? "#e08020" : ((lsw>0||(intl&&intl.flips>0)) ? "#2bbfa0" : "#5b6b80");
      const strip=document.createElement("div"); strip.className="intl-strip";
      strip.innerHTML = `<span style="width:9px;height:9px;border-radius:50%;background:${dotc};flex:0 0 auto;"></span>`+
        `<span>🌐 <b style="color:#3aa0ff">${intl?("bet365 "+esc(intl.fav==="away"?model.away:model.home)+"讓"+intl.il):"bet365 未開盤"}</b>・`+
        `<b style="color:#ffd08a">${hasLine?("台彩 "+esc(favName)+"讓"+model.hdVal):"台彩未開盤"}</b></span>`;
      const more=document.createElement("div"); more.className="intl-more";
      more.innerHTML = (intl?((intl.flips?`⇄${intl.flips}＝bet365 讓分方今天換邊 ${intl.flips} 次`: `bet365 讓分方今天未換邊`)+`・初盤 ${intl.open.line} → 現時 ${intl.latest.line}（線移 ${intl.move.toFixed(1)} 分）`):"bet365 尚未開盤")+
        (lsw?`<br>台彩換邊 ⇄${lsw}（序列偵測）`:"")+
        `<br>此帶唯讀（國際軸），不會改卡片任何欄位。`;
      strip.onclick=(e)=>{ e.stopPropagation(); strip.classList.toggle("open"); };
      ana.appendChild(strip); ana.appendChild(more);
    }

    // 大小（基準=可編輯,預設帶台彩線;棒球同款）
    const totWrap=wrapDiv();
    const basis=document.createElement("span"); basis.className="basis";
    const tv = (it.totVal!=null && it.totVal!=="") ? it.totVal : (model.totLine!=null?String(model.totLine):"");
    basis.innerHTML="基準 ";
    const tinp=document.createElement("input"); tinp.type="number"; tinp.step="1"; tinp.min="0.5"; tinp.inputMode="decimal"; tinp.value=tv;
    tinp.onclick=(e)=>e.stopPropagation();
    tinp.oninput=()=>{ it.totVal = tinp.value.trim(); saveDoc(doc); };
    basis.appendChild(tinp);
    const aT=pctInfo(model.league,season,model.away,"tot","away"), hT=pctInfo(model.league,season,model.home,"tot","home");
    let overPct=null, lowS=false, samp=0;
    if(aT||hT){ const arr=[aT,hT].filter(Boolean); overPct=arr.reduce((s,x)=>s+x.pn,0)/arr.length; lowS=arr.some(x=>x.lowSample); samp=Math.min.apply(null,arr.map(x=>x.sample)); }
    function totCover(isOver){
      if(overPct==null) return `<span class="bcover ls">—</span>`;
      const pn = isOver ? overPct : (1-overPct);
      const cls = lowS ? "ls" : (pn>=0.55?"hi":(pn<0.40?"lo":""));
      const ss = lowS ? `<span class="ss">(${samp})</span>` : "";
      return `<span class="bcover ${cls}">${Math.round(pn*100)}%${ss}</span>`;
    }
    totWrap.append(mktSecHead("大小", totConflict, [basis], ouTrend()),
      mktRow("大","", "大", tv, it.over, totCover(true), totConflict, rowCounts.over),
      mktRow("小","", "小", tv, it.under, totCover(false), totConflict, rowCounts.under));
    ana.appendChild(totWrap);

    body.appendChild(ana);
    el.appendChild(body);
  }

  /* ---------- 已結算結果 pills（棒球同款;≥3 燈選項＋比分） ---------- */
  if(settled){
    const s = settledRec;
    const bs=document.createElement("div"); bs.className="bsettled";
    const sp=document.createElement("span"); sp.className="bpill sc"; sp.textContent=`${model.away} ${s.awayScore} : ${s.homeScore} ${model.home}`; bs.appendChild(sp);
    const margin = s.homeScore - s.awayScore;
    const out=(market,side)=>{
      if(market==="ml"){ if(margin===0) return "void"; const w = margin>0?"home":"away"; return w===side?"hit":"miss"; }
      if(market==="hd"){ if(!s.hdFav||s.hdVal==null) return "void";
        const favM = s.hdFav==="home"?margin:-margin; const d=favM-s.hdVal;
        if(d===0) return "void"; const cov=d>0;
        return side==="give"?(cov?"hit":"miss"):(cov?"miss":"hit"); }
      if(market==="tot"){ const basis = (it.totVal!=null&&it.totVal!=="")?parseFloat(it.totVal):s.totBasis;
        if(basis==null||isNaN(basis)) return "void";
        const t=s.awayScore+s.homeScore; if(t===basis) return "void";
        return (t>basis)===(side==="over")?"hit":"miss"; }
      return null;
    };
    const mark=o=> o==="hit"?"✓":(o==="miss"?"✗":"－");
    const pill=(txt,n,o)=>{ const p=document.createElement("span"); p.className="bpill "+(o||""); p.textContent=`${mark(o)} ${txt} ●${n}`; bs.appendChild(p); };
    if(it.mlAway.lights>=3) pill(model.away, it.mlAway.lights, out("ml","away"));
    if(it.mlHome.lights>=3) pill(model.home, it.mlHome.lights, out("ml","home"));
    if(it.hdGive.lights>=3) pill(`${favName}讓${model.hdVal!=null?" "+model.hdVal:""}`, it.hdGive.lights, out("hd","give"));
    if(it.hdRecv.lights>=3) pill(`${undName}受讓${model.hdVal!=null?" "+model.hdVal:""}`, it.hdRecv.lights, out("hd","recv"));
    if(it.over.lights>=3)   pill(`大${tvOf(it,model)}`, it.over.lights, out("tot","over"));
    if(it.under.lights>=3)  pill(`小${tvOf(it,model)}`, it.under.lights, out("tot","under"));
    if(bs.children.length) el.appendChild(bs);
  }
  return el;
}
function tvOf(it,model){ const v=(it.totVal!=null&&it.totVal!=="")?it.totVal:(model.totLine!=null?model.totLine:""); return v!==""?" "+v:""; }

// 管線場次 → 卡片 model（含使用者 ⇄ 覆蓋讓分方）
function modelFromPregame(g){
  const it = ensureItem(g.date, g.officialId);
  let hdFav = g.hdFav;
  if(it.hdSwap && hdFav) hdFav = hdFav==="away"?"home":"away";
  return { ...g, hdFav, _item: it };
}

// ===== 日期列 =====
function renderDates(){
  const bar = document.getElementById("datebar");
  bar.querySelectorAll(".dbtn").forEach(b=>b.remove());
  const dates = Object.keys(doc.boards).sort();
  for(const g of pregameCache.games||[]) if(!dates.includes(g.date)) dates.push(g.date);
  if(!dates.includes(doc.activeDate)) dates.push(doc.activeDate);
  for(const d of dates.sort()){
    const b=document.createElement("button"); b.className="dbtn"+(d===doc.activeDate?" on":"");
    b.textContent=fmtDate(d);
    b.onclick=()=>{ doc.activeDate=d; saveDoc(doc); render(); };
    bar.appendChild(b);
  }
}

// ===== 隊伍統計頁（前輪已驗收,原樣保留） =====
let statsSort = { market:null, venue:null, dir:"desc" };
function sortIndicator(m, v){
  if(statsSort.market!==m || statsSort.venue!==(v||null)) return "";
  return statsSort.dir==="desc" ? " ▼" : " ▲";
}
function setSort(m, v){
  if(statsSort.market===m && statsSort.venue===(v||null)){
    if(statsSort.dir==="desc") statsSort.dir="asc";
    else statsSort = { market:null, venue:null, dir:"desc" };
  } else statsSort = { market:m, venue:v||null, dir:"desc" };
  renderStatsPage();
}
function sortedTeams(league, teams, season){
  if(!statsSort.market) return teams;
  const m = statsSort.market, v = statsSort.venue;
  const val = (team)=>{
    if(m==="runs"){ const r=runsRead(league, season, team, v); return r.games? (r.scored-r.conceded)/r.games : -Infinity; }
    if(m==="streak"){ const s=streakRead(league, season, team, v); return s.kind==="W"? s.n : -s.n; }
    const p = pctNum(statRead(league, season, team, m, v));
    return p==null ? -Infinity : p;
  };
  const arr = teams.map(t=>[t, val(t)]);
  arr.sort((a,b)=> statsSort.dir==="desc" ? b[1]-a[1] : a[1]-b[1]);
  return arr.map(x=>x[0]);
}
function teamsForToday(league){
  const s = new Set();
  for(const g of (doc.games||[])) if(g.league===league && g.date===doc.activeDate){ s.add(g.awayTeam); s.add(g.homeTeam); }
  for(const g of (pregameCache.games||[])) if(g.date===doc.activeDate){ s.add(g.away); s.add(g.home); }
  return s;
}
function isMobileLayout(){ return window.matchMedia("(max-width:700px)").matches; }
function fillStatsSeasons(league){
  const sel = $("#statsSeason"); const cur = sel.value;
  const ys = [...new Set((doc.games||[]).filter(g=>g.league===league).map(g=>seasonOf(g.date)))].sort().reverse();
  if(!ys.length) ys.push(seasonOf(doc.activeDate));
  sel.innerHTML = ys.map(y=>`<option value="${y}">${y} 賽季</option>`).join("");
  sel.value = ys.includes(cur) ? cur : ys[0];
}
function openStatsPage(){
  $("#statsLeague").value = doc.activeLeague;
  fillStatsSeasons(doc.activeLeague);
  $("#statspage").classList.add("show");
  renderStatsPage();
}
function closeStatsPage(){ $("#statspage").classList.remove("show"); }
function renderStatsPage(){
  const body = $("#statsBody"); if(!body) return;
  const league = $("#statsLeague").value;
  const season = $("#statsSeason").value || seasonOf(doc.activeDate);
  const filter = $("#statsFilter").value;
  const todaySet = teamsForToday(league);
  let teams = LEAGUES[league].teams.slice();
  if(filter==="today" && todaySet.size>0) teams = teams.filter(t=>todaySet.has(t));
  teams = sortedTeams(league, teams, season);
  const markets = [["ml","獨贏"],["hd","讓分"],["recv","受讓"],["tot","大分"]];
  const lgColor = LEAGUES[league].colorHex;

  if(isMobileLayout()){
    body.innerHTML = "";
    if(!teams.length){ body.innerHTML = `<div style="color:var(--ink-dim);padding:20px;text-align:center">沒有符合條件的隊伍。試試「全部隊伍」。</div>`; return; }
    teams.forEach(team=>{
      const card = document.createElement("div"); card.className="stats-team";
      card.innerHTML = `<div class="tname"><span class="swatch" style="background:${lgColor}"></span>${esc(team)}</div>`;
      markets.forEach(([m,label])=>{
        const mkt = document.createElement("div"); mkt.className="mkt";
        mkt.innerHTML = `<div class="label">${label}</div>`;
        const cells = document.createElement("div"); cells.className="cells";
        ["home","away",null].forEach(v=>{
          const vlabel = v==="home"?"主":(v==="away"?"客":"全");
          const rec = statRead(league, season, team, m, v);
          const empty = (rec.w===0 && rec.l===0);
          const pn = pctNum(rec);
          const pctClass = pn==null?"":(pn>=0.55?"pcthi":(pn<0.40?"pctlo":""));
          const cell = document.createElement("div");
          cell.className = "statcell"+(empty?" empty":"");
          cell.innerHTML = `<span class="colhd">${vlabel}</span><span class="wl">${rec.w}-${rec.l}</span><span class="spct ${pctClass}">${pctStr(rec)||"—"}</span>`;
          cells.appendChild(cell);
        });
        mkt.appendChild(cells);
        card.appendChild(mkt);
      });
      { const mkt = document.createElement("div"); mkt.className="mkt";
        mkt.innerHTML = `<div class="label">得失分</div>`;
        const cells = document.createElement("div"); cells.className="cells";
        ["home","away",null].forEach(v=>{
          const vlabel = v==="home"?"主":(v==="away"?"客":"全");
          const r = runsRead(league, season, team, v);
          const cell = document.createElement("div");
          cell.className = "statcell"+(r.games===0?" empty":"");
          cell.innerHTML = r.games===0 ? `<span class="colhd">${vlabel}</span><span class="wl">—</span><span class="spct">—</span>`
            : `<span class="colhd">${vlabel}</span><span class="wl">${r.scored}-${r.conceded}</span><span class="spct">${(r.scored/r.games).toFixed(1)}/${(r.conceded/r.games).toFixed(1)}</span>`;
          cells.appendChild(cell);
        });
        mkt.appendChild(cells); card.appendChild(mkt); }
      { const mkt = document.createElement("div"); mkt.className="mkt";
        mkt.innerHTML = `<div class="label">連勝</div>`;
        const cells = document.createElement("div"); cells.className="cells";
        ["home","away",null].forEach(v=>{
          const vlabel = v==="home"?"主":(v==="away"?"客":"全");
          const s = streakRead(league, season, team, v);
          const cls = s.kind==="W"&&s.n>0 ? "pcthi" : (s.kind==="L"&&s.n>0 ? "pctlo" : "");
          const cell = document.createElement("div");
          cell.className = "statcell"+(s.n===0?" empty":"");
          cell.innerHTML = `<span class="colhd">${vlabel}</span><span class="wl ${cls}">${streakStr(s)}</span>`;
          cells.appendChild(cell);
        });
        mkt.appendChild(cells); card.appendChild(mkt); }
      body.appendChild(card);
    });
  } else {
    const extras = [["runs","得失分"],["streak","連勝"]];
    let html = `<table class="stats-table"><thead><tr><th rowspan="2" style="text-align:left">隊伍</th>`;
    markets.forEach(([_,label])=>{ html += `<th colspan="3" class="group">${label}</th>`; });
    extras.forEach(([_,label])=>{ html += `<th colspan="3" class="group">${label}</th>`; });
    html += `</tr><tr>`;
    [...markets, ...extras].forEach(([m,_])=>{
      ["home","away",null].forEach((v,idx)=>{
        const vlabel = v==="home"?"主":(v==="away"?"客":"全");
        html += `<th class="${idx===0?"group sortable":"sortable"}" data-sm="${m}" data-sv="${v==null?"":v}">${vlabel}${sortIndicator(m,v)}</th>`;
      });
    });
    html += `</tr></thead><tbody>`;
    const colSpan = 1 + (markets.length+extras.length)*3;
    if(!teams.length) html += `<tr><td colspan="${colSpan}" style="color:var(--ink-dim);padding:30px;text-align:center">沒有符合條件的隊伍。試試「全部隊伍」。</td></tr>`;
    teams.forEach(team=>{
      html += `<tr><td class="team">${esc(team)}</td>`;
      markets.forEach(([m,_])=>{
        ["home","away",null].forEach((v,idx)=>{
          const rec = statRead(league, season, team, m, v);
          const empty = (rec.w===0 && rec.l===0);
          const pn = pctNum(rec);
          const pctClass = pn==null?"":(pn>=0.55?"pcthi":(pn<0.40?"pctlo":""));
          html += `<td${idx===0?' class="group"':''}><span class="statcell${empty?' empty':''}"><span class="wl">${rec.w}-${rec.l}</span><span class="spct ${pctClass}">${pctStr(rec)||"—"}</span></span></td>`;
        });
      });
      ["home","away",null].forEach((v,idx)=>{
        const r = runsRead(league, season, team, v);
        html += r.games===0
          ? `<td${idx===0?' class="group"':''}><span class="statcell empty"><span class="wl">—</span><span class="spct">—</span></span></td>`
          : `<td${idx===0?' class="group"':''}><span class="statcell"><span class="wl">${r.scored}-${r.conceded}</span><span class="spct">${(r.scored/r.games).toFixed(1)}/${(r.conceded/r.games).toFixed(1)}</span></span></td>`;
      });
      ["home","away",null].forEach((v,idx)=>{
        const s = streakRead(league, season, team, v);
        const cls = s.kind==="W"&&s.n>0 ? "pcthi" : (s.kind==="L"&&s.n>0 ? "pctlo" : "");
        html += `<td${idx===0?' class="group"':''}><span class="statcell${s.n===0?' empty':''}"><span class="wl ${cls}">${streakStr(s)}</span></span></td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table>`;
    body.innerHTML = html;
    body.querySelectorAll("th.sortable").forEach(th=>{
      th.onclick = ()=> setSort(th.dataset.sm, th.dataset.sv || null);
    });
  }
}
["statsLeague","statsSeason","statsFilter"].forEach(id=>{
  const el = document.getElementById(id);
  if(el) el.onchange = ()=>{ if(id==="statsLeague") fillStatsSeasons(el.value); renderStatsPage(); };
});
$("#statsBtn").onclick = openStatsPage;
$("#statsClose").onclick = closeStatsPage;
let _rsz = null;
window.addEventListener("resize", ()=>{ clearTimeout(_rsz); _rsz = setTimeout(()=>{ if($("#statspage").classList.contains("show")) renderStatsPage(); }, 200); });

    const todays=(pregameCache.games||[]).filter(g=>g.date===doc.activeDate)
      .sort((a,b)=> (a.time||"") < (b.time||"") ? -1 : 1);
    const visible = todays.filter(g=>{ const it=ensureItem(g.date,g.officialId); return !it.hidden; });
    if(visible.length){
      for(const g of visible) board.appendChild(renderCardW(modelFromPregame(g)));

    }
    const e=document.createElement("div"); e.className="empty";
    const n = (doc.games||[]).filter(g=>g.league==="WNBA").length;

    board.appendChild(e);

    const e=document.createElement("div"); e.className="empty";
    e.innerHTML=`<b>NBA 排盤板</b><br>2026-27 賽季 10 月開打;管線沿用 WNBA 同架構（l1、allianceid 3）於開季前接入。`;
    board.appendChild(e);
  }
}
